questions:
- id: 1
  domain: identities-governance
  topic: entra-users-groups
  type: single
  text: HR gives you a CSV file with 200 new employees who need cloud-only accounts in your Microsoft
    Entra tenant today. You want to avoid creating each account by hand. What should you do?
  options:
  - id: A
    text: Invite the 200 people as guest users by using the B2B invitation flow.
    explanation: Guest invitations are for external identities. These are employees who need member accounts
      in your own directory.
  - id: B
    text: Create a dynamic security group that contains all 200 employees.
    explanation: A dynamic group evaluates membership of existing users. It does not create user accounts.
  - id: C
    text: Use the bulk create users operation in the Microsoft Entra admin center and upload the CSV file.
    explanation: Bulk create lets an administrator create many users from a CSV template in one operation.
  - id: D
    text: Assign the Contributor role to the CSV file's author at the subscription scope.
    explanation: Azure RBAC grants access to Azure resources. It does not create directory users.
  correct:
  - C
  explanation: Bulk operations in the Microsoft Entra admin center (or Microsoft Graph/PowerShell scripts)
    create many member users from a file. Guests, dynamic groups and RBAC solve different problems.
  difficulty: easy
  tags:
  - objective:entra-create-users-groups
  references:
  - https://learn.microsoft.com/en-us/entra/fundamentals/how-to-create-delete-users
- id: 2
  domain: identities-governance
  topic: entra-users-groups
  type: single
  text: A security group named Sales-Dynamic uses the membership type Dynamic User with the rule (user.department
    -eq "Sales"). A new contractor in the Marketing department must be given the same resource access
    as Sales for one week. You try to add the contractor directly to Sales-Dynamic. What is the outcome?
  options:
  - id: A
    text: You cannot manually add or remove members of a dynamic membership group; membership is determined
      only by the rule.
    explanation: Correct. Dynamic groups are populated by rule evaluation. To add the contractor, change
      the rule or use an assigned group instead.
  - id: B
    text: The contractor is added and stays a member until the next rule evaluation removes them.
    explanation: Manual addition is not allowed in the first place.
  - id: C
    text: The contractor is added and the rule is automatically changed to include them.
    explanation: Rules are never rewritten automatically.
  - id: D
    text: The contractor is added as a guest member that is exempt from the rule.
    explanation: There is no exemption mechanism for dynamic groups.
  correct:
  - A
  explanation: Members of a dynamic group are managed by its rule. Use an assigned security group (or
    adjust the rule) when you need hand-picked members.
  difficulty: medium
  tags:
  - objective:entra-manage-properties
  - objective:entra-create-users-groups
  references:
  - https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
  - https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-groups
- id: 3
  domain: identities-governance
  topic: entra-users-groups
  type: single
  text: You assign a Microsoft 365 license to a security group by using group-based licensing. Most members
    receive the license, but four newly created users show a license assignment error and no license.
    The four users have no value for Usage location. What should you do to resolve the error?
  options:
  - id: A
    text: Remove the four users and re-add them to the group without changing anything.
    explanation: The same missing-property error would recur.
  - id: B
    text: Assign the Owner role on the subscription to the four users.
    explanation: Azure RBAC roles have no effect on license assignment.
  - id: C
    text: Convert the security group into a Microsoft 365 group.
    explanation: The group type does not fix a missing user property.
  - id: D
    text: Set the Usage location property for the four users and then reprocess the group licenses.
    explanation: Correct. A usage location is required to assign a license; setting it and reprocessing
      lets the assignment succeed.
  correct:
  - D
  explanation: Group-based licensing fails for users whose usage location is not set. Set the property,
    then reprocess the licenses for the group or users.
  difficulty: medium
  tags:
  - objective:entra-licenses
  - objective:entra-manage-properties
  references:
  - https://learn.microsoft.com/en-us/entra/fundamentals/concept-group-based-licensing
  - https://learn.microsoft.com/en-us/entra/identity/users/licensing-groups-resolve-problems
- id: 4
  domain: identities-governance
  topic: entra-users-groups
  type: single
  text: A user named Priya has a Microsoft Entra ID P1 license assigned directly to her account. She also
    inherits the same product license through membership in the group Analysts, which uses group-based
    licensing. You remove Priya from Analysts. What happens to her license?
  options:
  - id: A
    text: Priya loses the license because group removal always revokes every assignment of that product.
    explanation: Only the group-inherited assignment is removed.
  - id: B
    text: Priya keeps the license because the direct assignment is independent of the group-based assignment.
    explanation: Correct. A user can hold both direct and inherited assignments of the same license; removing
      one source leaves the other.
  - id: C
    text: Priya's account is disabled until an administrator reassigns the license.
    explanation: Licensing changes do not disable accounts.
  - id: D
    text: Priya's license is automatically converted to a guest license.
    explanation: No such conversion exists.
  correct:
  - B
  explanation: A license can come from multiple sources. Removing the user from the group removes only
    the inherited assignment; the direct assignment remains.
  difficulty: hard
  tags:
  - objective:entra-licenses
  references:
  - https://learn.microsoft.com/en-us/entra/identity/users/licensing-groups-assign
  - https://learn.microsoft.com/en-us/entra/fundamentals/concept-group-based-licensing
- id: 5
  domain: identities-governance
  topic: entra-users-groups
  type: single
  text: A consultant at a partner company must collaborate on resources in your tenant by using their
    own corporate credentials. You invite the consultant's email address in the Microsoft Entra admin
    center. Which statement about the result is correct?
  options:
  - id: A
    text: A member user is created and you must share a password with the consultant.
    explanation: Invitations create guest users that authenticate with their home identity; no password
      is issued.
  - id: B
    text: The consultant automatically receives Contributor access to all subscriptions in the tenant.
    explanation: Invitation does not grant any Azure RBAC access.
  - id: C
    text: The invitation is rejected unless the consultant's company is also an Azure customer.
    explanation: The partner does not need an Azure subscription.
  - id: D
    text: A guest user object is created, and the consultant has no access to Azure resources until permissions
      are granted.
    explanation: Correct. Collaboration and resource authorization are separate; you must still assign
      roles or group memberships.
  correct:
  - D
  explanation: Microsoft Entra B2B collaboration creates a guest user that signs in with an external identity.
    Access to resources must be granted separately.
  difficulty: easy
  tags:
  - objective:entra-external-users
  references:
  - https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b
  - https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settings-configure
- id: 6
  domain: identities-governance
  topic: entra-users-groups
  type: multiple
  text: Your company wants to limit which people can invite external guests into the tenant. Which two
    items control who is allowed to send guest invitations? Choose 2.
  options:
  - id: A
    text: The self-service password reset scope setting
    explanation: SSPR scope controls who can reset their own password, not who can invite guests.
  - id: B
    text: The guest invite settings in the external collaboration settings
    explanation: Correct. These settings determine who in the organization may invite guests.
  - id: C
    text: An Azure Policy assignment at the root management group
    explanation: Azure Policy evaluates Azure resource properties, not directory invitations.
  - id: D
    text: A group-based license assignment for the Inviters group
    explanation: Licenses enable product features; they do not control invitation rights.
  - id: E
    text: Membership in the Guest Inviter directory role
    explanation: Correct. The Guest Inviter role lets a user invite guests when invitations are restricted
      to specific roles.
  correct:
  - B
  - E
  explanation: Invitation rights are controlled through the guest invite restrictions in external collaboration
    settings and directory roles such as Guest Inviter.
  difficulty: medium
  tags:
  - objective:entra-external-users
  references:
  - https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settings-configure
  - https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b
- id: 7
  domain: identities-governance
  topic: entra-users-groups
  type: single
  text: You plan to pilot self-service password reset with the 40 members of the group Pilot-Users only.
    All other users must continue to call the help desk. How should you configure SSPR?
  options:
  - id: A
    text: Set the SSPR enabled setting to Selected and choose the Pilot-Users group.
    explanation: Correct. The Selected scope enables SSPR only for members of the specified group.
  - id: B
    text: Set SSPR to All and then remove licenses from everyone except Pilot-Users.
    explanation: All enables SSPR for every user; licenses are not the scoping mechanism.
  - id: C
    text: Set SSPR to None and assign Pilot-Users the Password Administrator role.
    explanation: That grants administrative reset rights over other users; it does not enable self-service.
  - id: D
    text: Create a Conditional Access policy that blocks everyone except Pilot-Users.
    explanation: Conditional Access governs sign-in, not SSPR enablement.
  correct:
  - A
  explanation: SSPR can be set to None, Selected (one group) or All. Selected is the way to pilot with
    a subset.
  difficulty: medium
  tags:
  - objective:entra-sspr
  references:
  - https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr
  - https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
- id: 8
  domain: identities-governance
  topic: entra-users-groups
  type: single
  text: SSPR is enabled for all users and the policy requires two authentication methods. A user who has
    never visited the registration page selects Forgot my password and is told to contact an administrator.
    What is the most likely cause?
  options:
  - id: A
    text: The user has no Azure RBAC role on any subscription.
    explanation: Azure RBAC is unrelated to SSPR.
  - id: B
    text: The user's account is a guest in another tenant.
    explanation: Nothing in the scenario indicates this, and it would not explain the described message.
  - id: C
    text: The user has not registered the required authentication methods for password reset.
    explanation: Correct. SSPR needs the user to have registered the required number of methods (for example
      phone or authenticator app) before they can reset.
  - id: D
    text: The Contributor role is not assigned to the user at the tenant root.
    explanation: Contributor is an Azure RBAC role and has no bearing on password reset.
  correct:
  - C
  explanation: Enabling SSPR is not enough; users must register enough authentication methods to satisfy
    the policy, otherwise they are directed to an administrator.
  difficulty: medium
  tags:
  - objective:entra-sspr
  references:
  - https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-howitworks
  - https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr
- id: 9
  domain: identities-governance
  topic: azure-rbac
  type: single
  text: An auditor must be able to view every resource in a subscription, including configuration, but
    must not be able to create, modify or delete anything. Which built-in role should you assign?
  options:
  - id: A
    text: Contributor
    explanation: Contributor can create and modify resources.
  - id: B
    text: Reader
    explanation: Correct. Reader allows viewing resources only.
  - id: C
    text: User Access Administrator
    explanation: This role manages access assignments and is not a view-only role.
  - id: D
    text: Owner
    explanation: Owner has full access, including managing resources and role assignments.
  correct:
  - B
  explanation: Reader provides read-only visibility at the scope where it is assigned, which matches least
    privilege for an auditor.
  difficulty: easy
  tags:
  - objective:rbac-built-in-roles
  - objective:rbac-scope-assignments
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
- id: 10
  domain: identities-governance
  topic: azure-rbac
  type: single
  text: A helpdesk group must be able to create, start, stop and resize virtual machines in resource group
    rg-apps. The group must not be able to grant access to others and must not manage the virtual network
    or storage account that the VMs connect to. Which built-in role is the best fit?
  options:
  - id: A
    text: Owner
    explanation: Owner can also assign roles and manage every resource type.
  - id: B
    text: Contributor
    explanation: Contributor cannot grant access, but it can manage all resource types, including networks
      and storage.
  - id: C
    text: Virtual Machine Contributor
    explanation: Correct. It manages virtual machines but does not grant access to the virtual network
      or storage account they use.
  - id: D
    text: Reader
    explanation: Reader cannot create or change VMs.
  correct:
  - C
  explanation: Service-specific roles narrow permissions. Virtual Machine Contributor lets a team manage
    VMs without broad rights over related resources or access management.
  difficulty: medium
  tags:
  - objective:rbac-built-in-roles
  - objective:rbac-scope-assignments
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/best-practices
- id: 11
  domain: identities-governance
  topic: azure-rbac
  type: single
  text: A development team needs to manage all resources in the resource group rg-shop, including resources
    that will be created there next month. The team must have no access to any other resource group in
    the subscription. At which scope should you assign the Contributor role to the team's group?
  options:
  - id: A
    text: The resource group rg-shop
    explanation: Correct. The assignment is inherited by all current and future resources in the group
      and by nothing else.
  - id: B
    text: The subscription
    explanation: This would grant access to all other resource groups as well.
  - id: C
    text: Each existing resource in rg-shop individually
    explanation: Future resources would not be covered, and it adds administrative overhead.
  - id: D
    text: The tenant root management group
    explanation: This is the broadest possible scope and violates least privilege.
  correct:
  - A
  explanation: Choose the lowest scope that contains all required targets. A resource group assignment
    covers existing and future child resources.
  difficulty: easy
  tags:
  - objective:rbac-scope-assignments
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-portal
- id: 12
  domain: identities-governance
  topic: azure-rbac
  type: multiple
  text: Which two statements about Azure RBAC scope and inheritance are correct? Choose 2.
  options:
  - id: A
    text: A role assigned at a management group applies to the subscriptions beneath it.
    explanation: Correct. Role assignments are inherited down the hierarchy.
  - id: B
    text: A role assigned to a resource group also applies to its sibling resource groups.
    explanation: Assignments flow downward to children, not sideways to siblings.
  - id: C
    text: Assigning Reader on a single resource removes Contributor permissions inherited from the subscription.
    explanation: RBAC is additive; a narrower assignment does not reduce permissions inherited from a
      parent scope.
  - id: D
    text: A role assigned at a resource group applies to resources that are created in that group later.
    explanation: Correct. Child resources inherit the assignment, including those created after the assignment.
  - id: E
    text: A role assigned at subscription scope is never inherited by resource groups.
    explanation: Resource groups do inherit subscription-scope assignments.
  correct:
  - A
  - D
  explanation: Azure RBAC assignments are inherited from parent to child scopes and are additive.
  difficulty: medium
  tags:
  - objective:rbac-scope-assignments
  - objective:rbac-interpret-access
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
- id: 13
  domain: identities-governance
  topic: azure-rbac
  type: single
  text: Maria has the Reader role on the subscription Sub-Prod and the Contributor role on the resource
    group rg-web, which is in Sub-Prod. Maria tries to delete a virtual machine in the resource group
    rg-data, also in Sub-Prod. What is the result?
  options:
  - id: A
    text: The deletion succeeds because Contributor overrides Reader everywhere in the subscription.
    explanation: Contributor was assigned only at rg-web, so it does not apply to rg-data.
  - id: B
    text: The deletion succeeds because Reader on the subscription includes delete rights.
    explanation: Reader is view-only.
  - id: C
    text: The deletion succeeds but only after a 24-hour approval workflow.
    explanation: No such workflow exists in Azure RBAC.
  - id: D
    text: The deletion fails because Maria's effective permissions on rg-data come only from Reader.
    explanation: Correct. The Contributor assignment applies to rg-web only; on rg-data she has the inherited
      Reader role.
  correct:
  - D
  explanation: Effective permissions are the union of assignments that apply to the target's scope or
    its parents. Only Reader reaches rg-data.
  difficulty: medium
  tags:
  - objective:rbac-interpret-access
  - objective:rbac-scope-assignments
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-list-portal
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/scope-overview
- id: 14
  domain: identities-governance
  topic: azure-rbac
  type: single
  text: Contoso's Entra tenant has a user who holds the Global Administrator directory role. The user
    signs in to the Azure portal and cannot see any of the subscriptions' resources or assign roles on
    them. Which statement explains this and gives a valid remedy?
  options:
  - id: A
    text: Global Administrator is a license; assign the user an Azure Active Directory Premium license.
    explanation: Global Administrator is a directory role, not a license, and licenses do not grant Azure
      RBAC access.
  - id: B
    text: Entra directory roles do not grant Azure RBAC access by default; the user can enable Access
      management for Azure resources to get User Access Administrator at root scope.
    explanation: Correct. Elevating access is a deliberate action for Global Administrators and should
      be removed after use.
  - id: C
    text: Global Administrator access to Azure resources takes up to seven days to propagate.
    explanation: Propagation delays are minutes, and the cause here is a separate authorization system.
  - id: D
    text: The user must be added to a dynamic group named Azure Admins.
    explanation: No such built-in group grants Azure access.
  correct:
  - B
  explanation: Microsoft Entra roles and Azure roles are separate. A Global Administrator can elevate
    access to manage all subscriptions and management groups by getting User Access Administrator at the
    root scope.
  difficulty: hard
  tags:
  - objective:rbac-interpret-access
  - objective:rbac-built-in-roles
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
- id: 15
  domain: identities-governance
  topic: azure-rbac
  type: single
  text: An engineer has the Contributor role on a storage account. Using Microsoft Entra authorization
    in Azure Storage Explorer, the engineer cannot read the contents of a blob and receives an authorization
    error. What is the best least-privilege fix?
  options:
  - id: A
    text: Assign the Owner role on the subscription.
    explanation: Excessively broad, and Owner is still a management-plane role.
  - id: B
    text: Assign the Reader role on the storage account.
    explanation: Reader is a management-plane role and does not allow reading blob data.
  - id: C
    text: Assign Storage Blob Data Reader on the storage account or container.
    explanation: Correct. Reading blob data is a data-plane action that requires a data role.
  - id: D
    text: Assign the Global Reader directory role.
    explanation: Directory roles do not authorize Azure Storage data actions.
  correct:
  - C
  explanation: Management roles such as Contributor cover control-plane actions. Blob reads with Entra
    authorization need a data role such as Storage Blob Data Reader.
  difficulty: medium
  tags:
  - objective:rbac-built-in-roles
  - objective:rbac-interpret-access
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
- id: 16
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  text: A policy definition with the Deny effect requires a CostCenter tag on all new resource groups.
    It is assigned to a subscription that already contains 60 resource groups without that tag. What happens
    to the existing resource groups?
  options:
  - id: A
    text: They are marked as non-compliant, but they are not deleted or changed by the Deny effect.
    explanation: Correct. Deny blocks non-compliant create or update requests, while existing resources
      are only reported as non-compliant.
  - id: B
    text: They are deleted at the next evaluation cycle.
    explanation: Azure Policy does not delete existing resources.
  - id: C
    text: They are automatically tagged with a default CostCenter value.
    explanation: Adding tags needs the Modify or Append effect.
  - id: D
    text: They are locked with a ReadOnly lock.
    explanation: Policy does not create locks.
  correct:
  - A
  explanation: Deny acts on new or updated resources. Existing noncompliant resources are shown in the
    compliance report.
  difficulty: medium
  tags:
  - objective:gov-azure-policy
  - objective:gov-resource-tags
  references:
  - https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
  - https://learn.microsoft.com/en-us/azure/governance/policy/how-to/get-compliance-data
- id: 17
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  text: You must make sure every resource inherits the Environment tag value from its resource group,
    including 500 resources that already exist. You will use an Azure Policy assignment. Which approach
    meets the requirement?
  options:
  - id: A
    text: Assign a policy with the Audit effect and wait for resources to correct themselves.
    explanation: Audit only reports non-compliance.
  - id: B
    text: Assign a policy with the Deny effect that blocks resources without the tag.
    explanation: Deny blocks future requests but does not add tags to existing resources.
  - id: C
    text: Apply a ReadOnly lock on every resource group.
    explanation: Locks restrict operations; they do not copy tags.
  - id: D
    text: Assign a policy with the Modify effect (for example the built-in policy to inherit a tag from
      the resource group) and run a remediation task for existing resources.
    explanation: Correct. Modify adds or updates tags on new resources, and a remediation task (using
      the assignment's managed identity) fixes existing ones.
  correct:
  - D
  explanation: Tags are not inherited automatically. Modify policies add tags during create or update,
    and remediation tasks bring existing resources into compliance.
  difficulty: hard
  tags:
  - objective:gov-azure-policy
  - objective:gov-resource-tags
  references:
  - https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
- id: 18
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  text: An organization has 12 subscriptions that belong to different business units. Security requires
    that resources in all of them can be deployed only in West Europe and North Europe, and that this
    stays true for future subscriptions in the same group. What is the most efficient approach?
  options:
  - id: A
    text: Assign the Allowed locations policy separately on each of the 12 resource groups.
    explanation: This is repetitive and misses new subscriptions and other resource groups.
  - id: B
    text: Place the subscriptions in a management group and assign the Allowed locations policy to that
      management group.
    explanation: Correct. The assignment is inherited by all current and future subscriptions in the management
      group.
  - id: C
    text: Give each business unit the Reader role so that they cannot pick other regions.
    explanation: Reader would also prevent legitimate deployments, and RBAC does not restrict regions.
  - id: D
    text: Create a budget alert for each subscription.
    explanation: Budgets monitor cost and do not restrict deployment locations.
  correct:
  - B
  explanation: Management groups provide a scope above subscriptions where Azure Policy assignments are
    inherited.
  difficulty: medium
  tags:
  - objective:gov-management-groups
  - objective:gov-azure-policy
  references:
  - https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - https://learn.microsoft.com/en-us/azure/governance/policy/overview
- id: 19
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  text: A production resource group has a Delete lock. A user who has the Owner role on the subscription
    tries to delete a virtual machine in the group and is blocked. The deletion is legitimate. What must
    be done?
  options:
  - id: A
    text: Wait one hour, because locks expire automatically.
    explanation: Locks never expire; they must be removed.
  - id: B
    text: Assign the Contributor role to the user at the resource group.
    explanation: Role assignments cannot override a lock.
  - id: C
    text: Remove the Delete lock (or the inherited lock) first, delete the VM, and then recreate the lock.
    explanation: Correct. Locks apply to everyone regardless of role, and child resources inherit the
      lock.
  - id: D
    text: Delete the lock on the VM, because the lock on the resource group is ignored.
    explanation: Locks on a parent scope are inherited by its resources.
  correct:
  - C
  explanation: Resource locks override RBAC permissions. The lock must be removed, by someone with lock
    permissions such as Owner, before the operation is allowed.
  difficulty: medium
  tags:
  - objective:gov-resource-locks
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
- id: 20
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  text: You tagged the resource group rg-sales with Project=Apollo. Finance exports a cost report filtered
    by Project=Apollo and sees no costs for the virtual machines in rg-sales, which were created without
    tags. Why?
  options:
  - id: A
    text: Costs are never available for virtual machines.
    explanation: VM costs are reported in Cost Management.
  - id: B
    text: The report must be filtered at the tenant level.
    explanation: Scope does not change how tags apply to resources.
  - id: C
    text: Tags with the name Project are reserved.
    explanation: The name is not reserved.
  - id: D
    text: Tags applied to a resource group are not inherited by the resources inside it.
    explanation: Correct. Resources must be tagged themselves, for example by using Azure Policy to add
      or inherit the tag.
  correct:
  - D
  explanation: Azure resource tags do not automatically inherit from the resource group or subscription.
    Use policy, scripts or templates to apply them to resources.
  difficulty: easy
  tags:
  - objective:gov-resource-tags
  - objective:gov-cost-controls
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
- id: 21
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  text: You create a resource group in East US. Can you deploy a virtual machine into that group in West
    Europe?
  options:
  - id: A
    text: No. A resource group and all of its resources must be in the same region.
    explanation: Resources in a resource group can be located in different regions.
  - id: B
    text: Yes. The resource group location only stores the group's metadata, and resources can be in different
      regions.
    explanation: Correct. Consider the metadata location for availability of the group's management data.
  - id: C
    text: Yes, but only if you first create a nested resource group in West Europe.
    explanation: Resource groups cannot be nested.
  - id: D
    text: No, unless the subscription is moved to a management group.
    explanation: Management groups do not govern resource placement in this way.
  correct:
  - B
  explanation: The resource group location is where metadata about the group is stored; resources inside
    it may be in any supported region.
  difficulty: easy
  tags:
  - objective:gov-resource-groups
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-portal
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
- id: 22
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  text: Fabrikam moves an Azure subscription to a different Microsoft Entra directory (tenant) as part
    of a company reorganization. Several users have Azure role assignments on resources in the subscription.
    What is the effect on those role assignments?
  options:
  - id: A
    text: They are removed and must be recreated in the new directory.
    explanation: Correct. Role assignments are tied to the original directory's principals and are not
      carried over.
  - id: B
    text: They are preserved because the subscription ID does not change.
    explanation: Assignments reference directory principals that do not exist in the new tenant.
  - id: C
    text: Only Owner assignments are preserved.
    explanation: No role assignments are preserved.
  - id: D
    text: They are converted into guest users in the new directory.
    explanation: There is no automatic conversion.
  correct:
  - A
  explanation: Changing a subscription's directory deletes its role assignments (and affects managed identities
    and similar directory-bound items). Resources are not deleted, but access must be reconfigured.
  difficulty: hard
  tags:
  - objective:gov-subscriptions
  - objective:rbac-interpret-access
  references:
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/manage/billing-subscription-transfer
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/transfer-subscription
- id: 23
  domain: identities-governance
  topic: subscriptions-governance
  type: multiple
  text: A team creates a monthly budget of 5,000 USD on a subscription. Which two statements about Azure
    budgets are correct? Choose 2.
  options:
  - id: A
    text: When the budget is reached, Azure automatically stops all virtual machines in the subscription.
    explanation: Budgets do not stop resources on their own.
  - id: B
    text: Budgets can only be created at subscription scope.
    explanation: Budgets can also be created at other scopes such as resource groups or management groups.
  - id: C
    text: A budget can trigger an action group so that automation or notifications run when a threshold
      is met.
    explanation: Correct. Action groups can send notifications or start automation.
  - id: D
    text: A budget alert can be based on forecasted spending as well as actual spending.
    explanation: Correct. Alert conditions can use actual or forecasted costs.
  - id: E
    text: Exceeding the budget disables the subscription until the next billing period.
    explanation: A budget is not a spending limit.
  correct:
  - C
  - D
  explanation: Budgets are monitoring and notification tools. They can alert on actual or forecasted cost
    and call action groups, but they do not cap spending.
  difficulty: medium
  tags:
  - objective:gov-cost-controls
  references:
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/cost-mgt-alerts-monitor-usage-spending
- id: 24
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  text: Management wants a list of actionable suggestions for reducing spend, such as shutting down or
    resizing underused virtual machines. Which Azure service provides personalized recommendations like
    these?
  options:
  - id: A
    text: Azure Policy
    explanation: Policy evaluates configuration compliance; it does not analyze utilization for savings.
  - id: B
    text: Resource locks
    explanation: Locks restrict operations and provide no recommendations.
  - id: C
    text: Azure Advisor
    explanation: Correct. Advisor's cost recommendations include right-sizing or shutting down underutilized
      resources.
  - id: D
    text: Microsoft Entra ID Governance
    explanation: This governs identities and access, not resource costs.
  correct:
  - C
  explanation: Azure Advisor analyzes resource configuration and usage telemetry to provide recommendations,
    including for cost. It does not enforce or apply them automatically.
  difficulty: easy
  tags:
  - objective:gov-cost-controls
  references:
  - https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
  - https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations
- id: 25
  domain: identities-governance
  topic: subscriptions-governance
  type: multiple
  text: You are designing a management group hierarchy. Which two statements are correct? Choose 2.
  options:
  - id: A
    text: A subscription can belong to only one management group at a time.
    explanation: Correct. Each subscription has a single parent management group.
  - id: B
    text: A management group can have multiple parent management groups.
    explanation: Each management group has one parent (except the root).
  - id: C
    text: A subscription can be in two management groups so it receives both groups' policies.
    explanation: A subscription has exactly one parent.
  - id: D
    text: Resource groups can be direct children of a management group.
    explanation: Only management groups and subscriptions can be children of a management group.
  - id: E
    text: An Azure Policy assignment at a management group applies to all subscriptions beneath it.
    explanation: Correct. Assignments are inherited by child management groups and subscriptions.
  correct:
  - A
  - E
  explanation: Management groups form a single-parent tree whose children are management groups or subscriptions.
    Policy and RBAC assignments are inherited down the tree.
  difficulty: hard
  tags:
  - objective:gov-management-groups
  - objective:gov-subscriptions
  references:
  - https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - https://learn.microsoft.com/en-us/azure/governance/management-groups/how-to/protect-resource-hierarchy
- id: 26
  domain: storage
  topic: storage-access
  type: single
  text: A data-processing job has the Storage Blob Data Reader role on a container. The storage account
    firewall allows requests only from subnet A, but the job runs from subnet B and its request is denied.
    What must the administrator do to allow the job while retaining the existing data authorization model?
  options:
  - id: A
    text: Permit subnet B through the storage account's network rules, keeping the role assignment in
      place.
    explanation: Network access and data authorization are separate checks; both must allow the request.
  - id: B
    text: Assign the job the Owner role at the subscription scope.
    explanation: A broader role does not bypass the storage firewall and grants unnecessary management
      access.
  - id: C
    text: Enable anonymous blob access for the account.
    explanation: Anonymous access changes the authorization model and does not solve the subnet restriction
      safely.
  - id: D
    text: Replace the container role assignment with a private DNS zone.
    explanation: DNS alone does not authorize data operations or permit a blocked network path.
  correct:
  - A
  explanation: The request must pass both storage network rules and authorization. Add the required subnet
    or another approved network path without replacing the existing least-privilege data role.
  difficulty: easy
  tags:
  - objective:storage-network-controls
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
- id: 27
  domain: storage
  topic: storage-access
  type: single
  text: A contractor needs to download blobs from one container for four hours. The contractor does not
    have an account in the organization's tenant. Which access method best limits the delegated capability?
  options:
  - id: A
    text: Provide the storage account's primary access key and ask the contractor to use read-only commands.
    explanation: An account key provides broad account-level authority and client behavior is not a security
      boundary.
  - id: B
    text: Create an account SAS that permits read and write operations across all storage services.
    explanation: This grants a much broader scope and more permissions than the task requires.
  - id: C
    text: Create a short-lived, HTTPS-only, read-only SAS scoped to the required container, using a user
      delegation key where supported for the scenario.
    explanation: A narrowly scoped SAS limits resource, operation, protocol, and validity period; user
      delegation avoids signing with the account key.
  - id: D
    text: Assign the contractor Storage Account Contributor on the subscription.
    explanation: This is management-plane access at an unnecessarily broad scope and does not express
      a four-hour read-only delegation.
  correct:
  - C
  explanation: A SAS can delegate time-limited access with specified scope and permissions. For Blob Storage,
    Microsoft recommends user delegation SAS when appropriate; regardless of signing method, keep permissions,
    resource scope, protocol, and expiry minimal.
  difficulty: medium
  tags:
  - objective:storage-sas
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
- id: 28
  domain: storage
  topic: storage-access
  type: single
  text: An application uses an ad hoc service SAS for a file share. Administrators need to be able to
    revoke the SAS before its encoded expiry time without rotating the storage account key. Which supported
    configuration should they use when issuing the SAS?
  options:
  - id: A
    text: Add the SAS to a Microsoft Entra access package.
    explanation: Access packages do not govern or revoke an Azure Storage service SAS.
  - id: B
    text: Associate the service SAS with a stored access policy on the file share.
    explanation: A stored access policy can govern supported service SAS tokens and can be changed or
      removed to revoke them.
  - id: C
    text: Create an account SAS and attach a stored access policy to it.
    explanation: Account SAS tokens do not support stored access policies.
  - id: D
    text: Add the SAS URL to an Azure Policy exemption.
    explanation: Azure Policy exemptions do not manage SAS token validity or permissions.
  correct:
  - B
  explanation: For supported services, a service SAS can reference a stored access policy. Changing or
    deleting that policy can revoke associated SAS access; account SAS and user delegation SAS do not
    support stored access policies.
  difficulty: medium
  tags:
  - objective:storage-access-policies
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-stored-access-policy-define-dotnet
- id: 29
  domain: storage
  topic: storage-access
  type: multiple
  text: An operations team is performing a planned rotation of the two storage account access keys. Which
    TWO actions help rotate the key used by an application without interrupting access? Choose 2.
  options:
  - id: A
    text: Update the application to use the other valid key, then verify that it can access storage.
    explanation: Switching consumers to the alternate key lets the key currently in use be regenerated
      safely.
  - id: B
    text: Regenerate the key currently used by the application before changing the application configuration.
    explanation: The application will continue using a key whose value has just changed and can lose access.
  - id: C
    text: Delete the storage account so both keys are invalidated.
    explanation: Deleting the account is destructive and is not a key-rotation procedure.
  - id: D
    text: After confirming consumers use the alternate key, regenerate the old key.
    explanation: Regenerating the key no longer in use completes the rotation without invalidating the
      application's active credential.
  - id: E
    text: Store both keys in the application's source code so it can switch automatically.
    explanation: Embedding secrets in source code exposes credentials and does not provide controlled
      rotation.
  correct:
  - A
  - D
  explanation: Azure provides two account keys to support rotation. Move consumers to the other key and
    validate access before regenerating the old key; protect keys as secrets throughout the process.
  difficulty: medium
  tags:
  - objective:storage-account-keys
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
- id: 30
  domain: storage
  topic: storage-access
  type: single
  text: Employees on Windows clients must access an Azure file share over SMB with their individual directory
    identities and file-level permissions. Which configuration meets the requirement without distributing
    the storage account key to each employee?
  options:
  - id: A
    text: Configure anonymous access on the storage account and hide the share name.
    explanation: Hiding a name is not authorization, and anonymous access does not provide per-user file
      permissions.
  - id: B
    text: Give every employee the storage account key and rely on NTFS permissions on their PCs.
    explanation: The shared account key is broad credential access and client-side permissions do not
      authorize access in Azure Files.
  - id: C
    text: Create a container-level blob SAS and mount it as an SMB share.
    explanation: A blob SAS is not an SMB identity configuration for an Azure file share.
  - id: D
    text: Enable a supported identity source for SMB, assign share-level access, and configure file or
      directory permissions for the identities.
    explanation: Azure Files SMB identity-based access combines authentication with share-level and file/directory
      authorization.
  correct:
  - D
  explanation: Azure Files supports identity-based authentication over SMB with supported identity sources.
    Access requires appropriate share-level permission and file or directory permissions; network access
    is configured separately.
  difficulty: hard
  tags:
  - objective:files-identity-access
  references:
  - https://learn.microsoft.com/en-us/azure/storage/files/storage-files-active-directory-overview
- id: 31
  domain: storage
  topic: storage-accounts
  type: single
  text: A new application needs both Blob Storage and Azure Files in one storage account. The team wants
    a broadly compatible account type for common Azure Storage services and will select supported performance
    and redundancy options for its region. Which account type should it create?
  options:
  - id: A
    text: A premium block blob account, which is required for all file shares and all blob workloads.
    explanation: Premium block blob accounts are specialized and are not the general-purpose account type
      for these services.
  - id: B
    text: A standard general-purpose v2 storage account.
    explanation: General-purpose v2 accounts support common Azure Storage services, including blobs and
      file shares, subject to feature and region availability.
  - id: C
    text: A storage account that supports only Azure Queue Storage.
    explanation: A queue-only account cannot meet the Blob Storage and Azure Files requirements.
  - id: D
    text: A classic general-purpose v1 account because new accounts cannot use v2.
    explanation: General-purpose v2 is the current broadly recommended account type; the stated limitation
      is incorrect.
  correct:
  - B
  explanation: A standard general-purpose v2 account supports common Blob Storage and Azure Files scenarios.
    The team must still check current feature, performance, redundancy, and regional availability constraints
    before deployment.
  difficulty: easy
  tags:
  - objective:storage-account-create
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
- id: 32
  domain: storage
  topic: storage-accounts
  type: single
  text: A business-critical service must continue reading and writing its storage account if one availability
    zone in the primary region becomes unavailable. The data must remain replicated within that region.
    Which redundancy option best matches these requirements?
  options:
  - id: A
    text: Locally redundant storage (LRS), which keeps its replicas in one physical datacenter.
    explanation: LRS protects against local hardware failures but does not distribute replicas across
      availability zones.
  - id: B
    text: Geo-redundant storage (GRS), which provides read access to the secondary region at all times.
    explanation: GRS asynchronously copies data to a secondary region, but secondary reads are not available
      without a read-access option; it does not describe the stated in-region requirement.
  - id: C
    text: Zone-redundant storage (ZRS), which synchronously replicates across availability zones in the
      primary region.
    explanation: ZRS is designed to maintain in-region copies across zones and support access through
      a zone outage, where available.
  - id: D
    text: Read-access geo-redundant storage (RA-GRS), which stores all replicas in the primary region
      only.
    explanation: RA-GRS includes asynchronous replication to a secondary region, so it is not the in-region-only
      choice.
  correct:
  - C
  explanation: ZRS synchronously replicates data across availability zones in the primary region. It addresses
    a zone outage; it does not by itself provide protection against a regional disaster.
  difficulty: medium
  tags:
  - objective:storage-redundancy
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
- id: 33
  domain: storage
  topic: storage-accounts
  type: multiple
  text: An administrator is preparing two supported block blob storage accounts for Azure Blob object
    replication. Which THREE prerequisites must be configured for the replication policy? Choose 3.
  options:
  - id: A
    text: Enable blob versioning on the source account.
    explanation: Object replication requires versioning to be enabled on the source account.
  - id: B
    text: Enable blob versioning on the destination account.
    explanation: Object replication requires versioning to be enabled on the destination account as well.
  - id: C
    text: Enable the change feed on the source account.
    explanation: The source change feed is a prerequisite used to track changes for replication.
  - id: D
    text: Disable versioning on the destination account after the first copy completes.
    explanation: Disabling destination versioning violates a prerequisite and does not configure an ongoing
      policy.
  - id: E
    text: Configure the destination to use an Azure Files share rather than a blob account.
    explanation: Object replication copies blobs between supported blob storage accounts, not to an Azure
      Files share.
  correct:
  - A
  - B
  - C
  explanation: For supported scenarios, configure blob versioning on both source and destination and enable
    the source change feed before creating the object replication policy. Replication is asynchronous
    and is not a substitute for backup or deletion protection.
  difficulty: hard
  tags:
  - objective:storage-object-replication
  references:
  - https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
- id: 34
  domain: storage
  topic: storage-accounts
  type: single
  text: A compliance team requires the organization to control the key used to protect data at rest in
    a supported storage account. Which change directly meets that key-ownership requirement?
  options:
  - id: A
    text: Configure customer-managed keys for storage service encryption using a supported key store.
    explanation: Customer-managed keys let the organization manage the encryption key, with corresponding
      key-management responsibilities.
  - id: B
    text: Turn off encryption at rest and require TLS for client connections.
    explanation: TLS protects data in transit and does not provide customer control of the at-rest encryption
      key.
  - id: C
    text: Add a private endpoint and leave the default encryption configuration unchanged.
    explanation: A private endpoint controls network access; it does not change ownership of the encryption
      key.
  - id: D
    text: Rotate the storage account access keys more frequently.
    explanation: Account access keys authorize requests and are not the encryption keys used for service
      encryption at rest.
  correct:
  - A
  explanation: Storage encryption at rest is enabled by default. Where supported, customer-managed keys
    can meet a requirement for customer-controlled key management, but they add key access, availability,
    and lifecycle responsibilities.
  difficulty: medium
  tags:
  - objective:storage-encryption
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-service-encryption
- id: 35
  domain: storage
  topic: storage-accounts
  type: single
  text: A migration engineer needs to copy a large directory tree to Azure Storage from a terminal and
    wants a command-line transfer utility designed for high-performance data movement. Which tool should
    the engineer choose?
  options:
  - id: A
    text: Azure Storage Explorer, using only its graphical interface.
    explanation: Storage Explorer is a graphical management tool; it is not the command-line utility requested.
  - id: B
    text: AzCopy.
    explanation: AzCopy is a command-line utility for copying data to and from Azure Storage.
  - id: C
    text: Azure Policy, which transfers data when a resource is compliant.
    explanation: Azure Policy evaluates and governs resources; it does not transfer storage data.
  - id: D
    text: Azure Monitor, which copies files when a metric alert fires.
    explanation: Azure Monitor collects and analyzes telemetry; it is not a data-transfer client.
  correct:
  - B
  explanation: AzCopy is a command-line tool for data transfer with Azure Storage. The engineer must still
    provide valid authorization and network access and should verify the destination after the transfer.
  difficulty: easy
  tags:
  - objective:storage-data-tools
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10
  - https://learn.microsoft.com/en-us/azure/vs-azure-tools-storage-manage-with-storage-explorer
- id: 36
  domain: storage
  topic: files-and-blobs
  type: multiple
  text: A department must restore a deleted Azure file share if it is removed and also recover a file
    from an earlier point in time while the share still exists. Which TWO protections address these different
    recovery needs? Choose 2.
  options:
  - id: A
    text: Enable Azure Files soft delete with an appropriate retention period for deleted shares.
    explanation: Azure Files soft delete provides a retention window during which a deleted share can
      be recovered.
  - id: B
    text: Configure share snapshots to preserve point-in-time views of the file share.
    explanation: Share snapshots provide point-in-time states that can be used to recover files from an
      earlier state.
  - id: C
    text: Enable Blob Storage versioning on the account.
    explanation: Blob versioning applies to blobs and does not protect Azure file shares.
  - id: D
    text: Set an Azure Blob lifecycle rule to move files to the archive tier.
    explanation: Blob lifecycle rules do not create Azure Files recovery points.
  - id: E
    text: Increase the storage account's redundancy from LRS to ZRS and rely on replicas for deleted files.
    explanation: Replication preserves changes, including deletions; it is not a point-in-time recovery
      feature.
  correct:
  - A
  - B
  explanation: Azure Files soft delete supports recovery of deleted shares, while share snapshots provide
    point-in-time share states for file recovery. They solve different problems and should be tested with
    the intended restore workflow.
  difficulty: hard
  tags:
  - objective:files-snapshots-soft-delete
  references:
  - https://learn.microsoft.com/en-us/azure/storage/files/storage-files-enable-soft-delete
  - https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
- id: 37
  domain: storage
  topic: files-and-blobs
  type: single
  text: An application stores photographs as objects in Azure Blob Storage. The administrator needs a
    logical grouping for related blobs and a scope for container-level operations. Which resource should
    the administrator create?
  options:
  - id: A
    text: A blob container within the storage account.
    explanation: Blob containers organize blobs within an account and are the relevant resource for container-level
      operations.
  - id: B
    text: An Azure Files directory, which is required to store all blobs.
    explanation: Azure Files directories are part of file shares, not the organizational container for
      Blob Storage objects.
  - id: C
    text: A storage account access key for each photograph.
    explanation: Keys are credentials and do not organize or contain blob data.
  - id: D
    text: A managed disk for each photograph.
    explanation: Managed disks provide block storage for virtual machines and are not Blob Storage containers.
  correct:
  - A
  explanation: Blob data is stored as blobs in containers, and containers are created within a storage
    account. A container is not an Azure Files share or a separate storage account.
  difficulty: easy
  tags:
  - objective:blob-container
  references:
  - https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
- id: 38
  domain: storage
  topic: files-and-blobs
  type: single
  text: A media archive contains block blobs that are rarely accessed. The organization can tolerate retrieval
    latency of several hours and wants the lowest storage cost among the blob access tiers. Which tier
    should it select, accepting the required retrieval and retention trade-offs?
  options:
  - id: A
    text: Hot, because it has the lowest storage cost and is optimized for infrequent access.
    explanation: Hot is optimized for frequent use and has higher storage costs than colder tiers.
  - id: B
    text: Cool, because archived blobs can be read immediately without rehydration.
    explanation: Cool is an online tier, but it does not provide the lowest storage cost for this rarely
      accessed, flexible-latency archive scenario.
  - id: C
    text: Archive, because it is an offline tier with low storage cost and requires rehydration before
      normal reads.
    explanation: Archive is designed for rarely accessed data with flexible latency; retrieval requires
      rehydration and minimum-retention costs apply.
  - id: D
    text: Cold, because it is an offline tier that requires rehydration for every read.
    explanation: Cold is an online tier designed for fast retrieval; archive is the offline tier.
  correct:
  - C
  explanation: The archive tier fits rarely accessed block blobs when retrieval can wait. A blob must
    be rehydrated to an online tier before it can be read normally, and the administrator must account
    for retrieval charges and minimum retention.
  difficulty: medium
  tags:
  - objective:blob-access-tiers
  references:
  - https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
- id: 39
  domain: storage
  topic: files-and-blobs
  type: single
  text: A user accidentally deletes a blob, and the organization wants a time-limited window in which
    an administrator can undelete it. Which Blob Storage feature should be enabled and configured?
  options:
  - id: A
    text: Azure Files share snapshots.
    explanation: Share snapshots protect Azure file shares, not deleted blobs.
  - id: B
    text: Storage account failover.
    explanation: Failover changes the account's primary region and does not provide a retention window
      for deleted blobs.
  - id: C
    text: A blob lifecycle rule that deletes blobs immediately.
    explanation: A deletion rule would cause deletion rather than provide a recovery window.
  - id: D
    text: Blob soft delete with a suitable retention period.
    explanation: Blob soft delete retains deleted blobs or containers for the configured period so they
      can be recovered.
  correct:
  - D
  explanation: Blob soft delete provides a configurable retention window for deleted data. It is distinct
    from versioning, which preserves prior blob states when writes or deletes occur, and from replication,
    which can replicate deletions.
  difficulty: medium
  tags:
  - objective:blob-soft-delete
  references:
  - https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview
- id: 40
  domain: storage
  topic: files-and-blobs
  type: single
  text: A department is creating an SMB file share for a shared working directory and wants to cap the
    share's configured capacity. Which step directly establishes that cap?
  options:
  - id: A
    text: Set a maximum size on every SMB client instead of configuring the share.
    explanation: Client-side settings do not establish the Azure file share's quota.
  - id: B
    text: Create the Azure file share and set its quota to the required capacity.
    explanation: The file share's quota configures its capacity limit, subject to the account and share
      type constraints.
  - id: C
    text: Configure a blob container lifecycle rule with a delete action.
    explanation: Blob lifecycle management does not configure Azure Files share capacity.
  - id: D
    text: Set the storage account's access key expiry date.
    explanation: Account key lifecycle settings control credentials and do not cap share capacity.
  correct:
  - B
  explanation: Create the Azure file share with an appropriate quota. The available quota and performance
    behavior depend on the share type and storage account configuration, which should be checked before
    provisioning.
  difficulty: medium
  tags:
  - objective:files-share
  references:
  - https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-create-file-share
- id: 41
  domain: storage
  topic: files-and-blobs
  type: single
  text: A team must automatically move current blobs to a lower-cost tier after a defined age, without
    an operator changing each blob manually. Which feature should the team configure?
  options:
  - id: A
    text: A stored access policy with a later expiry date.
    explanation: A stored access policy manages supported SAS constraints and does not tier blobs.
  - id: B
    text: Blob versioning with a new version for each blob.
    explanation: Versioning preserves previous blob states and does not automatically tier current blobs
      by age.
  - id: C
    text: Azure Blob lifecycle management with a rule matching the age and applying a tier action.
    explanation: Lifecycle rules can apply supported tiering or deletion actions when configured conditions
      are met.
  - id: D
    text: Azure Files share soft delete.
    explanation: Share soft delete protects deleted Azure file shares and does not manage blob tiers.
  correct:
  - C
  explanation: Azure Blob lifecycle management applies rule-based actions such as tiering eligible blobs
    based on configured conditions. Evaluation is asynchronous, so an action is not guaranteed to occur
    at the exact instant an age threshold is reached.
  difficulty: hard
  tags:
  - objective:blob-lifecycle
  references:
  - https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
- id: 42
  domain: storage
  topic: files-and-blobs
  type: single
  text: A publishing service overwrites existing block blobs, but editors must be able to restore the
    content as it existed before an overwrite. Which feature preserves prior blob states?
  options:
  - id: A
    text: Enable Blob Storage versioning.
    explanation: Versioning retains prior versions when a blob is modified or deleted, subject to the
      configured behavior and support.
  - id: B
    text: Enable Azure Files share quota tracking.
    explanation: A file share quota does not preserve prior blob contents.
  - id: C
    text: Configure an account SAS with write permission.
    explanation: A SAS delegates access; it does not preserve previous versions of a blob.
  - id: D
    text: Change the account to locally redundant storage.
    explanation: Redundancy copies current data and does not provide a historical version to restore.
  correct:
  - A
  explanation: Blob versioning creates previous blob versions as writes occur, which can be used to restore
    earlier content. Versioning differs from soft delete and should be configured alongside retention
    and lifecycle needs.
  difficulty: medium
  tags:
  - objective:blob-versioning
  references:
  - https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
- id: 43
  domain: storage
  topic: storage-access
  type: single
  text: A company requires clients in a virtual network to reach Azure Storage through a private IP address.
    Which endpoint should it configure, and what supporting configuration is important for clients to
    resolve the storage name to that private address?
  options:
  - id: A
    text: A service endpoint only; it assigns the storage service a private IP in the virtual network
      automatically.
    explanation: A service endpoint does not assign the storage service a private IP address in the virtual
      network.
  - id: B
    text: A storage firewall rule only; it creates a private DNS record for the account.
    explanation: Firewall rules restrict access but do not create a private endpoint or private DNS mapping.
  - id: C
    text: A public IP address on the client; DNS configuration is unnecessary.
    explanation: A public client address does not provide the requested private endpoint path.
  - id: D
    text: A private endpoint for the required storage subresource and correctly configured private DNS.
    explanation: A private endpoint maps the storage service to a private IP in the virtual network; correct
      DNS is needed for clients to use that private address.
  correct:
  - D
  explanation: A private endpoint provides a private IP path to a specific storage service subresource.
    Clients must resolve the service name appropriately through private DNS, and account network settings
    must permit the intended access path.
  difficulty: hard
  tags:
  - objective:storage-network-controls
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
- id: 44
  domain: compute
  topic: arm-bicep
  type: single
  text: "A deployment team maintains this ARM JSON resource. The same template must deploy the storage\
    \ account to different Azure regions without editing the resource body for each environment.\n\n \
    \   {\n      \"resources\": [{\n        \"type\": \"Microsoft.Storage/storageAccounts\",\n       \
    \ \"apiVersion\": \"2023-05-01\",\n        \"name\": \"stappdata01\",\n        \"location\": \"eastus\"\
    \n      }]\n    }\n\nWhich change best meets the requirement?"
  options:
  - id: A
    text: Replace the resource with a deployment script that moves it after deployment.
    explanation: A deployment script adds imperative steps and does not make the declared location reusable.
  - id: B
    text: Declare a `location` parameter and set the resource's `location` to `[parameters('location')]`.
    explanation: An ARM parameter supplies environment-specific input while keeping the resource declaration
      reusable.
  - id: C
    text: Set the resource API version to the current date so Azure selects the region.
    explanation: An API version selects the resource-provider schema, not the deployment region.
  - id: D
    text: Put `eastus` in an output and override the output at deployment time.
    explanation: Outputs report values; they do not configure resource properties.
  correct:
  - B
  explanation: A parameterized location is supplied when deploying the template, allowing the resource
    body to remain the same across environments.
  difficulty: medium
  tags:
  - objective:iac-interpret
  - objective:iac-modify-arm
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/syntax
- id: 45
  domain: compute
  topic: arm-bicep
  type: single
  text: "A team wants its Bicep deployment to use a different VM SKU in test and production while retaining\
    \ one source file. The current file contains:\n\n    resource vm 'Microsoft.Compute/virtualMachines@2024-03-01'\
    \ = {\n      name: 'api-vm'\n      location: resourceGroup().location\n      properties: {\n     \
    \   hardwareProfile: { vmSize: 'Standard_D2s_v5' }\n      }\n    }\n\nWhich edit is most appropriate?"
  options:
  - id: A
    text: Add a second resource with the production SKU and rely on Azure to choose one.
    explanation: Two resources would deploy two VMs; Azure does not select one based on environment.
  - id: B
    text: Change `resourceGroup().location` to the production region.
    explanation: That changes location, not the VM size, and hard-codes an environment choice.
  - id: C
    text: Declare `param vmSize string` and set `hardwareProfile.vmSize` to `vmSize`.
    explanation: A Bicep parameter is the correct mechanism for varying the desired SKU at deployment
      time.
  - id: D
    text: Add an output named `vmSize` with the production SKU.
    explanation: An output reports a value after deployment; it does not configure the VM.
  correct:
  - C
  explanation: A Bicep parameter makes the SKU an input while preserving a single declarative resource
    definition.
  difficulty: medium
  tags:
  - objective:iac-modify-bicep
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/syntax
- id: 46
  domain: compute
  topic: arm-bicep
  type: single
  text: A junior administrator has a validated Bicep file and needs to create its resources in an existing
    resource group named `rg-test` using Azure CLI. Which command is designed for this deployment?
  options:
  - id: A
    text: '`az deployment group create --resource-group rg-test --template-file main.bicep`'
    explanation: This starts a resource-group-scope deployment using the Bicep file.
  - id: B
    text: '`az group export --name rg-test --template-file main.bicep`'
    explanation: Export retrieves a template representation; it does not deploy the supplied file.
  - id: C
    text: '`az bicep decompile --file main.bicep --resource-group rg-test`'
    explanation: Decompile converts ARM JSON to Bicep; it does not deploy resources.
  - id: D
    text: '`az resource move --resource-group rg-test --template-file main.bicep`'
    explanation: The resource move operation does not deploy a template.
  correct:
  - A
  explanation: The Azure CLI resource-group deployment command accepts a Bicep file and deploys its declarations
    at resource-group scope.
  difficulty: easy
  tags:
  - objective:iac-deploy
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-cli
- id: 47
  domain: compute
  topic: arm-bicep
  type: single
  text: An organization has a JSON ARM template that it wants to use as the starting point for future
    Bicep authoring. Which approach is supported and appropriately cautious?
  options:
  - id: A
    text: Rename the `.json` file to `.bicep`; the syntax is interchangeable.
    explanation: ARM JSON and Bicep use different syntaxes; renaming does not convert the template.
  - id: B
    text: Export the deployed resources and assume the export includes all operational intent.
    explanation: An export can omit intent or configuration and is not guaranteed to be a complete source
      of truth.
  - id: C
    text: Deploy the JSON template as a container image and let Azure translate it.
    explanation: A container runtime does not convert ARM templates.
  - id: D
    text: Run `az bicep decompile --file main.json`, then review and test the generated Bicep.
    explanation: The Bicep decompile command converts ARM JSON to an initial Bicep file, which should
      be reviewed.
  correct:
  - D
  explanation: Decompilation is the supported conversion path; generated code is a starting point and
    should be reviewed and tested before use.
  difficulty: medium
  tags:
  - objective:iac-export-convert
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/decompile
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/export-template-portal
- id: 48
  domain: compute
  topic: arm-bicep
  type: multiple
  text: A Bicep deployment creates a virtual network and then a network-dependent resource. The dependent
    resource does not reference the virtual network symbol, so ARM cannot infer the ordering. The address
    prefix also differs by environment. Choose 2 actions that address these requirements.
  options:
  - id: A
    text: Expose the address prefix as a parameter and use it in the virtual-network declaration.
    explanation: A parameter allows the environment-specific value to be supplied without duplicating
      the template.
  - id: B
    text: Add an output containing the desired address prefix.
    explanation: An output only reports a deployment value; it does not vary the resource configuration.
  - id: C
    text: Declare an explicit dependency from the dependent resource to the virtual network.
    explanation: An explicit dependency expresses ordering when no resource reference establishes it implicitly.
  - id: D
    text: Add a delay to a deployment script and leave the resource declarations unordered.
    explanation: A fixed delay is not a reliable declarative dependency and can still race.
  - id: E
    text: Put the production address prefix in a variable and edit it manually for every deployment.
    explanation: Manual edits undermine the environment-specific input requirement and are less reusable
      than a parameter.
  correct:
  - A
  - C
  explanation: Use a parameter for the per-environment prefix and an explicit dependency when no reference
    lets ARM infer the required order.
  difficulty: hard
  tags:
  - objective:iac-interpret
  - objective:iac-deploy
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/syntax
- id: 49
  domain: compute
  topic: virtual-machines
  type: single
  text: A company is creating a Windows VM for a legacy application that requires administrative access
    to its guest operating system. The VM needs no public inbound access, and its NIC and OS disk must
    be created with it. Which configuration best fits?
  options:
  - id: A
    text: Create an App Service app and enable remote desktop on its platform instance.
    explanation: App Service does not provide the VM guest operating-system control required by the legacy
      application.
  - id: B
    text: Create an Azure VM with an OS image, size, managed OS disk, NIC in a VNet, and no public IP.
    explanation: These are the core VM dependencies, and omitting a public IP avoids unnecessary direct
      internet exposure.
  - id: C
    text: Create only a managed disk and attach it to an ACR repository.
    explanation: A disk stores VM data, and ACR stores container images; neither runs a guest OS by itself.
  - id: D
    text: Create a VM scale set with one instance and omit its network interface.
    explanation: VMs still require networking, and a scale set is not a substitute for required VM dependencies.
  correct:
  - B
  explanation: A VM provides guest OS control and is created with compute, networking, and disk dependencies;
    a public IP is optional and unnecessary here.
  difficulty: easy
  tags:
  - objective:vm-create
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview
  - https://learn.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview
- id: 50
  domain: compute
  topic: virtual-machines
  type: single
  text: A data-processing VM is CPU-adequate but runs out of memory during peak jobs. The team also needs
    the replacement SKU to be available in its target region and within its subscription quota. What should
    the administrator do first?
  options:
  - id: A
    text: Select the largest SKU in a different region and move the existing VM without checking support.
    explanation: A larger SKU elsewhere might not solve the regional, quota, or migration constraints.
  - id: B
    text: Increase the managed disk size because disk capacity determines VM memory.
    explanation: Managed disk capacity does not increase the VM size or its RAM.
  - id: C
    text: Add another availability zone to the current VM to increase its RAM.
    explanation: Placement across zones improves fault isolation; it does not add memory to one VM.
  - id: D
    text: Compare memory-appropriate VM sizes in the target region and verify quota and capacity before
      resizing.
    explanation: VM size determines CPU and memory, and SKU availability, quota, and regional capacity
      must be checked.
  correct:
  - D
  explanation: Choose a size that meets the workload’s memory needs, then confirm that the SKU is offered
    and quota/capacity are sufficient in the intended region.
  difficulty: medium
  tags:
  - objective:vm-sizes
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview
- id: 51
  domain: compute
  topic: virtual-machines
  type: single
  text: A VM workload is being slowed by disk I/O. The administrator wants to improve the disk performance
    tier without replacing the VM family. Which statement should guide the change?
  options:
  - id: A
    text: Managed disks always deliver the same throughput regardless of their selected performance tier.
    explanation: Managed disk performance characteristics vary by disk type and tier.
  - id: B
    text: Choose a disk tier based only on its capacity; VM size cannot limit disk performance.
    explanation: Both disk characteristics and VM-level limits can constrain achievable I/O.
  - id: C
    text: Review the managed disk type/tier and the VM size limits together before changing storage.
    explanation: Effective disk performance depends on the disk configuration and the VM’s capabilities/limits.
  - id: D
    text: Move the OS disk into Azure Container Registry to enable higher IOPS.
    explanation: ACR stores container images and has no role in VM disk performance.
  correct:
  - C
  explanation: Evaluate both the managed disk’s performance capability and the VM’s limits; changing only
    one may not remove the bottleneck.
  difficulty: medium
  tags:
  - objective:vm-disks
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview
  - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview
- id: 52
  domain: compute
  topic: virtual-machines
  type: single
  text: A compliance review requires encryption of VM-host caches and temporary-disk data in addition
    to managed-disk encryption. The planned VM SKU and region may not support every encryption option.
    Which action best meets the requirement?
  options:
  - id: A
    text: Enable encryption at host after verifying that the selected VM size and region support it.
    explanation: Encryption at host adds protection for host-local data such as temporary disks; support
      must be checked for the selected SKU and region.
  - id: B
    text: Enable only a guest operating-system firewall.
    explanation: A firewall controls network traffic; it does not encrypt host caches or temporary disks.
  - id: C
    text: Create a new managed disk and assume it encrypts every host-local temporary disk.
    explanation: Managed-disk encryption does not by itself cover temporary disks, which are not managed
      disks.
  - id: D
    text: Put the VM in an availability set; fault-domain placement encrypts temporary data.
    explanation: Availability sets affect placement for availability, not data encryption.
  correct:
  - A
  explanation: Encryption at host covers data on VM host caches and temporary disks, but eligibility depends
    on region and VM size.
  difficulty: hard
  tags:
  - objective:vm-encryption-host
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption
- id: 53
  domain: compute
  topic: virtual-machines
  type: single
  text: A customer-facing service must tolerate the failure of one physical datacenter location within
    a supported Azure region. The application is designed to run independent replicas in separate locations.
    Which VM placement choice most directly matches the requirement?
  options:
  - id: A
    text: Place every VM in one availability set and the same update domain.
    explanation: An availability set distributes fault/update domains within a datacenter, not across
      separate zone locations.
  - id: B
    text: Use a larger VM size and disable all placement controls.
    explanation: A larger size does not protect against a location failure.
  - id: C
    text: Create VM backups but keep every running instance in one zone.
    explanation: Backups support recovery but do not distribute running instances across zone failures.
  - id: D
    text: Deploy the replicas across availability zones in the region, where supported.
    explanation: Availability zones are separate physical locations within a supported region and match
      the stated failure domain.
  correct:
  - D
  explanation: Availability zones isolate VM placement across separate physical locations; the application
    must also be designed to use the replicas.
  difficulty: medium
  tags:
  - objective:vm-availability
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/availability
  - https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
  - https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
- id: 54
  domain: compute
  topic: virtual-machines
  type: single
  text: An online service has a stateless worker tier whose instance count should increase with demand.
    The operations team wants coordinated VM group deployment and scaling. Which Azure service should
    it use?
  options:
  - id: A
    text: Azure Container Registry, because image repositories automatically create VM instances.
    explanation: ACR stores images and does not manage or run VM instances.
  - id: B
    text: Virtual Machine Scale Sets, configured with an appropriate scaling policy.
    explanation: VM scale sets manage groups of VMs and support coordinated deployment and scaling.
  - id: C
    text: A single availability set, because it automatically adds VMs when demand rises.
    explanation: Availability sets distribute VM placement but do not provide scale-out policies.
  - id: D
    text: An Azure managed disk, because disk capacity controls VM instance count.
    explanation: Managed disks provide storage; they do not scale VM groups.
  correct:
  - B
  explanation: Virtual Machine Scale Sets manage a set of VMs and provide scale capabilities suited to
    a stateless worker tier.
  difficulty: medium
  tags:
  - objective:vm-scale-sets
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview
- id: 55
  domain: compute
  topic: virtual-machines
  type: multiple
  text: A team plans to move a VM and its dependencies to a new Azure region. They want to avoid assuming
    that every resource supports a direct move. Choose 2 appropriate planning actions.
  options:
  - id: A
    text: Check the resource-move support matrix for every VM dependency and run the relevant validation.
    explanation: Move support is resource-specific; validation helps identify unsupported resources or
      constraints.
  - id: B
    text: Assume selecting a new `location` property moves all existing regional resources in place.
    explanation: Changing a location property is not a general-purpose migration mechanism for existing
      resources.
  - id: C
    text: Ignore disks and network dependencies because moving the VM automatically moves every related
      resource.
    explanation: Dependencies can have separate move requirements and support limitations.
  - id: D
    text: Plan a supported region-migration or redeployment workflow, including dependencies and downtime.
    explanation: Regional moves commonly require a migration/redeployment approach rather than a simple
      resource-group move.
  - id: E
    text: Export the VM’s template and assume it includes all data and operational state for a zero-downtime
      move.
    explanation: An exported template is not a complete migration of VM data, state, dependencies, or
      running availability.
  correct:
  - A
  - D
  explanation: Verify move support for the VM and related resources, and use a migration workflow appropriate
    to a region change, including downtime and dependency planning.
  difficulty: hard
  tags:
  - objective:vm-move
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-support-resources
  - https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-migrate
- id: 56
  domain: compute
  topic: containers
  type: single
  text: A development team needs a private, managed repository for versioned container images. It is not
    asking Azure to execute the containers. Which Azure service should it create?
  options:
  - id: A
    text: Azure Container Instances
    explanation: ACI runs container groups; it is not the image registry.
  - id: B
    text: Azure Container Apps
    explanation: Container Apps runs containerized applications; it is not the registry service.
  - id: C
    text: Azure Container Registry
    explanation: ACR stores and distributes container images for authorized consumers.
  - id: D
    text: An App Service plan
    explanation: An App Service plan supplies compute for App Service apps, not a container-image repository.
  correct:
  - C
  explanation: Azure Container Registry is the managed service for storing and distributing container
    images; a separate runtime executes them.
  difficulty: easy
  tags:
  - objective:containers-registry
  references:
  - https://learn.microsoft.com/en-us/azure/container-registry/container-registry-intro
- id: 57
  domain: compute
  topic: containers
  type: single
  text: A team has a short-lived image-conversion task that runs to completion and needs no orchestrator
    features, ingress, or complex scale rules. Which service is the most direct fit for running it?
  options:
  - id: A
    text: Azure Container Instances
    explanation: ACI runs container groups without requiring VM or orchestrator administration and fits
      isolated tasks.
  - id: B
    text: Azure Container Registry
    explanation: ACR stores the task’s image but does not execute it.
  - id: C
    text: Azure App Service deployment slots
    explanation: Slots are separate deployment environments for App Service apps, not a basic container-group
      runtime.
  - id: D
    text: A Virtual Machine Scale Set
    explanation: A VM scale set is a group of VMs and introduces more infrastructure than this isolated
      container task needs.
  correct:
  - A
  explanation: ACI is suited to running an isolated container group without operating a VM or orchestrator
    layer.
  difficulty: easy
  tags:
  - objective:containers-aci
  references:
  - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-overview
- id: 58
  domain: compute
  topic: containers
  type: single
  text: A product team wants to deploy a containerized API with managed ingress and the ability to test
    a new app version as a separate revision before shifting traffic. Which platform is the best match?
  options:
  - id: A
    text: Azure Container Registry
    explanation: A registry stores images but does not provide an application runtime, ingress, or revision
      traffic management.
  - id: B
    text: Azure Container Apps
    explanation: Container Apps provides application-level features including ingress and revision-based
      deployment management.
  - id: C
    text: Azure Container Instances only
    explanation: ACI is useful for container groups but does not provide the same managed app revision
      and traffic-splitting model.
  - id: D
    text: A managed disk
    explanation: A disk is storage for a VM, not an application hosting platform.
  correct:
  - B
  explanation: Azure Container Apps is designed for managed containerized applications and supports revisions
    and ingress configuration.
  difficulty: medium
  tags:
  - objective:containers-apps
  references:
  - https://learn.microsoft.com/en-us/azure/container-apps/overview
  - https://learn.microsoft.com/en-us/azure/container-apps/revisions
- id: 59
  domain: compute
  topic: containers
  type: multiple
  text: 'A team is configuring two workloads: a one-off ACI conversion job and an event-driven Azure Container
    App. Choose 2 correct statements about sizing and scaling.'
  options:
  - id: A
    text: Set CPU and memory resources for the ACI container group based on the job’s requirements.
    explanation: ACI resource sizing is configured for its container group and should match the workload.
  - id: B
    text: ACR automatically scales the running job when the image is pushed.
    explanation: ACR stores images and does not scale a running workload.
  - id: C
    text: An Azure Container App always has exactly one replica, regardless of configured scale rules.
    explanation: Container Apps can scale replicas according to configured rules and replica bounds.
  - id: D
    text: Configure supported Container Apps scale rules and review its minimum and maximum replica settings.
    explanation: Container Apps scaling behavior depends on the configured trigger/rule and replica limits.
  - id: E
    text: Increasing an app’s replica count automatically scales its external database.
    explanation: A backing database is a separate dependency and must be scaled/configured independently.
  correct:
  - A
  - D
  explanation: ACI sizing is set for the container group; Container Apps uses its configured scaling rules
    and replica bounds rather than scaling every dependency automatically.
  difficulty: hard
  tags:
  - objective:containers-sizing-scaling
  references:
  - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-overview
  - https://learn.microsoft.com/en-us/azure/container-apps/scale-app
- id: 60
  domain: compute
  topic: app-service
  type: single
  text: A company hosts several web apps on a shared App Service plan. The administrator needs to identify
    the resource that defines their compute tier, region, and instance resources. Which resource should
    be configured?
  options:
  - id: A
    text: A deployment slot for each app
    explanation: Slots provide app environments for deployment; they do not define the shared compute
      tier.
  - id: B
    text: A custom DNS record
    explanation: DNS maps names to an app endpoint and does not provide compute.
  - id: C
    text: The App Service plan
    explanation: The plan defines the compute resources and hosting tier used by its apps.
  - id: D
    text: A TLS certificate
    explanation: A certificate enables TLS for a hostname but does not define app compute.
  correct:
  - C
  explanation: The App Service plan defines the hosting compute and pricing tier; apps assigned to that
    plan use its resources.
  difficulty: medium
  tags:
  - objective:appservice-plan
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
  - https://learn.microsoft.com/en-us/azure/app-service/overview
- id: 61
  domain: compute
  topic: app-service
  type: single
  text: A web app receives predictable daily traffic peaks. The team needs more concurrent worker instances
    at peak and then fewer instances later, without changing the per-instance pricing tier. Which change
    meets the requirement?
  options:
  - id: A
    text: Scale up to a larger pricing tier and leave the instance count fixed.
    explanation: Scaling up changes the plan tier or instance size; it does not meet the stated need to
      vary instance count.
  - id: B
    text: Add more deployment slots for each peak period.
    explanation: Slots provide deployment environments and do not increase the plan instance count.
  - id: C
    text: Increase the size of the app’s deployment package.
    explanation: Package size does not scale compute capacity.
  - id: D
    text: Scale out the App Service plan by changing the number of instances, using autoscale if appropriate.
    explanation: Scaling out changes the instance count and can be configured to respond to demand where
      supported.
  correct:
  - D
  explanation: Scaling out adjusts the number of plan instances; scaling up instead changes the plan tier
    or instance size.
  difficulty: medium
  tags:
  - objective:appservice-scaling
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up
  - https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
- id: 62
  domain: compute
  topic: app-service
  type: single
  text: An administrator has created an App Service plan and must create a web app that runs the team’s
    supported runtime stack. Which statement correctly describes the app configuration?
  options:
  - id: A
    text: Create the web app in the selected plan and configure its runtime/operating system and application
      settings for the workload.
    explanation: An App Service app is hosted on a plan, and its application configuration identifies
      how the workload runs.
  - id: B
    text: Create a public IP resource with the same name; that resource is the App Service app.
    explanation: A public IP is a networking resource, not the App Service workload itself.
  - id: C
    text: Create only a DNS CNAME; Azure infers the app and runtime from the hostname.
    explanation: DNS records do not provision an App Service app or configure its runtime.
  - id: D
    text: Create a deployment slot without a production app; the slot supplies the plan automatically.
    explanation: A slot belongs to an existing app and uses its App Service plan.
  correct:
  - A
  explanation: Provision the App Service app in the plan and configure an appropriate runtime and app
    settings for the application.
  difficulty: easy
  tags:
  - objective:appservice-create
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/overview
  - https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
- id: 63
  domain: compute
  topic: app-service
  type: single
  text: A company maps `api.contoso.example` to its App Service app and wants HTTPS for that hostname.
    DNS now resolves to the app, but browsers still report a certificate-name mismatch. What should the
    administrator do?
  options:
  - id: A
    text: Add an inbound VNet integration rule for port 443.
    explanation: VNet integration provides supported outbound connectivity from the app; it does not bind
      a hostname certificate.
  - id: B
    text: Create an availability set for the App Service plan.
    explanation: Availability sets apply to VM placement, not App Service TLS.
  - id: C
    text: Configure a certificate and TLS binding for the custom hostname, then verify the hostname and
      binding.
    explanation: HTTPS requires the correct certificate to be bound to the custom hostname.
  - id: D
    text: Enable an App Service backup schedule.
    explanation: Backups protect recoverable app content/configuration but do not configure TLS.
  correct:
  - C
  explanation: DNS mapping alone does not establish a matching TLS certificate binding; configure and
    verify the hostname’s HTTPS binding.
  difficulty: medium
  tags:
  - objective:appservice-tls
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-bindings
  - https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain
- id: 64
  domain: compute
  topic: app-service
  type: single
  text: A team has registered `portal.contoso.example` and wants to map it to an App Service app. Which
    prerequisite should it complete before expecting the custom hostname to work?
  options:
  - id: A
    text: Create an availability zone for the DNS name.
    explanation: Availability zones are resource placement locations, not DNS ownership verification.
  - id: B
    text: Configure the required DNS record or records and verify domain ownership in App Service.
    explanation: The hostname must be mapped through DNS and ownership validated before it can be used
      as a custom domain.
  - id: C
    text: Create an ACR repository named after the hostname.
    explanation: A container registry is unrelated to DNS ownership or custom hostname mapping.
  - id: D
    text: Set an output parameter in an ARM template; DNS will update automatically.
    explanation: A deployment output does not create the required DNS records unless a separate deployment
      action is defined.
  correct:
  - B
  explanation: Configure the hostname’s DNS records and complete App Service domain validation before
    relying on the custom name.
  difficulty: easy
  tags:
  - objective:appservice-custom-domain
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain
- id: 65
  domain: compute
  topic: app-service
  type: single
  text: An administrator needs scheduled, custom backups for an App Service app and wants to choose a
    retention period. Which configuration best matches this requirement?
  options:
  - id: A
    text: Enable VM backup in a Recovery Services vault and select the App Service plan.
    explanation: VM backup is not the App Service custom-backup configuration path.
  - id: B
    text: Create a deployment slot and treat each swap as a permanent backup.
    explanation: A slot is useful for releases but is not a scheduled backup with retention settings.
  - id: C
    text: Enable automatic backups and configure their schedule and retention, which are fully customizable.
    explanation: Automatic backup settings are not freely configured in this way; custom backups provide
      configurable schedules and retention.
  - id: D
    text: Configure custom App Service backups with a supported storage account, schedule, and retention,
      then test restore.
    explanation: Custom App Service backups use a configured storage target and support schedule/retention
      choices; restoration should be tested.
  correct:
  - D
  explanation: Custom backups let administrators configure the storage account, schedule, and retention;
    recovery requirements should be validated with a restore test.
  difficulty: hard
  tags:
  - objective:appservice-backup
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/manage-backup
- id: 66
  domain: compute
  topic: app-service
  type: single
  text: An App Service app must call a private database reachable from a virtual network. The database
    must not be made publicly reachable, and the app’s outbound path should reach it privately. Which
    App Service networking feature is designed for the app-to-VNet direction?
  options:
  - id: A
    text: Virtual network integration
    explanation: VNet integration gives the app supported outbound connectivity into a virtual network.
  - id: B
    text: A private endpoint for inbound access to the app
    explanation: A private endpoint provides private inbound access to the app, not the app’s outbound
      path to a backend.
  - id: C
    text: A deployment slot swap
    explanation: A swap changes which app version is live; it does not create network connectivity.
  - id: D
    text: A custom domain binding
    explanation: A domain binding configures a hostname, not a route to a private backend.
  correct:
  - A
  explanation: Use VNet integration for supported outbound connectivity from the app to a private backend;
    private endpoints serve the opposite, inbound direction.
  difficulty: medium
  tags:
  - objective:appservice-networking
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/networking-features
  - https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration
  - https://learn.microsoft.com/en-us/azure/app-service/overview-private-endpoint
- id: 67
  domain: compute
  topic: app-service
  type: single
  text: A release team deploys a candidate build to a staging environment, validates it, and then wants
    to promote it to production while reducing deployment risk. Which App Service capability is intended
    for this workflow?
  options:
  - id: A
    text: An availability set
    explanation: Availability sets distribute VMs across fault and update domains; they are not App Service
      release environments.
  - id: B
    text: A managed disk snapshot
    explanation: A disk snapshot does not provide a separate App Service environment for validating a
      release.
  - id: C
    text: A deployment slot, followed by a reviewed swap when the candidate is ready.
    explanation: Deployment slots provide separate app environments that can be swapped; settings and
      dependencies still need review.
  - id: D
    text: An Azure Container Registry task
    explanation: ACR manages container images and build tasks, not App Service slot promotion.
  correct:
  - C
  explanation: A staging slot lets the team test a candidate before swapping it into production; review
    slot-sticky settings and app dependencies as part of the release.
  difficulty: medium
  tags:
  - objective:appservice-slots
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
- id: 68
  domain: compute
  topic: app-service
  type: multiple
  text: A department expects to add more apps to an existing App Service plan and wants an autoscale rule
    to increase capacity during load spikes. Choose 2 statements the administrator should account for.
  options:
  - id: A
    text: Each app in the plan receives an isolated copy of the plan’s compute resources automatically.
    explanation: Apps on the same plan share its compute resources rather than receiving isolated copies
      by default.
  - id: B
    text: The plan’s pricing tier and scale capabilities determine which scaling features are available.
    explanation: Scaling and autoscale capabilities depend on the selected App Service plan tier and configuration.
  - id: C
    text: Scaling the plan’s instance count affects only the app whose metric triggered scaling.
    explanation: Plan-level scaling changes the plan capacity and can affect all apps hosted on that plan.
  - id: D
    text: Apps on the same plan share compute, so plan-level scaling can affect all of them and they can
      contend for resources.
    explanation: This accurately describes the shared compute boundary and consequence of scaling the
      plan.
  - id: E
    text: Deployment slots are the only way to add production compute capacity.
    explanation: Slots support deployment workflows and do not replace plan scaling.
  correct:
  - B
  - D
  explanation: Plan tier determines available scaling features, and apps in a plan share its compute;
    plan-level scale changes can affect the whole plan.
  difficulty: hard
  tags:
  - objective:appservice-plan
  - objective:appservice-scaling
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
  - https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up
- id: 69
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: A team will deploy 20 VMs, each with one NIC and one private IP address, into a new subnet. No
    other resources will use the subnet. Which is the smallest subnet size that can hold all 20 addresses?
  options:
  - id: A
    text: /28
    explanation: A /28 has 16 addresses; Azure reserves 5, leaving only 11 usable.
  - id: B
    text: /27
    explanation: A /27 has 32 addresses; after Azure's 5 reserved addresses, 27 remain, enough for 20.
  - id: C
    text: /29
    explanation: A /29 has 8 addresses and only 3 usable after the reserved addresses.
  - id: D
    text: /26
    explanation: A /26 works but is larger than necessary, so it is not the smallest option.
  correct:
  - B
  explanation: Azure reserves five addresses in every subnet (network, default gateway, two for Azure
    DNS, and broadcast). A /27 provides 27 usable addresses, the smallest size that fits 20.
  difficulty: easy
  tags:
  - objective:network-vnets-subnets
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
  - https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network
- id: 70
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: Spoke VNet-A and spoke VNet-C are each peered with a hub VNet-B. VNet-B contains an Azure Firewall.
    VMs in VNet-A must communicate with VMs in VNet-C, but currently cannot. Which action enables this
    without peering VNet-A directly to VNet-C?
  options:
  - id: A
    text: Enable "Allow forwarded traffic" only on the hub, and make no routing changes.
    explanation: Allowing forwarded traffic is necessary but not sufficient; nothing sends spoke traffic
      to the firewall without a route.
  - id: B
    text: Wait for Azure to propagate transitive peering routes between the spokes.
    explanation: Peering is not transitive, and Azure does not create spoke-to-spoke routes automatically.
  - id: C
    text: Create user-defined routes on the spoke subnets that send the other spoke's prefix to the firewall's
      private IP as a virtual appliance, and allow forwarded traffic on the peerings.
    explanation: Correct. A UDR with next hop type Virtual appliance steers traffic through the hub firewall,
      and the peerings must accept forwarded traffic.
  - id: D
    text: Add a public IP address to every VM in the spokes.
    explanation: Public IPs do not provide private spoke-to-spoke connectivity through the peerings.
  correct:
  - C
  explanation: Peering is non-transitive. A hub-and-spoke design needs an NVA or Azure Firewall in the
    hub plus UDRs on the spoke subnets pointing at it, with peerings configured to allow forwarded traffic.
  difficulty: easy
  tags:
  - objective:network-peering
  - objective:network-udr
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
- id: 71
  domain: virtual-networking
  topic: vnets-and-subnets
  type: multiple
  text: A hub VNet contains a VPN gateway connected to the on-premises network. A peered spoke VNet has
    no gateway of its own, and its VMs must reach on-premises through the hub's gateway. Which two peering
    settings should you configure? Choose 2.
  options:
  - id: A
    text: Enable "Use remote gateways" on the spoke-to-hub peering link.
    explanation: Correct. This lets the spoke use the hub's gateway.
  - id: B
    text: Enable "Use remote gateways" on the hub-to-spoke peering link.
    explanation: The hub owns the gateway; it should allow transit instead of using remote gateways.
  - id: C
    text: Create a second VPN gateway in the spoke VNet and enable "Allow gateway transit" there.
    explanation: A second gateway is unnecessary and defeats the purpose of sharing the hub's gateway.
  - id: D
    text: Enable "Allow gateway transit" on the hub-to-spoke peering link.
    explanation: Correct. The VNet that owns the gateway must allow gateway transit.
  - id: E
    text: Disable "Allow virtual network access" on both peering links.
    explanation: Virtual network access must stay enabled for the VNets to communicate.
  correct:
  - A
  - D
  explanation: Gateway transit is set on the peering from the gateway-owning VNet (hub), and "Use remote
    gateways" is set on the peering from the VNet that consumes it (spoke).
  difficulty: medium
  tags:
  - objective:network-peering
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
- id: 72
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: You attach a Standard SKU public IP address to a VM's network interface. The VM runs a web server
    on TCP 443 and no network security group is associated with the NIC or subnet. Clients on the internet
    cannot connect. What is the most likely reason?
  options:
  - id: A
    text: A VM can have only one NIC association for a public IP address and an NSG at the same time.
    explanation: No such restriction exists.
  - id: B
    text: Standard SKU public IP addresses support only outbound traffic.
    explanation: They support inbound traffic when an NSG permits it.
  - id: C
    text: A public IP address must be dynamically assigned to accept inbound connections.
    explanation: Standard SKU addresses are always static; assignment type is not the cause.
  - id: D
    text: Standard SKU public IP addresses are closed to inbound traffic until an NSG explicitly allows
      it.
    explanation: Correct. Standard public IPs are secure by default and require an NSG allow rule.
  correct:
  - D
  explanation: Standard SKU public IPs are secure by default. Create an NSG with an inbound allow rule
    for TCP 443 and associate it with the subnet or NIC.
  difficulty: medium
  tags:
  - objective:network-public-ips
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
- id: 73
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: A route table on the app subnet contains a route for 0.0.0.0/0 with next hop type "Virtual appliance"
    and address 10.0.2.4, an NVA in a different subnet. After the association, VMs in the app subnet lose
    internet connectivity. The NVA has the correct NVA firewall rules. Which setting should you check
    first?
  options:
  - id: A
    text: The NVA's NIC has IP forwarding disabled.
    explanation: Correct. The NIC must have IP forwarding enabled (and the OS must forward) to relay traffic
      not addressed to it.
  - id: B
    text: The route table has "Propagate gateway routes" enabled.
    explanation: This only controls BGP route propagation and does not break forwarding through an NVA.
  - id: C
    text: The app subnet needs a service endpoint for Microsoft.Network.
    explanation: No such service endpoint fixes NVA forwarding.
  - id: D
    text: The default system route for 10.0.0.0/16 must be deleted.
    explanation: System routes cannot be deleted, and this route is not the cause.
  correct:
  - A
  explanation: A virtual appliance next hop only works if the appliance NIC has IP forwarding enabled
    in Azure and forwarding enabled in the guest OS. Effective routes on an app NIC would show the UDR
    as active.
  difficulty: medium
  tags:
  - objective:network-udr
  - objective:network-connectivity-troubleshoot
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
  - https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
- id: 74
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: A subnet in VNet 10.0.0.0/16 uses a route table with two routes - 10.0.4.0/24 with next hop Virtual
    appliance 10.0.9.4, and 0.0.0.0/0 with next hop None. No other custom routes exist and no gateways
    are present. Which statement about traffic leaving a VM in that subnet is true?
  options:
  - id: A
    text: Traffic to 10.0.7.5 is dropped because the 0.0.0.0/0 route overrides the system VNet route.
    explanation: The system 10.0.0.0/16 route is more specific than 0.0.0.0/0, so it wins.
  - id: B
    text: Traffic to 10.0.4.20 goes to 10.0.9.4, and traffic to 10.0.7.5 stays in the VNet through the
      system route.
    explanation: Correct. Longest prefix match applies, so 10.0.4.0/24 beats 10.0.0.0/16, which beats
      0.0.0.0/0.
  - id: C
    text: Traffic to 10.0.4.20 stays local because system routes always beat user-defined routes.
    explanation: A user-defined route only loses to a system route on equal prefix length; it wins here
      by being more specific.
  - id: D
    text: Traffic to 8.8.8.8 goes to 10.0.9.4 because the appliance route is the first route in the list.
    explanation: Route order is irrelevant; 8.8.8.8 matches only 0.0.0.0/0, which has next hop None, so
      it is dropped.
  correct:
  - B
  explanation: Azure selects the route with the longest prefix match; for equal prefixes, user-defined
    routes beat BGP and system routes. Internet-bound traffic here is dropped by the None next hop.
  difficulty: hard
  tags:
  - objective:network-udr
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
- id: 75
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: A VM cannot reach its database in a peered VNet. You suspect an NSG is blocking the flow, but
    you do not know which NSG or rule. You want to test a specific 5-tuple (source, destination, port,
    protocol, direction) from the VM and learn which rule allows or denies it. Which Network Watcher capability
    should you use?
  options:
  - id: A
    text: Next hop
    explanation: Next hop reveals routing, not which security rule allows or denies a flow.
  - id: B
    text: Packet capture
    explanation: Packet capture records traffic on the VM; it does not evaluate NSG rules for a hypothetical
      flow.
  - id: C
    text: IP flow verify
    explanation: Correct. It reports whether a flow is allowed or denied and names the NSG rule responsible.
  - id: D
    text: Topology
    explanation: Topology only visualizes resources and their relationships.
  correct:
  - C
  explanation: IP flow verify checks a 5-tuple against the NSG rules applied to the VM's NIC and returns
    the allow/deny decision with the rule name. Next hop is the equivalent tool for routing.
  difficulty: medium
  tags:
  - objective:network-connectivity-troubleshoot
  - objective:network-effective-rules
  references:
  - https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
  - https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-traffic-filter-problem
- id: 76
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: 'A subnet NSG has these inbound rules - priority 100: Deny, TCP 3389, source Internet; priority
    200: Allow, TCP 3389, source 203.0.113.0/24. An admin at 203.0.113.10 cannot connect over RDP. What
    change fixes this while keeping RDP blocked from the rest of the internet?'
  options:
  - id: A
    text: Change the deny rule destination to a different port.
    explanation: This would unblock RDP for everyone, not just the admin range.
  - id: B
    text: Change the allow rule to priority 4000.
    explanation: A higher number is evaluated later and would still be hidden behind the deny at 100.
  - id: C
    text: Delete the default AllowVnetInBound rule.
    explanation: Default rules cannot be deleted, and this rule is irrelevant to internet sources.
  - id: D
    text: Change the allow rule to priority 50.
    explanation: Correct. The lower number is evaluated first, so the allow rule matches the admin before
      the deny.
  correct:
  - D
  explanation: NSG rules are processed from the lowest priority number to the highest, and processing
    stops at the first match. The allow rule must have a lower number than the deny.
  difficulty: medium
  tags:
  - objective:network-nsg-asg
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
- id: 77
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: A VM's subnet has an NSG with an inbound allow rule for TCP 443 from Internet. The VM's NIC also
    has its own NSG that contains only the default rules. A client on the internet connects to the VM's
    public IP on port 443. What is the result and why?
  options:
  - id: A
    text: Denied, because the NIC NSG's default DenyAllInBound rule blocks the flow.
    explanation: Correct. The NIC-level NSG evaluates the packet after the subnet NSG and has no rule
      allowing it.
  - id: B
    text: Allowed, because the default AllowInternetInBound rule exists in the NIC NSG.
    explanation: There is no AllowInternetInBound default rule; internet sources are denied by DenyAllInBound.
  - id: C
    text: Allowed, because the subnet NSG is evaluated first and its decision is final.
    explanation: Traffic must be allowed by both NSGs; the subnet NSG's allow does not skip the NIC NSG.
  - id: D
    text: Denied, because only one NSG may be associated per VM.
    explanation: A subnet and a NIC can each have an NSG; both are evaluated.
  correct:
  - A
  explanation: For inbound traffic, the subnet NSG is evaluated first, then the NIC NSG. Each must permit
    the flow. The NIC NSG's defaults allow only VirtualNetwork and AzureLoadBalancer sources and deny
    the rest, so an additional allow rule is needed there. Effective security rules on the NIC show both
    sets.
  difficulty: hard
  tags:
  - objective:network-effective-rules
  - objective:network-nsg-asg
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  - https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-traffic-filter-problem
- id: 78
  domain: virtual-networking
  topic: secure-network-access
  type: multiple
  text: You plan to write NSG rules using application security groups for web and database tiers in one
    VNet. Which two statements are true? Choose 2.
  options:
  - id: A
    text: An ASG can contain NICs from different virtual networks.
    explanation: All NICs in an ASG must belong to the same virtual network.
  - id: B
    text: A rule can use one ASG as the source and another ASG as the destination.
    explanation: Correct. This is a typical use, for example web tier to database tier.
  - id: C
    text: Using ASGs removes the need to create an NSG.
    explanation: ASGs are referenced by NSG rules and do not enforce anything alone.
  - id: D
    text: All NICs that are members of the same ASG must be in the same virtual network.
    explanation: Correct. This is a documented ASG constraint.
  - id: E
    text: An ASG can be associated directly with a subnet to filter its traffic.
    explanation: ASGs are associated with NICs, not subnets.
  correct:
  - B
  - D
  explanation: ASGs group NICs so NSG rules can refer to workloads instead of IP addresses. They must
    be in a single VNet and are consumed by NSG rules.
  difficulty: medium
  tags:
  - objective:network-nsg-asg
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
  - https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
- id: 79
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: You are deploying Azure Bastion (Basic SKU) into an existing VNet to administer VMs without public
    IPs. Which subnet configuration is required?
  options:
  - id: A
    text: Any subnet with a /29 prefix that already hosts the target VMs.
    explanation: Bastion needs its own dedicated subnet; /29 is too small.
  - id: B
    text: A subnet named AzureBastionSubnet with a prefix of /26 or larger.
    explanation: Correct. The name is mandatory and the minimum size is /26.
  - id: C
    text: A subnet named GatewaySubnet with a /27 prefix.
    explanation: GatewaySubnet is reserved for virtual network gateways.
  - id: D
    text: A subnet named BastionSubnet with a /28 prefix and a UDR to the internet.
    explanation: The required name is AzureBastionSubnet, and /28 is too small.
  correct:
  - B
  explanation: Bastion (other than the Developer SKU) requires a dedicated subnet named AzureBastionSubnet,
    /26 or larger, in the same VNet and resource group as the bastion host, and a Standard static public
    IP.
  difficulty: easy
  tags:
  - objective:network-bastion
  references:
  - https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
  - https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
- id: 80
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: A security team wants to send a contractor a shareable link so that they can connect to a specific
    VM through Azure Bastion without signing in to the Azure portal. What is the lowest Bastion SKU that
    supports this?
  options:
  - id: A
    text: Developer
    explanation: Developer SKU does not support shareable links.
  - id: B
    text: Basic
    explanation: Basic does not support shareable links.
  - id: C
    text: Standard
    explanation: Correct. The shareable link feature requires Standard or higher.
  - id: D
    text: Premium
    explanation: Premium supports it but is not the lowest SKU that does.
  correct:
  - C
  explanation: Shareable links, custom ports and host scaling require the Standard SKU or higher. Basic
    provides the core portal-based RDP/SSH experience.
  difficulty: medium
  tags:
  - objective:network-bastion
  references:
  - https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
- id: 81
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: You must restrict a storage account so that only VMs in subnet app-subnet can reach it. Requirements
    - VMs keep using the standard storage account FQDN with no DNS changes, and no private IP address
    is needed for the storage account. Which solution should you implement?
  options:
  - id: A
    text: Associate an NSG with app-subnet that allows the storage account's private IP.
    explanation: The storage account has no private IP and NSGs do not configure the storage firewall.
  - id: B
    text: Create a private endpoint and a privatelink DNS zone linked to the VNet.
    explanation: This works but adds a private IP and DNS changes, which the requirements ruled out.
  - id: C
    text: Peer the VNet with the storage account's VNet.
    explanation: Storage accounts do not live in a customer VNet to peer with.
  - id: D
    text: Enable the Microsoft.Storage service endpoint on app-subnet and add that subnet as a virtual
      network rule in the storage firewall.
    explanation: Correct. It uses the subnet identity and the existing public FQDN with no DNS changes.
  correct:
  - D
  explanation: Service endpoints extend the subnet identity to the service so the service firewall can
    allow it, while the service keeps its public endpoint and FQDN. Private endpoints instead assign a
    private IP and need DNS planning.
  difficulty: medium
  tags:
  - objective:network-service-endpoints
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
- id: 82
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: You created a private endpoint for the blob service of storage account stcontoso in VNet1. A VM
    in VNet1 still resolves stcontoso.blob.core.windows.net to a public IP address and uses the internet
    path. Which action makes the VM resolve the private endpoint's private IP address?
  options:
  - id: A
    text: Create a private DNS zone named privatelink.blob.core.windows.net with an A record for stcontoso
      and link it to VNet1.
    explanation: Correct. The zone resolves the privatelink name to the private IP for clients in linked
      VNets.
  - id: B
    text: Create a public DNS zone named stcontoso.blob.core.windows.net.
    explanation: A public zone would not be consulted by Azure-provided DNS for VNet1 clients and does
      not hold private IPs.
  - id: C
    text: Enable the Microsoft.Storage service endpoint on the subnet.
    explanation: A service endpoint does not change DNS answers.
  - id: D
    text: Add an NSG rule allowing TCP 443 to the storage account.
    explanation: NSG rules do not affect name resolution.
  correct:
  - A
  explanation: A private endpoint does not change public DNS by itself. The blob FQDN resolves via a CNAME
    to the privatelink.blob.core.windows.net name, so a private DNS zone with that name, containing the
    endpoint's A record and linked to the client VNet, is needed.
  difficulty: hard
  tags:
  - objective:network-private-endpoints
  - objective:network-dns
  references:
  - https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
  - https://learn.microsoft.com/en-us/azure/private-link/private-link-overview
- id: 83
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: You registered contoso.com with a third-party registrar and created a public Azure DNS zone for
    contoso.com with correct A records. Internet users cannot resolve www.contoso.com. What should you
    do?
  options:
  - id: A
    text: Link the zone to a virtual network.
    explanation: VNet links belong to private DNS zones.
  - id: B
    text: Configure the registrar to use the name servers assigned to your Azure DNS zone.
    explanation: Correct. Delegation at the registrar makes the Azure zone authoritative.
  - id: C
    text: Set the TTL of the A records to 0.
    explanation: TTL controls caching, not delegation.
  - id: D
    text: Add a CNAME record at the zone apex pointing to the VM.
    explanation: CNAMEs cannot coexist at a zone apex, and delegation is still missing.
  correct:
  - B
  explanation: A public zone only serves internet queries after the registrar's NS records for the domain
    are updated to the name servers Azure assigned to the zone.
  difficulty: easy
  tags:
  - objective:network-dns
  references:
  - https://learn.microsoft.com/en-us/azure/dns/dns-delegate-domain-azure-dns
- id: 84
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: multiple
  text: A private DNS zone named corp.internal must automatically register DNS records for VMs in VNet1,
    and VMs in VNet2 must resolve those names. VNet1 and VNet2 are not required to be peered for this
    requirement. Which three configurations are needed? Choose 3.
  options:
  - id: A
    text: Link VNet1 to the zone with auto registration enabled.
    explanation: Correct. Auto registration on the VNet1 link creates VM records.
  - id: B
    text: Link VNet2 to the zone with auto registration disabled.
    explanation: Correct. A resolution-only link lets VNet2 VMs resolve the records.
  - id: C
    text: Use the Azure-provided DNS (168.63.129.16) in both VNets.
    explanation: Correct. Private DNS zone resolution works through Azure-provided DNS.
  - id: D
    text: Delegate corp.internal at a domain registrar.
    explanation: Private zones are not delegated through public registrars.
  - id: E
    text: Peer VNet1 and VNet2 and use only the peering to resolve names.
    explanation: Peering does not share DNS records; the zone link is required.
  correct:
  - A
  - B
  - C
  explanation: Records appear in a private zone through a VNet link with auto registration, and other
    VNets resolve them through resolution-only links, using Azure-provided DNS. Peering is not required
    and does not provide name resolution.
  difficulty: medium
  tags:
  - objective:network-dns
  references:
  - https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
- id: 85
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: A network virtual appliance cluster must receive all TCP and UDP traffic, on every port, that
    is sent by VMs inside the VNet to one private IP address, with load balancing across healthy NVAs.
    Which configuration meets this requirement?
  options:
  - id: A
    text: A public Standard load balancer with one rule per port.
    explanation: A public frontend is not private, and per-port rules do not scale to all ports.
  - id: B
    text: An internal Basic load balancer with a rule on port 0.
    explanation: Basic load balancers do not support HA ports.
  - id: C
    text: An internal Standard load balancer with a high availability (HA) ports rule.
    explanation: Correct. HA ports balances all ports and protocols on a private frontend.
  - id: D
    text: An Azure DNS private zone with multiple A records for the appliances.
    explanation: DNS round robin gives no health detection or flow-level load balancing for all ports.
  correct:
  - C
  explanation: An internal Standard Load Balancer with an HA ports rule (protocol All, port 0) distributes
    flows on all ports to healthy backends, which is the common NVA high availability pattern.
  difficulty: hard
  tags:
  - objective:network-load-balancer
  references:
  - https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview
  - https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
- id: 86
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: A load balancer rule sends TCP 80 to two web VMs. Both VMs are running and respond to a manual
    request for /index.html with HTTP 200, but the load balancer shows both backends as unhealthy. The
    health probe is HTTP on port 80 and uses the path /health, which does not exist on the web servers.
    What is the effect and fix?
  options:
  - id: A
    text: Change the load balancer SKU to Basic so probes are ignored.
    explanation: Probes apply to both SKUs and are not ignored.
  - id: B
    text: Traffic is still balanced normally, because running VMs are always considered healthy.
    explanation: Health is determined by the probe, not by VM power state.
  - id: C
    text: Add an NSG rule allowing the load balancer's frontend IP to the VMs.
    explanation: Probes come from 168.63.129.16 (AzureLoadBalancer tag), and the failure here is the missing
      path.
  - id: D
    text: New flows are not sent to the backends; change the probe path to one that returns HTTP 200,
      such as /index.html.
    explanation: Correct. An HTTP probe is healthy only on HTTP 200 OK.
  correct:
  - D
  explanation: An HTTP probe is considered up only when it receives HTTP 200. With a 404 on /health, backends
    are marked down and receive no new flows. Fix the path or use a TCP probe.
  difficulty: medium
  tags:
  - objective:network-load-balancer-troubleshoot
  references:
  - https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
- id: 87
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: An operator charts the Percentage CPU metric of a VM over the last 24 hours at a one-hour time
    grain. The chart looks calm, but users report that the VM briefly hit 100% CPU several times. Which
    change to the chart is most likely to reveal the short spikes?
  options:
  - id: A
    text: Change the aggregation to Average
    explanation: Averaging over an hour smooths out short spikes, which is why the chart looks calm.
  - id: B
    text: Change the aggregation to Max
    explanation: Max shows the highest value recorded in each time grain, so brief spikes become visible.
  - id: C
    text: Change the aggregation to Min
    explanation: Min shows the lowest value in each grain and would hide spikes.
  - id: D
    text: Change the aggregation to Count
    explanation: Count shows how many samples were collected, not how high the CPU value was.
  correct:
  - B
  explanation: Metrics are numeric time series that are aggregated per time grain. Average hides short
    peaks; Max exposes the highest sample in each grain.
  difficulty: easy
  tags:
  - objective:monitor-metrics
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/data-platform-metrics
  - https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/metrics-aggregation-explained
- id: 88
  domain: monitor-maintain
  topic: azure-monitor
  type: multiple
  text: A security team must be able to query the resource logs of an Azure Key Vault with KQL for interactive
    investigations, and must also keep the same logs for seven years at the lowest storage cost for audit.
    You are creating a diagnostic setting on the key vault. Which two destinations should you select?
    Choose 2.
  options:
  - id: A
    text: A Log Analytics workspace
    explanation: Logs sent to a workspace can be queried with KQL.
  - id: B
    text: An Azure Event Hubs namespace
    explanation: Event Hubs streams data to external systems such as a SIEM; it is not a KQL query store
      or a low-cost archive.
  - id: C
    text: An Azure Storage account
    explanation: Archiving to a storage account is a low-cost option for long-term retention (for example
      with lifecycle management).
  - id: D
    text: An Azure Monitor action group
    explanation: Action groups define notifications and automation for alerts; they are not diagnostic
      setting destinations.
  - id: E
    text: A Microsoft Entra tenant
    explanation: A Microsoft Entra tenant is not a diagnostic setting destination.
  correct:
  - A
  - C
  explanation: A diagnostic setting routes selected log categories to destinations such as a Log Analytics
    workspace (KQL analysis), a storage account (archive), Event Hubs (streaming), or a partner solution.
  difficulty: medium
  tags:
  - objective:monitor-log-settings
  - objective:monitor-log-analysis
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnostic-settings
- id: 89
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: 'You run the following query in a Log Analytics workspace that receives the Azure activity log:


    AzureActivity

    | where TimeGenerated > ago(24h)

    | where OperationNameValue =~ "MICROSOFT.COMPUTE/VIRTUALMACHINES/DELETE"

    | summarize count() by Caller


    What does the result show?'
  options:
  - id: A
    text: The total number of virtual machines that currently exist, grouped by resource group
    explanation: The query counts log records for delete operations, not existing VMs.
  - id: B
    text: The VMs that were deleted, sorted by deletion time
    explanation: There is no sort, and summarize returns counts per caller rather than a list of VMs.
  - id: C
    text: The number of VM delete operations recorded in the last 24 hours, per caller
    explanation: The query filters to VM delete operations in the last 24 hours and counts the matching
      records for each Caller value.
  - id: D
    text: The number of failed VM operations per caller in the last 24 hours
    explanation: There is no filter on operation status or on other operation types.
  correct:
  - C
  explanation: The where clauses limit rows to the last 24 hours and to VM delete operations, and summarize
    count() by Caller aggregates the rows per identity.
  difficulty: medium
  tags:
  - objective:monitor-log-analysis
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-overview
  - https://learn.microsoft.com/en-us/kusto/query/
- id: 90
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: 'Servers report to a Log Analytics workspace through the Heartbeat table. You run this query:


    Heartbeat

    | where TimeGenerated > ago(1d)

    | summarize LastBeat = max(TimeGenerated) by Computer

    | where LastBeat < ago(15m)


    Which computers are returned?'
  options:
  - id: A
    text: Computers that sent a heartbeat within the last 15 minutes
    explanation: The final filter keeps rows where the last heartbeat is older than 15 minutes, the opposite
      of this.
  - id: B
    text: Computers that have never sent a heartbeat to the workspace
    explanation: A computer that never sent a heartbeat has no rows in the table, so it cannot appear
      in the result.
  - id: C
    text: Computers that sent more than one heartbeat in the last day
    explanation: The query does not count heartbeats.
  - id: D
    text: Computers that sent a heartbeat during the last day but none in the last 15 minutes
    explanation: The query finds each computer's most recent heartbeat in the past day and keeps those
      whose latest one is older than 15 minutes.
  correct:
  - D
  explanation: summarize max(TimeGenerated) by Computer yields the latest heartbeat per computer; the
    where clause then keeps computers whose latest heartbeat is stale. Computers that never reported are
    absent from the data, so they are not returned.
  difficulty: hard
  tags:
  - objective:monitor-log-analysis
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/heartbeat
  - https://learn.microsoft.com/en-us/kusto/query/
- id: 91
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: A subscription contains dozens of metric alert rules that email the operations team through action
    groups. Every Saturday from 22:00 to 02:00 a planned maintenance window causes expected alerts for
    resources in one resource group. You want to stop the notifications during that window without editing
    or disabling each alert rule. What should you create?
  options:
  - id: A
    text: An alert processing rule scoped to the resource group that suppresses notifications on a recurring
      schedule
    explanation: Alert processing rules can suppress action groups for a scope on a one-time or recurring
      schedule, and alerts are still recorded.
  - id: B
    text: A new action group with no actions, attached to each alert rule
    explanation: This requires editing every alert rule and would not remove the existing action groups.
  - id: C
    text: A diagnostic setting that sends logs to a storage account only
    explanation: Diagnostic settings control telemetry routing, not alert notifications.
  - id: D
    text: A Network Watcher Connection Monitor test
    explanation: Connection Monitor tests connectivity and does not manage alert notifications.
  correct:
  - A
  explanation: An alert processing rule changes how fired alerts are handled (for example, suppressing
    action groups) for a chosen scope and schedule, without modifying the alert rules themselves.
  difficulty: medium
  tags:
  - objective:monitor-alerts
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
  - https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
- id: 92
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: Management wants a single report that shows backup job success rates and protected-item usage
    for all vaults across several subscriptions over the last 90 days. What must you configure for Azure
    Backup reports to be populated?
  options:
  - id: A
    text: An Azure Monitor metric alert on each vault
    explanation: Alerts notify about conditions but do not supply the data used by Backup reports.
  - id: B
    text: Diagnostic settings on the vaults that send the backup report log data to a Log Analytics workspace
    explanation: Backup reports are built on Azure Monitor Logs, so vaults must send their diagnostic
      data to a workspace.
  - id: C
    text: A Network Watcher packet capture on the backup network
    explanation: Packet capture records network traffic and is unrelated to Backup reporting.
  - id: D
    text: A second backup policy that runs hourly
    explanation: Policy frequency affects recovery points, not reporting data.
  correct:
  - B
  explanation: Backup reports use data stored in a Log Analytics workspace, so you configure diagnostic
    settings on the vaults to send backup data there; the workbook can then aggregate across vaults and
    subscriptions.
  difficulty: medium
  tags:
  - objective:recovery-reports-alerts
  - objective:monitor-log-settings
  references:
  - https://learn.microsoft.com/en-us/azure/backup/configure-reports
- id: 93
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: Your organization wants one place to view capacity, transactions, availability, and latency health
    across all storage accounts in a subscription, with the option to drill into a single account. Which
    Azure Monitor feature should you use?
  options:
  - id: A
    text: Network insights
    explanation: Network insights covers networking resources such as virtual networks and gateways.
  - id: B
    text: VM insights
    explanation: VM insights monitors virtual machines and scale sets, not storage accounts.
  - id: C
    text: Application Insights
    explanation: Application Insights monitors application telemetry rather than storage account health.
  - id: D
    text: Storage insights
    explanation: Storage insights provides a curated view of storage account performance, capacity, and
      availability across subscriptions.
  correct:
  - D
  explanation: Azure Monitor Insights offers curated experiences per resource type; Storage insights is
    the one for storage accounts.
  difficulty: easy
  tags:
  - objective:monitor-insights
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/insights/insights-overview
  - https://learn.microsoft.com/en-us/azure/azure-monitor/insights/storage-insights-overview
- id: 94
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: A VM in a subnet cannot receive RDP connections (TCP 3389) from an administrator workstation.
    You suspect a network security group (NSG) rule. You want a Network Watcher tool that tells you whether
    a specific 5-tuple (source, destination, protocol, ports) is allowed or denied and which NSG rule
    made that decision. Which tool should you use?
  options:
  - id: A
    text: Next hop
    explanation: Next hop shows the routing next hop type for traffic, not which NSG rule allows or denies
      it.
  - id: B
    text: IP flow verify
    explanation: IP flow verify checks a packet against effective NSG rules for a VM and returns allow
      or deny and the rule name.
  - id: C
    text: Packet capture
    explanation: Packet capture records traffic on a VM, which is heavier and does not directly name the
      NSG rule.
  - id: D
    text: Topology
    explanation: Topology visualizes the resources in a virtual network but does not evaluate rules.
  correct:
  - B
  explanation: IP flow verify tests whether a packet to or from a VM is allowed or denied by the effective
    security rules and identifies the rule responsible.
  difficulty: medium
  tags:
  - objective:monitor-network-watcher
  references:
  - https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
  - https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
- id: 95
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: Users of a branch office intermittently experience slow access to an application in Azure. You
    need to measure packet loss and round-trip latency between an Azure VM and a backend endpoint continuously,
    keep the history, and be alerted when latency exceeds a threshold. What should you use?
  options:
  - id: A
    text: Connection Monitor in Network Watcher, with alerts on its checks
    explanation: Connection Monitor runs recurring tests between sources and destinations, records loss
      and latency over time, and supports alerting.
  - id: B
    text: A one-time connection troubleshoot check
    explanation: A one-time check gives a point-in-time result and no continuous history or alerting.
  - id: C
    text: NSG flow log retention settings
    explanation: Flow logs record accepted and denied flows but do not measure latency or perform synthetic
      tests.
  - id: D
    text: Effective routes view on the NIC
    explanation: Effective routes show the routing table in force and measure nothing.
  correct:
  - A
  explanation: Connection Monitor provides continuous, scheduled connectivity monitoring with loss and
    latency metrics, and can raise alerts when thresholds are breached.
  difficulty: medium
  tags:
  - objective:monitor-network-watcher
  - objective:monitor-alerts
  references:
  - https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
- id: 96
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: An administrator must protect Azure managed disks and Azure Blob data in a storage account by
    using Azure Backup. Which vault should be created?
  options:
  - id: A
    text: A Log Analytics workspace
    explanation: A workspace stores logs and is not a backup storage entity.
  - id: B
    text: A storage account with immutable storage only
    explanation: Immutability protects stored data from modification but is not the Azure Backup vault
      construct.
  - id: C
    text: An Azure Backup vault
    explanation: Backup vaults hold backups for workloads such as Azure Disks and Azure Blobs, and for
      PostgreSQL servers.
  - id: D
    text: An Azure Key Vault
    explanation: Key Vault stores secrets, keys, and certificates, not backup data.
  correct:
  - C
  explanation: Azure Backup vaults are used for newer workloads such as Azure Disks, Azure Blobs, and
    Azure Database for PostgreSQL, whereas Recovery Services vaults cover workloads such as Azure VMs
    and Azure Files.
  difficulty: medium
  tags:
  - objective:recovery-backup-vault
  references:
  - https://learn.microsoft.com/en-us/azure/backup/backup-vault-overview
- id: 97
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: You created a Recovery Services vault in North Europe. When you try to enable backup for a VM
    that runs in West Europe, the VM is not offered for protection by that vault. What should you do?
  options:
  - id: A
    text: Create a backup policy with a longer retention period
    explanation: Retention is unrelated to why the VM is not listed.
  - id: B
    text: Assign the Backup Contributor role to the VM
    explanation: Role assignment on the VM does not change the vault and VM region requirement.
  - id: C
    text: Enable soft delete on the vault
    explanation: Soft delete protects deleted backup data and does not affect which VMs can be protected.
  - id: D
    text: Create a Recovery Services vault in West Europe and enable backup there
    explanation: A VM must be backed up to a vault in the same region as the VM.
  correct:
  - D
  explanation: Azure VM backup requires the Recovery Services vault to be in the same region as the VM.
    You need a vault per region that contains VMs you want to protect.
  difficulty: medium
  tags:
  - objective:recovery-services-vault
  references:
  - https://learn.microsoft.com/en-us/azure/backup/backup-azure-recovery-services-vault-overview
  - https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-first-look-arm
- id: 98
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: A Trusted launch Azure VM must be backed up every 4 hours, with instant-restore snapshots retained
    for several days. The VM is protected by a Recovery Services vault. Which policy configuration meets
    the requirement?
  options:
  - id: A
    text: An Enhanced backup policy with an hourly schedule (every 4 hours)
    explanation: Enhanced policies support multiple backups per day (as often as every 4 hours) and support
      Trusted launch VMs.
  - id: B
    text: A Standard backup policy with a daily schedule
    explanation: Standard policies support one backup per day, so a 4-hour frequency cannot be met.
  - id: C
    text: A Standard backup policy with a 4-hour retention rule
    explanation: Retention controls how long recovery points are kept, not how often they are taken.
  - id: D
    text: An Azure Site Recovery replication policy
    explanation: Site Recovery replication policies govern replication recovery points and are not backup
      policies.
  correct:
  - A
  explanation: A backup policy defines schedule and retention. Only the Enhanced policy for Azure VMs
    offers hourly backups (minimum interval 4 hours) and is required for Trusted launch VMs.
  difficulty: hard
  tags:
  - objective:recovery-backup-policy
  references:
  - https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
- id: 99
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: A user accidentally deleted a single configuration file from a protected Azure VM that is still
    running. You want to recover only that file with the least disruption to the running VM. What should
    you do?
  options:
  - id: A
    text: Restore the VM by using the Replace existing option
    explanation: Replace existing overwrites the VM's disks, which is disruptive and unnecessary for a
      single file.
  - id: B
    text: Fail over the VM by using Azure Site Recovery
    explanation: Failover moves the workload to another location and does not recover a deleted file.
  - id: C
    text: Use File Recovery on a recent recovery point, run the downloaded script to mount the volumes,
      and copy the file
    explanation: File Recovery mounts the recovery point's volumes so individual files can be copied without
      restoring the whole VM.
  - id: D
    text: Delete and recreate the Recovery Services vault
    explanation: Deleting the vault would destroy the backups and does not restore the file.
  correct:
  - C
  explanation: Azure Backup supports item-level recovery for Azure VMs through the File Recovery option,
    which provides a script that mounts the recovery point's disks as drives.
  difficulty: hard
  tags:
  - objective:recovery-backup-restore
  references:
  - https://learn.microsoft.com/en-us/azure/backup/backup-azure-restore-files-from-vm
  - https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
- id: 100
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: Azure Site Recovery replicates production VMs from West Europe to North Europe. Compliance requires
    a disaster recovery drill that validates the recovery plan without affecting production workloads
    or ongoing replication. What should you run?
  options:
  - id: A
    text: An unplanned failover to North Europe
    explanation: An unplanned failover is for a real outage and changes the serving location.
  - id: B
    text: A test failover into an isolated virtual network in North Europe
    explanation: A test failover creates VMs from a recovery point in a separate network, leaves the source
      VMs and replication running, and is cleaned up afterwards.
  - id: C
    text: A planned failover to North Europe
    explanation: A planned failover shuts down the source VMs and switches production, which affects workloads.
  - id: D
    text: A restore of the VMs from Azure Backup
    explanation: Azure Backup restore is not a Site Recovery drill and does not validate the recovery
      plan.
  correct:
  - B
  explanation: A test failover validates replication and the recovery plan in an isolated network with
    no impact on production or replication; you clean up the test resources when finished.
  difficulty: easy
  tags:
  - objective:recovery-failover
  - objective:recovery-site-recovery
  references:
  - https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-test-failover-to-azure
  - https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
