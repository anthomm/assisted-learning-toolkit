questions:
- id: 1
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: easy
  text: Your help desk lead must be able to create and delete cloud-only users and reset non-administrator passwords in Microsoft Entra ID. The lead must NOT be able to manage Conditional Access or billing. Which Microsoft Entra role should you assign?
  options:
  - id: A
    text: Global Reader
    explanation: Global Reader is read-only and cannot create users.
  - id: B
    text: User Administrator
    explanation: User Administrator can create and manage users and reset non-admin passwords without broader tenant rights.
  - id: C
    text: Billing Administrator
    explanation: Billing Administrator manages purchases and subscriptions, not user lifecycle.
  - id: D
    text: Security Administrator
    explanation: Security Administrator manages security features such as Identity Protection, not user creation.
  correct: [B]
  explanation: The User Administrator role provides least-privilege user lifecycle management and password resets for non-administrators, without Conditional Access or billing rights.
  references:
  - https://learn.microsoft.com/entra/identity/role-based-access-control/permissions-reference
  - https://learn.microsoft.com/entra/fundamentals/how-to-create-delete-users

- id: 2
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: medium
  text: Contoso wants everyone whose `department` attribute is "Sales" to be placed automatically in a group, and removed when the attribute changes. Which group configuration should you create?
  options:
  - id: A
    text: A Security group with the Assigned membership type and a nightly script
    explanation: Assigned membership needs manual or scripted maintenance, which is not automatic in Entra ID.
  - id: B
    text: A Microsoft 365 group with the Assigned membership type
    explanation: Assigned membership is still manual.
  - id: C
    text: A Security group with the Dynamic User membership type and the rule `(user.department -eq "Sales")`
    explanation: Dynamic user groups evaluate attribute rules and add or remove members automatically (requires Entra ID P1).
  - id: D
    text: A Security group with the Dynamic Device membership type and the rule `(device.department -eq "Sales")`
    explanation: Dynamic Device groups evaluate device attributes, not user attributes.
  correct: [C]
  explanation: Dynamic User groups use a membership rule on user attributes and update membership automatically. Dynamic membership requires Microsoft Entra ID P1 licenses.
  references:
  - https://learn.microsoft.com/entra/identity/users/groups-dynamic-membership
  - https://learn.microsoft.com/entra/fundamentals/how-to-manage-groups

- id: 3
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: medium
  text: You assign a Microsoft 365 E5 license to a security group that contains 200 users. Licenses are assigned to most users, but for 12 users the group shows a licensing error and no license is applied. These 12 users are all cloud-only users. What is the most likely cause?
  options:
  - id: A
    text: The users do not have a usage location configured
    explanation: Group-based licensing requires a usage location on each user; users without one fail processing.
  - id: B
    text: The users are not members of a Microsoft 365 group
    explanation: Group-based licensing works with security groups; Microsoft 365 group membership is not required.
  - id: C
    text: The users have not registered for multifactor authentication
    explanation: MFA registration does not affect license assignment.
  - id: D
    text: The users are assigned the Global Reader role
    explanation: Entra role assignments do not block licensing.
  correct: [A]
  explanation: Some Microsoft services are not available in all locations, so each licensed user must have a usage location. Set it on the users and reprocess the group licenses.
  references:
  - https://learn.microsoft.com/entra/identity/users/licensing-groups-resolve-problems
  - https://learn.microsoft.com/entra/identity/users/licensing-groups-assign

- id: 4
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: easy
  text: An external consultant with a corporate email address at fabrikam.com needs to access an app that is secured by your Microsoft Entra tenant. The consultant must continue to use their own Fabrikam credentials. What should you do?
  options:
  - id: A
    text: Create a member user with a UPN in your tenant's domain and share the password
    explanation: This gives the consultant a separate identity and password, and does not use their own credentials.
  - id: B
    text: Add fabrikam.com as a custom domain in your tenant
    explanation: You cannot verify a domain owned by another organization; custom domains are for your own domains.
  - id: C
    text: Create a new Azure AD B2C tenant
    explanation: Azure AD B2C is for customer-facing apps, not for business partner access to workforce resources.
  - id: D
    text: Invite the consultant as an external (guest) user using B2B collaboration
    explanation: B2B guests sign in with their own organization's identity.
  correct: [D]
  explanation: Microsoft Entra B2B collaboration lets you invite external users as guests who authenticate with their home credentials while you control their access.
  references:
  - https://learn.microsoft.com/entra/external-id/what-is-b2b
  - https://learn.microsoft.com/entra/external-id/add-users-administrator

- id: 5
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: medium
  text: You plan to pilot self-service password reset (SSPR) with only the members of a group named `SSPR-Pilot`. All other users must continue to contact the help desk. What should you configure?
  options:
  - id: A
    text: Enable security defaults for the tenant
    explanation: Security defaults enforce MFA baselines and do not scope SSPR.
  - id: B
    text: Set Self service password reset enabled to Selected and choose the `SSPR-Pilot` group
    explanation: The Selected scope enables SSPR for a specific group.
  - id: C
    text: Create a Conditional Access policy that targets `SSPR-Pilot`
    explanation: Conditional Access does not enable SSPR for users.
  - id: D
    text: Assign the Password Administrator role to `SSPR-Pilot`
    explanation: This lets members reset other users' passwords; it does not enable self-service.
  correct: [B]
  explanation: In Password reset > Properties, set SSPR to Selected and pick the pilot group. Later you can switch to All.
  references:
  - https://learn.microsoft.com/entra/identity/authentication/tutorial-enable-sspr
  - https://learn.microsoft.com/entra/identity/authentication/concept-sspr-howitworks

- id: 6
  domain: identities-governance
  topic: entra-users-groups
  type: multiple
  difficulty: hard
  text: |
    Your users are synchronized from on-premises Active Directory by using Microsoft Entra Connect. You want users to reset their own passwords in the Entra self-service portal and have the new password written to on-premises AD. Choose 2.
  options:
  - id: A
    text: Deploy Microsoft Entra Domain Services
    explanation: Domain Services is a managed domain service and is not required for password writeback.
  - id: B
    text: Enable password writeback in Microsoft Entra Connect
    explanation: Password writeback is the feature that sends changed passwords back to on-premises AD.
  - id: C
    text: Enable pass-through authentication on the Connect server
    explanation: Pass-through authentication validates sign-ins and is not needed for SSPR writeback.
  - id: D
    text: Assign Microsoft Entra ID P1 (or higher) licenses to the users
    explanation: SSPR with on-premises writeback requires premium licensing.
  correct: [B, D]
  explanation: SSPR for hybrid users requires password writeback to be enabled in Entra Connect and Microsoft Entra ID P1 or P2 licensing for the users.
  references:
  - https://learn.microsoft.com/entra/identity/authentication/concept-sspr-writeback
  - https://learn.microsoft.com/entra/identity/authentication/tutorial-enable-sspr-writeback

- id: 7
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: hard
  text: You need to create a group that will be assigned the Microsoft Entra role Helpdesk Administrator, so that administrators get the role through group membership. Which setting must you choose when you create the group?
  options:
  - id: A
    text: Set "Microsoft Entra roles can be assigned to the group" to Yes
    explanation: This role-assignable setting can only be chosen at creation time and cannot be changed later.
  - id: B
    text: Set the membership type to Dynamic User
    explanation: Role-assignable groups cannot use dynamic membership.
  - id: C
    text: Set the group type to Microsoft 365 and enable Teams
    explanation: Teams enablement is not related to role assignment.
  - id: D
    text: Create the group, then enable role assignment later in the group properties
    explanation: The role-assignable property cannot be modified after the group is created.
  correct: [A]
  explanation: Only groups created with isAssignableToRole enabled can be assigned Entra roles. The setting is immutable and the group must use assigned membership.
  references:
  - https://learn.microsoft.com/entra/identity/role-based-access-control/groups-concept
  - https://learn.microsoft.com/entra/identity/role-based-access-control/groups-create-eligible

- id: 8
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: easy
  text: HR gives you a spreadsheet of 150 new employees. What is the most efficient way to create all of the user accounts in Microsoft Entra ID?
  options:
  - id: A
    text: Create each user separately in the Azure portal
    explanation: This works but is slow and error-prone for 150 users.
  - id: B
    text: Invite the users as guests
    explanation: Employees should be members, not guests.
  - id: C
    text: Use the bulk create option and upload a completed CSV template
    explanation: Bulk create accepts a CSV file to create many users in one operation.
  - id: D
    text: Create a dynamic group containing the employees
    explanation: Groups do not create user accounts.
  correct: [C]
  explanation: In the Entra admin center, Users > Bulk operations > Bulk create lets you upload a CSV with the user details.
  references:
  - https://learn.microsoft.com/entra/identity/users/users-bulk-add
  - https://learn.microsoft.com/entra/fundamentals/how-to-create-delete-users

- id: 9
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: medium
  text: Project managers must be able to invite external guest users, but they must not be able to manage other users or groups. You will use the least privilege approach. What should you do?
  options:
  - id: A
    text: Assign the User Administrator role to the project managers
    explanation: This grants far more than inviting guests.
  - id: B
    text: Assign the Global Administrator role to the project managers
    explanation: Excessive privilege.
  - id: C
    text: Assign the Azure Contributor role at the subscription
    explanation: Azure RBAC roles do not control guest invitations in Entra ID.
  - id: D
    text: Assign the Guest Inviter role to the project managers
    explanation: Guest Inviter allows inviting guests without other user management rights.
  correct: [D]
  explanation: Guest Inviter is a Microsoft Entra role that can invite guest users regardless of the external collaboration invitation settings, with no other user management rights.
  references:
  - https://learn.microsoft.com/entra/external-id/external-collaboration-settings-configure
  - https://learn.microsoft.com/entra/identity/role-based-access-control/permissions-reference

- id: 10
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: easy
  text: An administrator accidentally deleted a user account 10 days ago. You need to recover the account with its original object ID and group memberships restored. What should you do?
  options:
  - id: A
    text: Create a new user with the same UPN
    explanation: A new user gets a new object ID and does not restore previous associations.
  - id: B
    text: Restore the user from Deleted users in the Entra admin center
    explanation: Deleted users are retained for 30 days and can be restored.
  - id: C
    text: Open a support request, because deleted users cannot be restored
    explanation: Soft-deleted users can be restored by administrators themselves.
  - id: D
    text: Run Microsoft Entra Connect delta sync
    explanation: This only applies to synchronized users and cannot restore cloud-only ones.
  correct: [B]
  explanation: Deleted users remain recoverable for 30 days. Restoring preserves the object ID and most attributes.
  references:
  - https://learn.microsoft.com/entra/fundamentals/users-restore
  - https://learn.microsoft.com/entra/fundamentals/how-to-create-delete-users

- id: 11
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: medium
  text: You need a group that automatically contains every guest user in your tenant, so that you can assign a single access package policy later. Which dynamic membership rule should you use?
  options:
  - id: A
    text: '(user.userType -eq "Guest")'
    explanation: The userType attribute is "Guest" for B2B guest users.
  - id: B
    text: '(user.accountEnabled -eq false)'
    explanation: This matches disabled accounts, not guests.
  - id: C
    text: '(user.department -eq "Guest")'
    explanation: Department is a free-text field not set for guests by default.
  - id: D
    text: '(user.mail -endsWith "guest")'
    explanation: Guest email addresses are in normal domains and do not end in "guest".
  correct: [A]
  explanation: Use the user.userType attribute with the value "Guest" in a Dynamic User group.
  references:
  - https://learn.microsoft.com/entra/identity/users/groups-dynamic-membership
  - https://learn.microsoft.com/entra/external-id/use-dynamic-groups

- id: 12
  domain: identities-governance
  topic: entra-users-groups
  type: single
  difficulty: medium
  text: Which Azure CLI command creates a cloud-only user that is forced to change the password at the first sign-in?
  options:
  - id: A
    text: |
      az ad user create --display-name "Ana Silva" --user-principal-name ana@contoso.com --password "P@ssw0rd!2026" --force-change-password-next-sign-in false
    explanation: The false value does not require a password change.
  - id: B
    text: |
      az ad group create --display-name "Ana Silva" --mail-nickname ana
    explanation: This creates a group, not a user.
  - id: C
    text: |
      az ad user create --display-name "Ana Silva" --user-principal-name ana@contoso.com --password "P@ssw0rd!2026" --force-change-password-next-sign-in true
    explanation: This creates the user and requires a password change at first sign-in.
  - id: D
    text: |
      az account set --subscription ana@contoso.com
    explanation: This changes the active subscription and does not create a user.
  correct: [C]
  explanation: az ad user create with --force-change-password-next-sign-in true creates the user and forces a password change on first sign-in.
  references:
  - https://learn.microsoft.com/cli/azure/ad/user
  - https://learn.microsoft.com/entra/fundamentals/how-to-create-delete-users

- id: 13
  domain: identities-governance
  topic: azure-rbac
  type: single
  difficulty: easy
  text: An auditor needs to view all resources and their configuration in a subscription but must not be able to change anything. Which built-in role should you assign at the subscription scope?
  options:
  - id: A
    text: Contributor
    explanation: Contributor can create and modify resources.
  - id: B
    text: Owner
    explanation: Owner has full access, including role assignments.
  - id: C
    text: User Access Administrator
    explanation: This role manages access, not viewing resource configuration.
  - id: D
    text: Reader
    explanation: Reader can view existing resources but cannot make changes.
  correct: [D]
  explanation: The Reader role grants read-only access to all resources in the scope.
  references:
  - https://learn.microsoft.com/azure/role-based-access-control/built-in-roles
  - https://learn.microsoft.com/azure/role-based-access-control/overview

- id: 14
  domain: identities-governance
  topic: azure-rbac
  type: single
  difficulty: medium
  text: A user has the Contributor role on a resource group named `rg-app`. The user must also be able to grant other users access to resources in `rg-app` only. You will follow the principle of least privilege. What should you do?
  options:
  - id: A
    text: Assign the Owner role at the subscription scope
    explanation: This grants far more than needed and covers all resource groups.
  - id: B
    text: Assign the User Access Administrator role at the `rg-app` scope
    explanation: This allows role assignment within rg-app only, while Contributor remains for resource management.
  - id: C
    text: Assign the Reader role at the `rg-app` scope
    explanation: Reader does not allow role assignments.
  - id: D
    text: Assign the Security Administrator Entra role
    explanation: This Entra role does not grant Azure RBAC role assignment rights.
  correct: [B]
  explanation: Contributor cannot create role assignments. User Access Administrator at the resource group scope allows managing access for only that group.
  references:
  - https://learn.microsoft.com/azure/role-based-access-control/role-assignments-portal
  - https://learn.microsoft.com/azure/role-based-access-control/built-in-roles

- id: 15
  domain: identities-governance
  topic: azure-rbac
  type: single
  difficulty: medium
  text: The management group `mg-corp` contains Subscription1 and Subscription2. The group `Auditors` is assigned the Reader role at `mg-corp`. Next week Subscription3 will be moved into `mg-corp`. What access will `Auditors` have on Subscription3 after the move?
  options:
  - id: A
    text: Reader, through inheritance from `mg-corp`
    explanation: Role assignments at a management group are inherited by all child subscriptions and resources.
  - id: B
    text: None, until you assign the role on Subscription3 directly
    explanation: Inheritance applies automatically to new children.
  - id: C
    text: Contributor, because new subscriptions receive elevated rights
    explanation: There is no automatic elevation.
  - id: D
    text: Reader, but only after Azure Policy is assigned to `mg-corp`
    explanation: Policy is unrelated to RBAC inheritance.
  correct: [A]
  explanation: 'Azure RBAC assignments inherit down the hierarchy, from management group to subscription to resource group to resource.'
  references:
  - https://learn.microsoft.com/azure/role-based-access-control/scope-overview
  - https://learn.microsoft.com/azure/governance/management-groups/overview

- id: 16
  domain: identities-governance
  topic: azure-rbac
  type: single
  difficulty: medium
  text: |
    You run the following command and receive this output (abbreviated):

    ```
    az role assignment list --assignee "dev-team" --all --query "[].{role:roleDefinitionName, scope:scope}" -o table

    Role         Scope
    -----------  ---------------------------------------------------------------
    Contributor  /subscriptions/aaaa-1111/resourceGroups/rg-app
    Reader       /subscriptions/aaaa-1111
    ```

    What can the `dev-team` group do?
  options:
  - id: A
    text: Create virtual machines in any resource group in the subscription
    explanation: Contributor is limited to rg-app; elsewhere the group is only a Reader.
  - id: B
    text: Delete resources in `rg-web`
    explanation: Only Reader applies to rg-web, which does not allow deletion.
  - id: C
    text: Create virtual machines in `rg-app` and view resources in other resource groups
    explanation: Contributor on rg-app plus Reader inherited on the subscription.
  - id: D
    text: Assign roles to other users in `rg-app`
    explanation: Contributor cannot write role assignments.
  correct: [C]
  explanation: Permissions are additive. The group has Contributor on rg-app and Reader across the subscription, but cannot manage access.
  references:
  - https://learn.microsoft.com/azure/role-based-access-control/role-assignments-list-cli
  - https://learn.microsoft.com/azure/role-based-access-control/overview

- id: 17
  domain: identities-governance
  topic: azure-rbac
  type: single
  difficulty: hard
  text: |
    A user is assigned the built-in Contributor role at a subscription. You also assign the user this custom role at the same subscription, intending to prevent VM deletion:

    ```json
    {
      "Name": "VM Operator",
      "Actions": [ "Microsoft.Compute/virtualMachines/*" ],
      "NotActions": [ "Microsoft.Compute/virtualMachines/delete" ],
      "AssignableScopes": [ "/subscriptions/aaaa-1111" ]
    }
    ```

    Can the user delete a virtual machine?
  options:
  - id: A
    text: No, because NotActions in the custom role denies the delete action
    explanation: NotActions excludes actions from that role only; it is not a deny.
  - id: B
    text: No, because custom roles take precedence over built-in roles
    explanation: There is no such precedence.
  - id: C
    text: No, because Contributor cannot delete virtual machines
    explanation: Contributor can delete resources.
  - id: D
    text: Yes, because role permissions are additive and Contributor allows the delete action
    explanation: Effective permissions are the union of all assignments. Only deny assignments can block it.
  correct: [D]
  explanation: NotActions subtracts permissions within a single role definition and does not act as a deny. Since Contributor includes delete, the user can delete VMs. Removing the Contributor assignment or using a deny assignment (such as through Azure Blueprints/deployment stacks) is required.
  references:
  - https://learn.microsoft.com/azure/role-based-access-control/role-definitions
  - https://learn.microsoft.com/azure/role-based-access-control/deny-assignments

- id: 18
  domain: identities-governance
  topic: azure-rbac
  type: single
  difficulty: medium
  text: A developer has the Reader role on a storage account. When the developer tries to view the blobs of a container in the Azure portal by using Microsoft Entra authorization, access is denied. Which role should you assign at the least necessary scope so that the developer can read blob data?
  options:
  - id: A
    text: Storage Account Contributor
    explanation: This manages the account (control plane) and does not grant data plane access through Entra ID by default.
  - id: B
    text: Storage Blob Data Reader
    explanation: Grants read access to blob containers and data, the data plane action needed.
  - id: C
    text: Contributor
    explanation: Also a control plane role without direct data access via Entra authorization.
  - id: D
    text: Backup Reader
    explanation: Allows viewing backup information only.
  correct: [B]
  explanation: Reading blob data with Entra ID requires a data role such as Storage Blob Data Reader. Control plane roles like Reader or Contributor do not include dataActions.
  references:
  - https://learn.microsoft.com/azure/storage/blobs/assign-azure-role-data-access
  - https://learn.microsoft.com/azure/role-based-access-control/built-in-roles

- id: 19
  domain: identities-governance
  topic: azure-rbac
  type: multiple
  difficulty: medium
  text: Which two built-in Azure roles can create role assignments at a subscription scope? Choose 2.
  options:
  - id: A
    text: Owner
    explanation: Owner has full access, including managing role assignments.
  - id: B
    text: Contributor
    explanation: Contributor explicitly excludes Microsoft.Authorization/*/Write.
  - id: C
    text: User Access Administrator
    explanation: This role is dedicated to managing user access to Azure resources.
  - id: D
    text: Reader
    explanation: Reader is read-only.
  correct: [A, C]
  explanation: Owner and User Access Administrator include Microsoft.Authorization/roleAssignments/write. Role Based Access Control Administrator also can, with optional conditions.
  references:
  - https://learn.microsoft.com/azure/role-based-access-control/built-in-roles
  - https://learn.microsoft.com/azure/role-based-access-control/role-assignments-steps

- id: 20
  domain: identities-governance
  topic: azure-rbac
  type: single
  difficulty: easy
  text: You need to determine which roles a specific user is assigned, including those inherited from higher scopes, for a resource group. Which Azure portal feature should you use?
  options:
  - id: A
    text: Access control (IAM) > Check access
    explanation: Check access shows the effective role assignments for a user, group, or service principal at the scope.
  - id: B
    text: Policy > Compliance
    explanation: Compliance shows policy state, not roles.
  - id: C
    text: Resource locks
    explanation: Locks do not list role assignments.
  - id: D
    text: Cost analysis
    explanation: Cost analysis shows spending.
  correct: [A]
  explanation: The Check access tab of Access control (IAM) shows the roles a principal has at the scope, including inherited assignments.
  references:
  - https://learn.microsoft.com/azure/role-based-access-control/check-access
  - https://learn.microsoft.com/azure/role-based-access-control/role-assignments-list-portal

- id: 21
  domain: identities-governance
  topic: azure-rbac
  type: single
  difficulty: hard
  text: A Global Administrator in your tenant cannot see or manage any Azure subscriptions in the portal, because the only subscription owners left the company. You need to regain access to manage all subscriptions in the tenant. What should the Global Administrator do?
  options:
  - id: A
    text: Assign the Owner role on each subscription from the Entra admin center
    explanation: The Global Administrator has no Azure RBAC rights to do this without elevation.
  - id: B
    text: Create a new subscription and transfer the old resources
    explanation: This does not provide access to existing subscriptions.
  - id: C
    text: Enable "Access management for Azure resources" to elevate access
    explanation: Elevating access grants User Access Administrator at the root scope (/), from which roles can be assigned.
  - id: D
    text: Assign the Global Administrator the Application Administrator role
    explanation: Entra roles do not grant Azure resource access.
  correct: [C]
  explanation: Elevated access assigns the User Access Administrator role at root scope, enabling the Global Administrator to grant themselves access to subscriptions and then remove the elevation.
  references:
  - https://learn.microsoft.com/azure/role-based-access-control/elevate-access-global-admin
  - https://learn.microsoft.com/azure/role-based-access-control/rbac-and-directory-admin-roles

- id: 22
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: easy
  text: You need to ensure that a production resource group containing critical resources cannot be deleted accidentally, while authorized users can still modify the resources. Which lock type should you apply?
  options:
  - id: A
    text: Read-only on the subscription
    explanation: Read-only blocks modifications and is applied to a broader scope than needed.
  - id: B
    text: Read-only on the resource group
    explanation: Read-only prevents updates, which conflicts with the requirement.
  - id: C
    text: A Deny effect Azure Policy
    explanation: Policy governs resource properties, not deletion of existing resources.
  - id: D
    text: Delete (CanNotDelete) on the resource group
    explanation: Allows read and modify but blocks deletion.
  correct: [D]
  explanation: A Delete lock (CanNotDelete) lets authorized users read and modify resources but prevents deletion of the locked scope and its child resources.
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/management/lock-resources
  - https://learn.microsoft.com/azure/governance/blueprints/overview

- id: 23
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: medium
  text: Compliance requires that no resources can be created outside West Europe and North Europe in a subscription. Existing resources in other regions can stay. What should you assign at the subscription scope?
  options:
  - id: A
    text: The Allowed locations policy with the Audit effect
    explanation: Audit only reports non-compliance and does not block creation.
  - id: B
    text: The Allowed locations policy with the Deny effect
    explanation: Deny blocks new or updated resources in other regions without deleting existing ones.
  - id: C
    text: A Delete lock on every resource group
    explanation: Locks do not restrict regions of new resources.
  - id: D
    text: A custom RBAC role without the location permission
    explanation: RBAC has no region-based permission.
  correct: [B]
  explanation: The built-in Allowed locations definition uses a Deny effect to block deployments outside the specified regions. Existing resources are flagged non-compliant but not removed.
  references:
  - https://learn.microsoft.com/azure/governance/policy/samples/built-in-policies
  - https://learn.microsoft.com/azure/governance/policy/concepts/effect-deny

- id: 24
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: medium
  text: Your resource groups are tagged with `CostCenter`, but resources created in them are not. You need new and updated resources to automatically receive the tag value from their resource group. What should you use?
  options:
  - id: A
    text: Azure Policy assignment of "Inherit a tag from the resource group if missing" (Modify effect)
    explanation: The Modify effect adds the tag with the value from the parent resource group.
  - id: B
    text: A resource lock on the resource group
    explanation: Locks do not propagate tags.
  - id: C
    text: Nothing, tags are inherited automatically
    explanation: Tags on resource groups are not inherited by resources by default.
  - id: D
    text: An Azure Advisor recommendation
    explanation: Advisor does not apply tags.
  correct: [A]
  explanation: Tags are not inherited by default. The built-in Modify policy copies the tag from the resource group, and a remediation task can fix existing resources.
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/management/tag-policies
  - https://learn.microsoft.com/azure/azure-resource-manager/management/tag-resources

- id: 25
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: medium
  text: You move a virtual machine from a resource group in Subscription1 to a resource group in Subscription2. Both subscriptions are in the same Microsoft Entra tenant. Which statement is true after the move?
  options:
  - id: A
    text: The resource ID of the VM stays unchanged
    explanation: The resource ID includes subscription and resource group, so it changes.
  - id: B
    text: The VM is automatically migrated to the region of the destination resource group
    explanation: Moving does not change the region of the resource.
  - id: C
    text: The VM keeps its region but gets a new resource ID
    explanation: Only the resource group and subscription change, and the region stays the same.
  - id: D
    text: The VM is deleted and re-created
    explanation: The move changes metadata only; no re-creation is needed.
  correct: [C]
  explanation: Moving resources changes the resource group (and possibly subscription), which changes the resource ID. The location of the resource does not change.
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/management/move-resource-group-and-subscription
  - https://learn.microsoft.com/azure/azure-resource-manager/management/move-support-resources

- id: 26
  domain: identities-governance
  topic: subscriptions-governance
  type: multiple
  difficulty: hard
  text: Which two statements about Azure management groups are true? Choose 2.
  options:
  - id: A
    text: A subscription can be a member of multiple management groups at once
    explanation: A subscription has exactly one parent management group.
  - id: B
    text: A management group hierarchy supports up to six levels of depth, not including the root and subscription levels
    explanation: Six levels of depth is the supported limit.
  - id: C
    text: Azure Policy assignments at a management group apply to all subscriptions beneath it
    explanation: Policy assignments inherit to children.
  - id: D
    text: Management groups can contain resource groups directly
    explanation: Management groups contain subscriptions and other management groups, not resource groups.
  correct: [B, C]
  explanation: Management groups form a tree of up to six levels. Policy and RBAC assignments inherit down the tree. Each subscription has a single parent.
  references:
  - https://learn.microsoft.com/azure/governance/management-groups/overview
  - https://learn.microsoft.com/azure/governance/management-groups/how-to/manage

- id: 27
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: hard
  text: A development subscription has a monthly budget of $2,000. When actual costs reach 100%, the dev virtual machines should be shut down automatically. What should you configure?
  options:
  - id: A
    text: A budget with an email alert only
    explanation: Email only notifies and does not stop resources.
  - id: B
    text: A spending limit on the subscription
    explanation: Spending limits are not available for pay-as-you-go or enterprise subscriptions.
  - id: C
    text: An Azure Advisor cost recommendation
    explanation: Advisor recommends but does not enforce.
  - id: D
    text: A budget alert that triggers an action group running an Automation runbook or Logic App to stop the VMs
    explanation: Budgets can call action groups, which can automate remediation.
  correct: [D]
  explanation: Budgets only notify by default and do not stop resources. Attach an action group to the budget alert that invokes automation to deallocate the VMs.
  references:
  - https://learn.microsoft.com/azure/cost-management-billing/manage/cost-management-budget-scenario
  - https://learn.microsoft.com/azure/cost-management-billing/costs/tutorial-acm-create-budgets

- id: 28
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: easy
  text: You want a list of recommendations that identifies underutilized virtual machines which could be resized or shut down to reduce spend. Which Azure service should you use?
  options:
  - id: A
    text: Azure Service Health
    explanation: Service Health reports Azure outages and planned maintenance.
  - id: B
    text: Azure Advisor
    explanation: Advisor Cost recommendations include right-sizing or shutting down underused VMs.
  - id: C
    text: Azure Policy
    explanation: Policy enforces and audits rules, not utilization analysis.
  - id: D
    text: Microsoft Defender for Cloud secure score
    explanation: This addresses security posture.
  correct: [B]
  explanation: Azure Advisor analyzes usage and configuration and offers cost recommendations such as right-size or shut down low-utilization VMs.
  references:
  - https://learn.microsoft.com/azure/advisor/advisor-cost-recommendations
  - https://learn.microsoft.com/azure/advisor/advisor-overview

- id: 29
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: medium
  text: You assign an Azure Policy initiative to the management group `mg-prod`. One resource group named `rg-lab` in a child subscription must be exempt from the evaluation. What is the simplest way to do this?
  options:
  - id: A
    text: Configure `rg-lab` as an exclusion on the initiative assignment, or create a policy exemption for it
    explanation: Assignments support excluded scopes, and exemptions can also waive specific resources.
  - id: B
    text: Move `rg-lab` to a different management group
    explanation: Resource groups cannot be moved into management groups directly.
  - id: C
    text: Apply a ReadOnly lock to `rg-lab`
    explanation: Locks do not affect policy evaluation.
  - id: D
    text: Assign the Reader role on `rg-lab` to the policy
    explanation: RBAC does not exempt resources from policy.
  correct: [A]
  explanation: Excluded scopes on the assignment or a policy exemption allow a resource group to be skipped.
  references:
  - https://learn.microsoft.com/azure/governance/policy/concepts/assignment-structure
  - https://learn.microsoft.com/azure/governance/policy/concepts/exemption-structure

- id: 30
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: hard
  text: You assign a policy with the DeployIfNotExists effect that enables diagnostic settings on storage accounts. Existing storage accounts show as non-compliant, and new ones are remediated automatically. What must you do to fix the existing storage accounts?
  options:
  - id: A
    text: Change the effect to Deny
    explanation: Deny blocks new non-compliant resources but does not remediate existing ones.
  - id: B
    text: Wait for the policy to remediate them automatically
    explanation: DeployIfNotExists does not remediate existing resources without a remediation task.
  - id: C
    text: Create a remediation task, using the assignment's managed identity that has the required role
    explanation: Remediation tasks deploy the template for existing non-compliant resources using the managed identity.
  - id: D
    text: Delete and recreate the storage accounts
    explanation: This is unnecessary and disruptive.
  correct: [C]
  explanation: DeployIfNotExists and Modify policies only act on new or updated resources automatically. Existing resources need a remediation task, which uses a managed identity granted the needed permissions.
  references:
  - https://learn.microsoft.com/azure/governance/policy/how-to/remediate-resources
  - https://learn.microsoft.com/azure/governance/policy/concepts/effect-deploy-if-not-exists

- id: 31
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: medium
  text: A resource group `rg-data` contains a storage account that has a Delete lock. There is no lock on the resource group itself. An Owner tries to delete `rg-data`. What happens?
  options:
  - id: A
    text: The resource group and storage account are deleted, since the lock is not on the group
    explanation: Locks on child resources block the deletion of the parent resource group.
  - id: B
    text: Only the resources other than the storage account are deleted
    explanation: The deletion operation fails as a whole.
  - id: C
    text: The lock is removed automatically, then the group is deleted
    explanation: Locks are never removed automatically.
  - id: D
    text: The deletion fails until the lock is removed
    explanation: A resource-level Delete lock prevents deleting the resource group that contains it.
  correct: [D]
  explanation: A lock on a resource inside a resource group blocks the deletion of that group. Even Owners must remove the lock first.
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/management/lock-resources
  - https://learn.microsoft.com/azure/azure-resource-manager/management/delete-resource-group

- id: 32
  domain: identities-governance
  topic: subscriptions-governance
  type: multiple
  difficulty: hard
  text: You want every new resource group in a subscription to be created with a `CostCenter` tag, and every resource created within a group to receive the group's `CostCenter` value. Which two actions should you take? Choose 2.
  options:
  - id: A
    text: Assign the built-in policy "Require a tag on resource groups" for `CostCenter`
    explanation: With the Deny effect, creation of resource groups without the tag fails.
  - id: B
    text: Apply a CanNotDelete lock to the subscription
    explanation: Locks do not enforce tags.
  - id: C
    text: Create a budget scoped to the subscription
    explanation: A budget only monitors cost.
  - id: D
    text: Assign the built-in policy "Inherit a tag from the resource group if missing" for `CostCenter`
    explanation: The Modify effect copies the tag onto resources.
  correct: [A, D]
  explanation: Requiring the tag on resource groups ensures that the source value exists, and the Modify policy propagates it to resources in the group.
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/management/tag-policies
  - https://learn.microsoft.com/azure/governance/policy/concepts/effect-modify

- id: 33
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: easy
  text: |
    You create a resource group in West Europe and then run:

    ```
    az vm create --resource-group rg-app --name vm1 --location northeurope --image Ubuntu2204 --generate-ssh-keys
    ```

    No policies or locks are assigned. What is the result?
  options:
  - id: A
    text: The command fails because a resource must be in the same region as its resource group
    explanation: There is no such restriction.
  - id: B
    text: The VM is created in North Europe
    explanation: The resource group location only stores metadata; resources can be in any supported region.
  - id: C
    text: The VM is created in West Europe
    explanation: The explicit location parameter is honored.
  - id: D
    text: The resource group is moved to North Europe
    explanation: A resource group's location cannot be changed this way.
  correct: [B]
  explanation: A resource group location only determines where its metadata is stored. Resources inside can be in different regions.
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/management/manage-resource-groups-portal
  - https://learn.microsoft.com/azure/azure-resource-manager/management/overview

- id: 34
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: medium
  text: |
    You try to move a virtual machine to a resource group in another subscription of the same tenant and the operation fails with an error indicating that the resource provider `Microsoft.Compute` is not registered in the destination subscription. What should you do?
  options:
  - id: A
    text: Register the Microsoft.Compute resource provider in the destination subscription and retry
    explanation: The destination subscription must have the resource provider registered for the resource types being moved.
  - id: B
    text: Move the VM to a new management group
    explanation: Management groups do not affect resource provider registration.
  - id: C
    text: Assign the Contributor role at the root management group
    explanation: Permissions are not the problem.
  - id: D
    text: Change the VM region
    explanation: Region does not affect provider registration.
  correct: [A]
  explanation: The destination subscription must be registered for the resource providers of the moving resources. Registration requires the */register/action permission.
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/management/resource-providers-and-types
  - https://learn.microsoft.com/azure/azure-resource-manager/management/move-resource-group-and-subscription

- id: 35
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: medium
  text: Resources across many resource groups are tagged with a `Department` tag. Finance wants a view of spending by department for the current month. What should you use?
  options:
  - id: A
    text: Azure Advisor reliability recommendations
    explanation: Advisor does not report spending breakdowns.
  - id: B
    text: Azure Policy compliance
    explanation: Policy shows compliance, not cost.
  - id: C
    text: Cost analysis in Microsoft Cost Management, grouped by the `Department` tag
    explanation: Cost analysis lets you group and filter costs by tag.
  - id: D
    text: Activity log
    explanation: The activity log shows operations, not costs.
  correct: [C]
  explanation: Cost analysis can group costs by tag, provided the resources are tagged (tags apply only to usage after they are added).
  references:
  - https://learn.microsoft.com/azure/cost-management-billing/costs/quick-acm-cost-analysis
  - https://learn.microsoft.com/azure/azure-resource-manager/management/tag-resources

- id: 36
  domain: identities-governance
  topic: subscriptions-governance
  type: single
  difficulty: hard
  text: You assign a new policy to a subscription and want to evaluate compliance immediately instead of waiting for the standard cycle. Which command should you use?
  options:
  - id: A
    text: az policy assignment delete
    explanation: This removes the assignment.
  - id: B
    text: az lock create
    explanation: This creates a resource lock.
  - id: C
    text: az role assignment list
    explanation: This lists RBAC assignments.
  - id: D
    text: az policy state trigger-scan
    explanation: This starts an on-demand compliance evaluation scan.
  correct: [D]
  explanation: Standard compliance evaluation runs about every 24 hours. You can start an on-demand scan with az policy state trigger-scan or Start-AzPolicyComplianceScan.
  references:
  - https://learn.microsoft.com/azure/governance/policy/how-to/get-compliance-data
  - https://learn.microsoft.com/cli/azure/policy/state
- id: 37
  domain: storage
  topic: storage-access
  type: single
  text: A contractor must upload files to a single blob container for the next 48 hours. You do not want to share the storage account keys or create an Entra account for the contractor. What should you provide?
  options:
  - {id: A, text: "A shared access signature (SAS) scoped to the container with write permission and a 48-hour expiry", explanation: "Correct. A SAS grants limited, time-bound delegated access without exposing account keys."}
  - {id: B, text: "The primary storage account access key", explanation: "Keys give full access to the entire account and cannot be time-limited."}
  - {id: C, text: "The Owner role on the storage account", explanation: "This grants far more privilege than required and needs an Entra identity."}
  - {id: D, text: "Anonymous public access on the container", explanation: "Anonymous access is read-only and available to everyone, not just the contractor."}
  correct: [A]
  explanation: A SAS provides granular permissions, scope, and expiry without sharing account keys or requiring an Entra identity.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-sas-overview
- id: 38
  domain: storage
  topic: storage-access
  type: single
  text: Several partner applications use service SAS tokens that reference a stored access policy on the container 'exports'. One partner is compromised. You must immediately revoke the tokens issued to that partner without regenerating the storage account keys. What should you do?
  options:
  - {id: A, text: "Regenerate key2 of the storage account", explanation: "Service SAS tokens that reference a stored access policy are not signed per-token revocable via key rotation without affecting other tokens, and this is not the targeted approach."}
  - {id: B, text: "Modify the stored access policy to expire in the past, or delete the policy", explanation: "Correct. Tokens linked to a stored access policy inherit its constraints, so changing or deleting the policy revokes them."}
  - {id: C, text: "Edit the expiry time of each issued SAS token", explanation: "A SAS token cannot be edited after it has been issued."}
  - {id: D, text: "Delete the container 'exports'", explanation: "This revokes access but destroys the data and affects all partners."}
  correct: [B]
  explanation: A stored access policy lets you change or revoke the permissions and expiry of the SAS tokens bound to it after issuance, without rotating account keys.
  difficulty: medium
  references:
  - https://learn.microsoft.com/rest/api/storageservices/define-stored-access-policy
  - https://learn.microsoft.com/azure/storage/common/storage-sas-overview
- id: 39
  domain: storage
  topic: storage-access
  type: single
  text: A storage account has its firewall set to 'Enabled from selected virtual networks and IP addresses'. A VM in subnet 'app' of the virtual network 'vnet1' (same region as the storage account) receives HTTP 403 errors when accessing blobs. You must allow only this subnet to reach the account over the Azure backbone with the least administrative effort and no new private IP resources. What should you do?
  options:
  - {id: A, text: "Add the private IP address of the VM to the storage account firewall IP rules", explanation: "The firewall IP rules do not accept private (RFC 1918) address ranges."}
  - {id: B, text: "Add the public IP address of the VM to the storage account firewall IP rules", explanation: "Traffic from a VM in the same region reaches the storage account using its private IP, so a public IP rule does not match."}
  - {id: C, text: "Enable the Microsoft.Storage service endpoint on the 'app' subnet and add the subnet as a virtual network rule on the storage account", explanation: "Correct. A service endpoint plus a virtual network rule allows traffic from that subnet."}
  - {id: D, text: "Create a VNet peering between vnet1 and the storage account", explanation: "Storage accounts are not VNet resources and cannot be peered."}
  correct: [C]
  explanation: Use a service endpoint for Microsoft.Storage on the subnet and add a virtual network rule on the storage firewall.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-network-security
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-service-endpoints-overview
- id: 40
  domain: storage
  topic: storage-access
  type: single
  text: Your security policy requires that all requests to a storage account are authorized with Microsoft Entra ID, and that requests signed with the account access keys are rejected. What should you configure?
  options:
  - {id: A, text: "Enable 'Secure transfer required'", explanation: "This enforces HTTPS only and does not affect the authorization method."}
  - {id: B, text: "Set the minimum TLS version to 1.2", explanation: "This controls the transport security protocol, not the authorization method."}
  - {id: C, text: "Rotate the access keys every 90 days", explanation: "Rotation keeps keys fresh but they remain valid for authorization."}
  - {id: D, text: "Disable 'Allow storage account key access' (shared key authorization)", explanation: "Correct. Requests signed with the account key, and account SAS tokens, are then denied."}
  correct: [D]
  explanation: Disabling shared key authorization (AllowSharedKeyAccess = false) forces clients to use Microsoft Entra authorization.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/storage/common/shared-key-authorization-prevent
- id: 41
  domain: storage
  topic: storage-access
  type: multiple
  text: |-
    You plan to enable identity-based authentication over SMB for an Azure file share so that domain users can mount it with their existing credentials. Which TWO identity sources can be used? Choose 2.
  options:
  - {id: A, text: "On-premises Active Directory Domain Services (AD DS)", explanation: "Correct. Azure Files supports on-premises AD DS authentication when the storage account is domain joined."}
  - {id: B, text: "Microsoft Entra Domain Services", explanation: "Correct. Azure Files supports Entra Domain Services for SMB identity-based authentication."}
  - {id: C, text: "Microsoft Entra External ID (B2C) tenant", explanation: "Customer identity tenants are not supported for SMB share access."}
  - {id: D, text: "Microsoft Entra application proxy", explanation: "Application proxy publishes web apps and is not an identity source for SMB."}
  correct: [A, B]
  explanation: Azure Files SMB identity-based authentication supports on-premises AD DS and Microsoft Entra Domain Services (as well as Entra Kerberos for hybrid identities).
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/storage/files/storage-files-active-directory-overview
- id: 42
  domain: storage
  topic: storage-access
  type: single
  text: Your company has an on-premises datacenter connected to Azure by ExpressRoute private peering. You must block all public network access to a storage account and let on-premises servers reach its blob endpoint using private IP addresses. What should you implement?
  options:
  - {id: A, text: "A private endpoint for the blob subresource and a private DNS zone for privatelink.blob.core.windows.net", explanation: "Correct. A private endpoint gives the account a private IP reachable from on-premises, and DNS must resolve to it."}
  - {id: B, text: "A service endpoint for Microsoft.Storage on the VNet gateway subnet", explanation: "Service endpoints are not reachable from on-premises networks."}
  - {id: C, text: "A firewall IP rule containing the on-premises private address range", explanation: "Private address ranges cannot be added to storage firewall IP rules."}
  - {id: D, text: "A VNet peering to the storage account's resource group", explanation: "Peering connects VNets and cannot be created with a storage account."}
  correct: [A]
  explanation: A private endpoint exposes the storage account on a private IP in your VNet, which on-premises networks can reach over ExpressRoute or VPN, provided DNS resolves the account name to that IP.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-private-endpoints
- id: 43
  domain: storage
  topic: storage-access
  type: single
  text: A web app uses a system-assigned managed identity to read blobs from a storage account by using Microsoft Entra authorization. Following the principle of least privilege, which role should you assign to the identity at the storage account scope?
  options:
  - {id: A, text: "Reader", explanation: "Reader only allows viewing the resource's management plane, not reading blob data."}
  - {id: B, text: "Storage Blob Data Reader", explanation: "Correct. It grants read and list access to blob data only."}
  - {id: C, text: "Storage Account Contributor", explanation: "This manages the account and can list keys, which is far more than needed."}
  - {id: D, text: "Storage Blob Data Owner", explanation: "This grants full control of blob data including POSIX ACLs; too much privilege."}
  correct: [B]
  explanation: Data-plane roles such as Storage Blob Data Reader are required for data access with Entra ID; Reader and management roles do not grant data access by themselves.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/storage/blobs/assign-azure-role-data-access
- id: 44
  domain: storage
  topic: storage-access
  type: single
  text: |
    You run the following command:

    az storage container generate-sas \
      --account-name contosodata \
      --name reports \
      --permissions rl \
      --expiry 2026-12-31T00:00Z \
      --auth-mode login \
      --as-user

    What type of SAS token is generated?
  options:
  - {id: A, text: "A service SAS signed with the account key", explanation: "A service SAS is signed with the account key, but this command uses --auth-mode login and --as-user."}
  - {id: B, text: "An account SAS signed with the account key", explanation: "Account SAS tokens are signed with the account key and are not produced by this command."}
  - {id: C, text: "A user delegation SAS secured with Microsoft Entra credentials", explanation: "Correct. It is signed with a user delegation key obtained using the caller's Entra identity."}
  - {id: D, text: "An ad hoc SAS tied to a stored access policy", explanation: "No stored access policy is specified; user delegation SAS tokens cannot use stored access policies."}
  correct: [C]
  explanation: Using --as-user with --auth-mode login requests a user delegation key and creates a user delegation SAS, which is the recommended SAS type for Blob storage.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/blobs/storage-blob-user-delegation-sas-create-cli
- id: 45
  domain: storage
  topic: storage-access
  type: single
  text: A storage account firewall is set to deny traffic by default for all networks except one VNet. Azure Backup must still be able to access the account, and you do not want to allow all networks or maintain Azure IP ranges. What should you configure?
  options:
  - {id: A, text: "Add the published Azure datacenter IP ranges as firewall IP rules", explanation: "These ranges are large, change frequently, and would expose the account to all Azure tenants."}
  - {id: B, text: "Set the default network access action to Allow", explanation: "This opens the account to all networks."}
  - {id: C, text: "Create a VNet peering to the Recovery Services vault", explanation: "Storage accounts cannot be peered and vaults do not live in your VNet."}
  - {id: D, text: "Enable the exception 'Allow Azure services on the trusted services list to access this storage account'", explanation: "Correct. Trusted Microsoft services such as Azure Backup can bypass the firewall when this exception is enabled."}
  correct: [D]
  explanation: The trusted Microsoft services exception lets listed services access a firewall-protected account using their managed identity or resource instance rules, without opening it to all networks.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-network-security#trusted-microsoft-services
- id: 46
  domain: storage
  topic: storage-accounts
  type: single
  text: Your company policy requires that data stays within a single Azure region, but the data must remain available if one datacenter in that region fails. Which redundancy option should you choose?
  options:
  - {id: A, text: "Zone-redundant storage (ZRS)", explanation: "Correct. ZRS copies data synchronously across three availability zones in the primary region."}
  - {id: B, text: "Locally redundant storage (LRS)", explanation: "LRS keeps three copies in a single datacenter and does not survive a datacenter loss."}
  - {id: C, text: "Geo-redundant storage (GRS)", explanation: "GRS replicates to a secondary region, which violates the single-region requirement."}
  - {id: D, text: "Read-access geo-redundant storage (RA-GRS)", explanation: "RA-GRS also replicates to a secondary region."}
  correct: [A]
  explanation: ZRS replicates synchronously across availability zones within one region.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-redundancy
- id: 47
  domain: storage
  topic: storage-accounts
  type: single
  text: A mission-critical application must tolerate the loss of a datacenter in the primary region and also be able to read data from a secondary region during a regional outage. Which redundancy option provides this with the highest availability?
  options:
  - {id: A, text: "GZRS", explanation: "GZRS provides zone and geo redundancy, but the secondary region is not readable until failover."}
  - {id: B, text: "RA-GZRS", explanation: "Correct. It combines ZRS in the primary region with read access to the geo-secondary."}
  - {id: C, text: "RA-GRS", explanation: "RA-GRS offers read access to the secondary but uses LRS in the primary, so it is not zone redundant."}
  - {id: D, text: "ZRS", explanation: "ZRS has no secondary region."}
  correct: [B]
  explanation: Read-access geo-zone-redundant storage (RA-GZRS) replicates across zones in the primary region and asynchronously to a secondary region where data is readable.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-redundancy
- id: 48
  domain: storage
  topic: storage-accounts
  type: single
  text: A general-purpose v2 storage account is configured with GRS. The primary region suffers a prolonged outage and you initiate a customer-managed account failover. What is the redundancy configuration of the account after the failover completes?
  options:
  - {id: A, text: "GRS, with the former secondary region as the primary", explanation: "Geo-replication is not automatically re-established after failover."}
  - {id: B, text: "RA-GRS", explanation: "The account is not converted to read-access geo-redundancy."}
  - {id: C, text: "LRS in the new primary region", explanation: "Correct. After failover of a GRS account the data is LRS in the new primary region until you reconfigure geo-redundancy."}
  - {id: D, text: "ZRS in the new primary region", explanation: "A GRS account becomes LRS, not ZRS; only a GZRS account becomes ZRS."}
  correct: [C]
  explanation: After a customer-managed failover, a GRS or RA-GRS account becomes LRS in the new primary region; you must re-enable geo-redundancy to resume replication.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-disaster-recovery-guidance
  - https://learn.microsoft.com/azure/storage/common/storage-redundancy
- id: 49
  domain: storage
  topic: storage-accounts
  type: single
  text: You plan to configure object replication from a container in storageA (East US) to a container in storageB (West Europe). Which features must be enabled before you create the replication policy?
  options:
  - {id: A, text: "Blob soft delete on both accounts", explanation: "Soft delete is not a prerequisite for object replication."}
  - {id: B, text: "Blob versioning on the source account and change feed on the destination account", explanation: "The requirements are reversed and incomplete."}
  - {id: C, text: "Point-in-time restore on both accounts", explanation: "Point-in-time restore is not a prerequisite for replication."}
  - {id: D, text: "Blob versioning on both accounts and change feed on the source account", explanation: "Correct. Object replication requires versioning on source and destination and change feed on the source."}
  correct: [D]
  explanation: Object replication asynchronously copies block blobs between accounts and requires blob versioning on both accounts and change feed enabled on the source account.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/blobs/object-replication-overview
- id: 50
  domain: storage
  topic: storage-accounts
  type: multiple
  text: |-
    Which TWO statements about encryption at rest for Azure Storage are true? Choose 2.
  options:
  - {id: A, text: "Data is always encrypted with 256-bit AES by default, and this cannot be disabled", explanation: "Correct. Storage service encryption is always on."}
  - {id: B, text: "You can use customer-managed keys stored in Azure Key Vault or Key Vault Managed HSM", explanation: "Correct. Customer-managed keys are supported as an alternative to Microsoft-managed keys."}
  - {id: C, text: "Encryption can be disabled on an account to improve performance", explanation: "Storage encryption at rest cannot be disabled."}
  - {id: D, text: "Infrastructure encryption (double encryption) can be turned on for an existing account at any time", explanation: "Infrastructure encryption must be enabled when the account is created."}
  correct: [A, B]
  explanation: Azure Storage encrypts all data at rest automatically with AES-256; you may choose customer-managed keys in Key Vault. Infrastructure encryption can only be chosen at account creation.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-service-encryption
  - https://learn.microsoft.com/azure/storage/common/customer-managed-keys-overview
- id: 51
  domain: storage
  topic: storage-accounts
  type: single
  text: You must keep a container in sync with a local folder. Only new or changed files should be uploaded, and blobs that no longer exist in the local folder must be deleted from the container. Which AzCopy command should you use?
  options:
  - {id: A, text: "azcopy sync 'C:/data' 'https://contoso.blob.core.windows.net/backup?<SAS>' --delete-destination=true", explanation: "Correct. azcopy sync compares source and destination and can delete extra destination files."}
  - {id: B, text: "azcopy copy 'C:/data' 'https://contoso.blob.core.windows.net/backup?<SAS>' --recursive --overwrite=ifSourceNewer", explanation: "This copies files but never deletes destination blobs."}
  - {id: C, text: "azcopy copy 'C:/data' 'https://contoso.blob.core.windows.net/backup?<SAS>' --recursive", explanation: "This copies everything and does not delete extraneous blobs."}
  - {id: D, text: "azcopy remove 'https://contoso.blob.core.windows.net/backup?<SAS>' --recursive", explanation: "This deletes all blobs in the container without uploading anything."}
  correct: [A]
  explanation: azcopy sync updates the destination to match the source and, with --delete-destination=true, removes destination items not present in the source.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/common/storage-use-azcopy-blobs-synchronize
- id: 52
  domain: storage
  topic: storage-accounts
  type: single
  text: A junior administrator needs a free graphical tool that runs on Windows, macOS, and Linux to browse and manage blobs, file shares, queues, and tables across several storage accounts. Which tool should be used?
  options:
  - {id: A, text: "Azure Data Box", explanation: "Data Box is a physical appliance for offline data transfer."}
  - {id: B, text: "Azure Storage Explorer", explanation: "Correct. It is a free cross-platform GUI for managing Azure Storage data."}
  - {id: C, text: "Azure Site Recovery", explanation: "Site Recovery handles disaster recovery replication of VMs."}
  - {id: D, text: "Azure Migrate", explanation: "Azure Migrate assesses and migrates servers and workloads."}
  correct: [B]
  explanation: Azure Storage Explorer is a standalone cross-platform app for managing storage data using Entra ID, keys, or SAS.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/storage/storage-explorer/vs-azure-tools-storage-manage-with-storage-explorer
- id: 53
  domain: storage
  topic: storage-accounts
  type: single
  text: You must host an NFS 4.1 file share for Linux VMs that requires low latency and high IOPS. Which storage account type should you create?
  options:
  - {id: A, text: "Standard general-purpose v2", explanation: "NFS Azure file shares are only supported on premium (SSD) file shares."}
  - {id: B, text: "Premium block blobs", explanation: "BlockBlobStorage accounts store blobs and cannot host file shares."}
  - {id: C, text: "Premium FileStorage", explanation: "Correct. FileStorage accounts provide SSD-based file shares supporting NFS and SMB."}
  - {id: D, text: "Standard BlobStorage (legacy)", explanation: "Legacy blob-only accounts cannot host file shares."}
  correct: [C]
  explanation: NFS file shares require a premium FileStorage account, which uses SSD media.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/storage/files/storage-files-planning
  - https://learn.microsoft.com/azure/storage/files/files-nfs-protocol
- id: 54
  domain: storage
  topic: storage-accounts
  type: single
  text: An existing general-purpose v2 account holds millions of block blobs. Analytics teams now need directories with POSIX-style ACLs (Azure Data Lake Storage Gen2) without recreating the account and re-copying the data. What should you do?
  options:
  - {id: A, text: "Change the redundancy to ZRS", explanation: "Redundancy does not provide a hierarchical namespace."}
  - {id: B, text: "Enable blob versioning", explanation: "Versioning keeps previous blob versions and does not add directories or ACLs."}
  - {id: C, text: "Convert the account to a Premium BlockBlobStorage account", explanation: "Account type cannot be converted in this manner and premium does not add a hierarchical namespace by itself."}
  - {id: D, text: "Validate and perform the upgrade to Azure Data Lake Storage Gen2 on the existing account", explanation: "Correct. The upgrade enables the hierarchical namespace on an existing account."}
  correct: [D]
  explanation: A GPv2 account can be upgraded in place to enable the hierarchical namespace, which is required for Data Lake Storage Gen2 directories and ACLs.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/storage/blobs/upgrade-to-data-lake-storage-gen2-how-to
- id: 55
  domain: storage
  topic: files-and-blobs
  type: single
  text: A law firm must retain scanned documents for 10 years at the lowest possible storage cost. The documents are almost never accessed, and waiting several hours to retrieve them is acceptable. Which access tier should you use?
  options:
  - {id: A, text: Archive, explanation: "Correct. Archive is the lowest-cost tier, offline, with rehydration taking hours."}
  - {id: B, text: Hot, explanation: "Hot has the highest storage cost."}
  - {id: C, text: Cool, explanation: "Cool is cheaper than Hot but more expensive than Archive and meant for data kept online."}
  - {id: D, text: Cold, explanation: "Cold is an online tier with higher storage cost than Archive."}
  correct: [A]
  explanation: The Archive tier offers the lowest storage cost for rarely accessed data that can tolerate hours of retrieval latency.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/blobs/access-tiers-overview
- id: 56
  domain: storage
  topic: files-and-blobs
  type: single
  text: |
    A storage account has the following lifecycle management policy:

    {
      "rules": [
        {
          "name": "logrule",
          "enabled": true,
          "type": "Lifecycle",
          "definition": {
            "filters": { "blobTypes": ["blockBlob"], "prefixMatch": ["logs/"] },
            "actions": {
              "baseBlob": {
                "tierToCool": { "daysAfterModificationGreaterThan": 30 },
                "tierToArchive": { "daysAfterModificationGreaterThan": 90 },
                "delete": { "daysAfterModificationGreaterThan": 365 }
              }
            }
          }
        }
      ]
    }

    The block blob 'logs/app.log' was last modified 120 days ago and has not been touched since. In which state will the blob be?
  options:
  - {id: A, text: "Hot tier", explanation: "The 30-day and 90-day thresholds have both passed."}
  - {id: B, text: "Archive tier", explanation: "Correct. The 90-day threshold has passed, but the 365-day deletion threshold has not."}
  - {id: C, text: "Cool tier", explanation: "The blob would have been moved to Cool at 30 days and then to Archive at 90 days."}
  - {id: D, text: "Deleted", explanation: "Deletion happens only after 365 days."}
  correct: [B]
  explanation: Lifecycle actions are evaluated by days since modification; at 120 days the blob has moved to Archive and will be deleted after 365 days.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/blobs/lifecycle-management-overview
- id: 57
  domain: storage
  topic: files-and-blobs
  type: single
  text: Blob soft delete is enabled on a storage account with a 14-day retention period. An administrator accidentally deletes an entire container and all of its blobs. You cannot restore the container. What should have been enabled to make this recoverable?
  options:
  - {id: A, text: "Blob versioning", explanation: "Versioning protects against overwrites and blob deletes, not container deletion."}
  - {id: B, text: "Blob snapshots on every blob", explanation: "Snapshots are deleted together with the container."}
  - {id: C, text: "Container soft delete", explanation: "Correct. It retains deleted containers, and the blobs in them, for the retention period."}
  - {id: D, text: "Hierarchical namespace", explanation: "This provides directories and does not protect against deletion."}
  correct: [C]
  explanation: Blob soft delete does not protect against container deletion; container soft delete must be enabled separately.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/blobs/soft-delete-container-overview
  - https://learn.microsoft.com/azure/storage/blobs/soft-delete-blob-overview
- id: 58
  domain: storage
  topic: files-and-blobs
  type: single
  text: Blob versioning is enabled on a storage account. An application overwrites the existing blob 'report.docx' with new content. What is the result?
  options:
  - {id: A, text: "The previous content is lost unless a snapshot was taken manually", explanation: "With versioning enabled, a previous version is created automatically."}
  - {id: B, text: "The previous content is moved to the Archive tier", explanation: "Versions remain in their current tier unless a lifecycle policy moves them."}
  - {id: C, text: "The write fails because the blob is immutable", explanation: "Versioning does not make blobs immutable."}
  - {id: D, text: "The previous content is kept automatically as a previous version identified by a version ID", explanation: "Correct. Each write or delete creates a previous version, and the new content becomes the current version."}
  correct: [D]
  explanation: When versioning is enabled, Azure Storage automatically preserves the prior state of a blob as a version on each overwrite.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/blobs/versioning-overview
- id: 59
  domain: storage
  topic: files-and-blobs
  type: multiple
  text: |-
    Users sometimes delete whole Azure file shares or overwrite individual files in a share. You need to be able to recover deleted shares and restore earlier versions of individual files. Which TWO actions should you take? Choose 2.
  options:
  - {id: A, text: "Enable soft delete for file shares", explanation: "Correct. It retains deleted shares for the retention period so they can be undeleted."}
  - {id: B, text: "Create share snapshots, for example by using Azure Backup", explanation: "Correct. Share snapshots are read-only point-in-time copies from which individual files can be restored."}
  - {id: C, text: "Enable blob versioning on the storage account", explanation: "Blob versioning applies to blobs, not file shares."}
  - {id: D, text: "Configure object replication to a second account", explanation: "Object replication applies to block blobs and does not protect file shares."}
  correct: [A, B]
  explanation: Soft delete for file shares protects against share deletion, and share snapshots enable restoring earlier versions of files.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/storage/files/storage-files-prevent-file-share-deletion
  - https://learn.microsoft.com/azure/storage/files/storage-snapshots-files
- id: 60
  domain: storage
  topic: files-and-blobs
  type: single
  text: A department needs an SMB file share for rarely accessed archived documents. The share must remain online for occasional access, and you want the lowest storage cost with no performance requirement. Which option should you choose?
  options:
  - {id: A, text: "A standard file share in a general-purpose v2 account using the Cool access tier", explanation: "Correct. Cool has the lowest storage cost among online standard file share tiers, with higher transaction costs."}
  - {id: B, text: "A premium file share in a FileStorage account", explanation: "Premium is SSD based and the most expensive option."}
  - {id: C, text: "A standard file share using the Transaction optimized tier", explanation: "This tier is for transaction-heavy workloads and has higher storage cost."}
  - {id: D, text: "A standard file share using the Archive tier", explanation: "Azure file shares do not have an Archive tier."}
  correct: [A]
  explanation: Standard Azure file shares offer Transaction optimized, Hot, and Cool tiers; Cool suits infrequently accessed data that must remain online.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/storage/files/storage-files-planning
- id: 61
  domain: storage
  topic: files-and-blobs
  type: single
  text: |
    Anonymous access is allowed at the storage account level. You run:

    az storage container set-permission --account-name contosopics --name pics --public-access blob --auth-mode login

    What does this configuration allow?
  options:
  - {id: A, text: "Anonymous users can list all blobs in the container and read them", explanation: "Listing blobs anonymously requires the 'container' public access level."}
  - {id: B, text: "Anonymous users can read an individual blob if they know its URL, but cannot list the blobs in the container", explanation: "Correct. The 'blob' level grants anonymous read access to blobs only."}
  - {id: C, text: "Anonymous users can read and upload blobs", explanation: "Public access never allows anonymous writes."}
  - {id: D, text: "Only requests with a valid SAS token can read blobs", explanation: "Anonymous requests do not need a SAS under this setting."}
  correct: [B]
  explanation: The 'blob' public access level allows anonymous read of blob data only, while 'container' also allows listing.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/blobs/anonymous-read-access-configure
- id: 62
  domain: storage
  topic: files-and-blobs
  type: single
  text: Regulations require financial records stored in a blob container to be non-erasable and non-modifiable for 7 years. Even storage account owners must not be able to shorten the retention period. What should you configure?
  options:
  - {id: A, text: "A legal hold on the container", explanation: "A legal hold has no defined duration and can be cleared by authorized users."}
  - {id: B, text: "A CanNotDelete resource lock on the storage account", explanation: "Resource locks do not protect blob data from being modified or deleted by data-plane operations."}
  - {id: C, text: "A time-based retention policy of 7 years on the container, then lock the policy", explanation: "Correct. A locked time-based retention policy provides WORM storage and cannot be shortened."}
  - {id: D, text: "A stored access policy with a 7-year expiry", explanation: "Stored access policies govern SAS tokens and do not make blobs immutable."}
  correct: [C]
  explanation: Immutable storage with a locked time-based retention policy keeps blobs in a WORM state; a locked policy can only be extended, not shortened or deleted.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/storage/blobs/immutable-storage-overview
  - https://learn.microsoft.com/azure/storage/blobs/immutable-time-based-retention-policy-overview
- id: 63
  domain: storage
  topic: files-and-blobs
  type: single
  text: You must automatically move block blobs to the Cool tier when they have not been read or written for 30 days, regardless of when they were last modified. What should you do?
  options:
  - {id: A, text: "Create a rule using daysAfterModificationGreaterThan set to 30", explanation: "This is based on modification time only, and reads would not be considered."}
  - {id: B, text: "Enable blob versioning and move previous versions to Cool", explanation: "This affects previous versions, not access-based tiering of current blobs."}
  - {id: C, text: "Add blob index tags to every blob", explanation: "Index tags support filtering but do not track access."}
  - {id: D, text: "Enable last access time tracking and create a rule using daysAfterLastAccessTimeGreaterThan set to 30", explanation: "Correct. Access-time-based rules need last access time tracking enabled."}
  correct: [D]
  explanation: Lifecycle rules can act on last access time when last access time tracking is enabled on the account.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/storage/blobs/lifecycle-management-overview
- id: 64
  domain: storage
  topic: files-and-blobs
  type: single
  text: |
    You try to delete a blob that has snapshots by running:

    az storage blob delete --account-name contosodata --container-name docs --name plan.docx --auth-mode login

    The command fails with an error saying the blob has snapshots. Which additional parameter allows the blob and its snapshots to be deleted?
  options:
  - {id: A, text: "--delete-snapshots include", explanation: "Correct. It deletes the base blob along with all of its snapshots."}
  - {id: B, text: "--force", explanation: "There is no such option to bypass the snapshot restriction."}
  - {id: C, text: "--overwrite true", explanation: "This applies to uploads, not deletes."}
  - {id: D, text: "--tier Archive", explanation: "This changes the blob's access tier and does not delete anything."}
  correct: [A]
  explanation: A blob that has snapshots cannot be deleted unless you specify --delete-snapshots include (or only to delete just the snapshots).
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/storage/blobs/snapshots-overview
  - https://learn.microsoft.com/cli/azure/storage/blob#az-storage-blob-delete
- id: 65
  domain: compute
  topic: arm-bicep
  type: single
  text: |-
    A resource group named rg-app contains a virtual machine, its NIC and disk, and a storage account. You run the following command with a template that defines only the storage account:

    az deployment group create --resource-group rg-app --template-file main.json --mode Complete

    What is the result?
  options:
  - id: A
    text: Only the storage account is updated; all other resources are left unchanged.
    explanation: That is the behavior of Incremental mode, which is the default, not Complete mode.
  - id: B
    text: The storage account is deployed and the VM, NIC and disk are deleted from the resource group.
    explanation: In Complete mode, Resource Manager deletes resources in the resource group that are not defined in the template.
  - id: C
    text: The deployment fails because Complete mode requires every existing resource to be in the template.
    explanation: The deployment does not fail for this reason; unlisted resources are simply deleted.
  - id: D
    text: The VM is stopped and deallocated but its disk and NIC are retained.
    explanation: Complete mode deletes the resources; it does not deallocate them.
  correct: [B]
  explanation: Complete mode removes resources that exist in the target resource group but are not in the template. Use Incremental mode (the default) or run what-if first to avoid unintended deletions.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/templates/deployment-modes
- id: 66
  domain: compute
  topic: arm-bicep
  type: single
  text: Before deploying a Bicep file to production, you must preview which resources will be created, modified or deleted without making any changes. Which command should you run?
  options:
  - id: A
    text: az bicep build --file main.bicep
    explanation: This only compiles Bicep to an ARM template and does not evaluate changes against Azure.
  - id: B
    text: az deployment group validate --resource-group rg-prod --template-file main.bicep
    explanation: Validate checks template syntax and preflight rules but does not show a per-resource change preview.
  - id: C
    text: az deployment group what-if --resource-group rg-prod --template-file main.bicep
    explanation: What-if returns the predicted changes (create, modify, delete, no change) without deploying.
  - id: D
    text: az group export --name rg-prod
    explanation: Exporting generates a template from existing resources and does not preview a deployment.
  correct: [C]
  explanation: The what-if operation compares the template with the current state of the resource group and reports the changes that would be made, without deploying anything.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-what-if
- id: 67
  domain: compute
  topic: arm-bicep
  type: single
  text: |-
    Your team uses the following Bicep file. You must ensure that deployers can only specify Standard_LRS or Standard_GRS for the SKU.

    param storageSku string = 'Standard_LRS'
    param location string = resourceGroup().location

    resource st 'Microsoft.Storage/storageAccounts@2023-05-01' = {
      name: 'st${uniqueString(resourceGroup().id)}'
      location: location
      sku: { name: storageSku }
      kind: 'StorageV2'
    }

    What should you change?
  options:
  - id: A
    text: Add the @secure() decorator above the storageSku parameter.
    explanation: '@secure() hides parameter values in logs and does not limit allowed values.'
  - id: B
    text: Change the type of storageSku to object and validate it in the resource block.
    explanation: Bicep has no resource-block validation for this; an object type does not restrict values.
  - id: C
    text: Add @minLength(12) above the storageSku parameter.
    explanation: Length constraints do not restrict a value to a set of options.
  - id: D
    text: Add @allowed(['Standard_LRS', 'Standard_GRS']) above the storageSku parameter.
    explanation: The @allowed decorator restricts a parameter to a fixed list of values, and Resource Manager rejects any other value.
  correct: [D]
  explanation: The @allowed decorator limits the values accepted for a parameter. In ARM JSON the equivalent is the allowedValues property.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/bicep/parameters
- id: 68
  domain: compute
  topic: arm-bicep
  type: multiple
  text: |-
    You have a Bicep file named main.bicep and an existing resource group named rg1. Which two commands deploy the Bicep file to rg1? Choose 2.
  options:
  - id: A
    text: az bicep build --file main.bicep
    explanation: This compiles the file to JSON; it does not deploy anything.
  - id: B
    text: New-AzResourceGroupDeployment -ResourceGroupName rg1 -TemplateFile main.bicep
    explanation: Azure PowerShell can deploy a Bicep file directly when the Bicep CLI is installed.
  - id: C
    text: az group export --name rg1
    explanation: This exports a template from existing resources; it is not a deployment.
  - id: D
    text: az deployment group create --resource-group rg1 --template-file main.bicep
    explanation: Azure CLI deploys Bicep files directly to a resource group.
  correct: [B, D]
  explanation: Both Azure CLI (az deployment group create) and Azure PowerShell (New-AzResourceGroupDeployment) accept .bicep files as the template. Build only transpiles; export extracts a template.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-cli
  - https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-powershell
- id: 69
  domain: compute
  topic: arm-bicep
  type: single
  text: |-
    You deploy the following ARM template resource section to a resource group:

    "resources": [
      {
        "type": "Microsoft.Storage/storageAccounts",
        "apiVersion": "2023-05-01",
        "name": "[concat('stdata', copyIndex(1))]",
        "location": "[resourceGroup().location]",
        "sku": { "name": "Standard_LRS" },
        "kind": "StorageV2",
        "copy": { "name": "storagecopy", "count": 3 }
      }
    ]

    Which storage accounts are created?
  options:
  - id: A
    text: stdata1, stdata2 and stdata3
    explanation: copyIndex(1) offsets the zero-based index by 1, so the names run from 1 to 3.
  - id: B
    text: stdata0, stdata1 and stdata2
    explanation: This would be the result of copyIndex() without an offset.
  - id: C
    text: stdata1, stdata2, stdata3 and stdata4
    explanation: The loop count is 3, so only three accounts are created.
  - id: D
    text: A single account named stdata1
    explanation: The copy element creates multiple instances, one per iteration.
  correct: [A]
  explanation: The copy loop runs 3 times. copyIndex() starts at 0, and copyIndex(1) adds an offset of 1, giving stdata1 to stdata3.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/templates/copy-resources
- id: 70
  domain: compute
  topic: arm-bicep
  type: single
  text: |-
    You review this Bicep file:

    resource vnet 'Microsoft.Network/virtualNetworks@2024-01-01' = {
      name: 'vnet1'
      location: resourceGroup().location
      properties: {
        addressSpace: { addressPrefixes: [ '10.0.0.0/16' ] }
        subnets: [ { name: 'default', properties: { addressPrefix: '10.0.0.0/24' } } ]
      }
    }

    resource nic 'Microsoft.Network/networkInterfaces@2024-01-01' = {
      name: 'nic1'
      location: resourceGroup().location
      properties: {
        ipConfigurations: [ {
          name: 'ipconfig1'
          properties: { subnet: { id: vnet.properties.subnets[0].id } }
        } ]
      }
    }

    How does Resource Manager order the deployment of these two resources?
  options:
  - id: A
    text: Both are deployed in parallel, so you must add dependsOn to nic.
    explanation: A dependsOn is not needed because Bicep creates the dependency itself.
  - id: B
    text: The nic is deployed first because it is defined second in the file.
    explanation: File order does not determine deployment order.
  - id: C
    text: The vnet is deployed first because nic references vnet.properties, creating an implicit dependency.
    explanation: Referencing a symbolic name's property makes Bicep emit a dependency in the compiled template.
  - id: D
    text: The deployment fails because subnets cannot be referenced from another resource.
    explanation: Referencing a subnet id from the declared vnet is valid.
  correct: [C]
  explanation: Bicep infers dependencies from symbolic name references, so the compiled ARM template contains the dependsOn automatically. Explicit dependsOn is only needed when no reference exists.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/bicep/resource-dependencies
- id: 71
  domain: compute
  topic: arm-bicep
  type: single
  text: |-
    You must write a Bicep file that creates a new resource group named rg-new and then deploys a storage account into it as a module. You deploy the file with az deployment sub create. Which line must appear at the top of the main Bicep file?
  options:
  - id: A
    text: targetScope = 'resourceGroup'
    explanation: Resource group scope cannot create a resource group.
  - id: B
    text: targetScope = 'managementGroup'
    explanation: Management group scope is used for management group deployments.
  - id: C
    text: targetScope = 'tenant'
    explanation: Tenant scope is for tenant-level resources and not required for a resource group.
  - id: D
    text: targetScope = 'subscription'
    explanation: Resource groups are created at subscription scope, and a module can then target the new group with scope.
  correct: [D]
  explanation: Resource groups are subscription-level resources, so the file must set targetScope to subscription. A module then uses scope to deploy into the new group.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/bicep/deploy-to-subscription
- id: 72
  domain: compute
  topic: arm-bicep
  type: single
  text: Several teams must deploy a standard, versioned ARM template stored in Azure. Access to the template must be controlled with Azure RBAC and users must be able to deploy it without having access to the original file source. What should you create?
  options:
  - id: A
    text: A blueprint definition
    explanation: Blueprints are retired and are not the mechanism for sharing templates with RBAC.
  - id: B
    text: A template spec
    explanation: Template specs are Azure resources that store versioned ARM or Bicep templates and support RBAC.
  - id: C
    text: A storage account with a public blob container
    explanation: A public container gives no RBAC control over the template.
  - id: D
    text: An Azure Policy initiative
    explanation: Policies enforce compliance and do not store deployable templates.
  correct: [B]
  explanation: A template spec stores a template as an Azure resource with versions. You assign RBAC on the spec and users deploy it without needing access to a storage location.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-resource-manager/templates/template-specs
- id: 73
  domain: compute
  topic: virtual-machines
  type: single
  text: A security policy requires that temporary disks and disk caches of Azure VMs are encrypted at rest, together with the data flowing to Azure Storage. You want the encryption to occur on the VM host and require no in-guest agent. What should you configure?
  options:
  - id: A
    text: Azure Disk Encryption with BitLocker
    explanation: ADE works in the guest OS with an extension and does not encrypt data at the host level.
  - id: B
    text: Storage Service Encryption with Microsoft-managed keys only
    explanation: SSE encrypts managed disks at rest but does not cover temp disks or caches on the host.
  - id: C
    text: Always Encrypted on the SQL databases
    explanation: This is a database column-level feature unrelated to VM disks.
  - id: D
    text: Encryption at host
    explanation: Encryption at host encrypts temp disks, caches and data flows to storage from the VM host, without an agent.
  correct: [D]
  explanation: Encryption at host provides end-to-end encryption starting at the VM host, covering temporary disks and OS/data disk caches. The EncryptionAtHost feature must be registered for the subscription.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-machines/disk-encryption
  - https://learn.microsoft.com/azure/virtual-machines/disks-enable-host-based-encryption-portal
- id: 74
  domain: compute
  topic: virtual-machines
  type: single
  text: You need to move a VM, with its disks and network interface, from the West Europe region to North Europe by using a guided experience that validates dependencies and prepares the move. Which service should you use?
  options:
  - id: A
    text: Azure Resource Mover
    explanation: Resource Mover orchestrates cross-region moves, resolves dependencies and validates before moving.
  - id: B
    text: The Move option in the resource group blade
    explanation: This moves resources between resource groups or subscriptions in the same region, not between regions.
  - id: C
    text: Azure Migrate server migration
    explanation: Azure Migrate is for moving on-premises or other cloud servers to Azure.
  - id: D
    text: Azure Backup cross-subscription restore
    explanation: This is a data restore function and not a move orchestration service.
  correct: [A]
  explanation: Azure Resource Mover moves resources, including VMs, across regions. The portal Move option changes only the resource group or subscription.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/resource-mover/overview
- id: 75
  domain: compute
  topic: virtual-machines
  type: single
  text: |-
    You try to resize a running VM from Standard_D4s_v5 to Standard_E16s_v5 and the portal reports that the size is not available on the current hardware cluster. The VM is not in an availability set. What should you do?
  options:
  - id: A
    text: Detach the OS disk and attach it to a new VM of the same size.
    explanation: This does not change anything about size availability.
  - id: B
    text: Stop (deallocate) the VM and then resize it.
    explanation: Deallocating releases the hardware allocation, so the VM can be allocated on a cluster that supports the new size.
  - id: C
    text: Change the VM region to one that supports the size.
    explanation: Not needed; the size is available in the region, only not on the current cluster.
  - id: D
    text: Resize the VM through the serial console.
    explanation: The serial console does not change VM size.
  correct: [B]
  explanation: When a size is unavailable on the current cluster, deallocating the VM lets Azure re-allocate it on any cluster in the region that supports the target size.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-machines/resize-vm
- id: 76
  domain: compute
  topic: virtual-machines
  type: single
  text: |-
    An IO-intensive database VM in a zonal deployment requires a data disk with 40,000 IOPS and 800 MB/s throughput, where IOPS and throughput can be adjusted independently of disk capacity. The disk must not be a Premium SSD (v1) because capacity-based sizes are too costly. Which disk type should you use?
  options:
  - id: A
    text: Standard HDD
    explanation: Standard HDD offers low performance and cannot meet these requirements.
  - id: B
    text: Premium SSD v2
    explanation: Premium SSD v2 lets you provision capacity, IOPS and throughput separately, with performance up to the limits.
  - id: C
    text: Standard SSD
    explanation: Standard SSD does not reach this IOPS level and performance is not configurable.
  - id: D
    text: Premium SSD P10
    explanation: P10 is capacity-bound, with performance tied to its size and far below 40,000 IOPS.
  correct: [B]
  explanation: Premium SSD v2 (like Ultra Disk) allows independent configuration of capacity, IOPS and throughput. It is a data-disk-only type and is deployed in an availability zone.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/virtual-machines/disks-types
- id: 77
  domain: compute
  topic: virtual-machines
  type: single
  text: A business-critical web tier must be hosted on VMs with the highest available SLA for virtual machines and resilience against a datacenter failure within a region. Which design meets the requirement?
  options:
  - id: A
    text: Two VMs in the same availability set
    explanation: Availability sets protect against rack and maintenance failure but offer a lower SLA than zones.
  - id: B
    text: One VM with Premium SSD disks
    explanation: A single VM with premium storage has a lower SLA and no datacenter-level redundancy.
  - id: C
    text: Two or more VMs deployed across different availability zones
    explanation: Zone placement gives physical datacenter separation and the 99.99% SLA.
  - id: D
    text: Two VMs in the same zone in different VNets
    explanation: Different VNets do not provide fault isolation, and a single zone is a single failure domain.
  correct: [C]
  explanation: Deploying two or more VMs across availability zones provides a 99.99% VM SLA and protects against the loss of an entire datacenter.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/virtual-machines/availability
- id: 78
  domain: compute
  topic: virtual-machines
  type: single
  text: An availability set has 3 fault domains and 5 update domains and contains 6 VMs. During planned maintenance, what is the maximum number of VMs that can be rebooted at the same time?
  options:
  - id: A
    text: "1"
    explanation: Not correct; the sixth VM shares an update domain with the first.
  - id: B
    text: "2"
    explanation: VMs are spread across 5 update domains, so one domain holds 2 VMs, and one update domain is rebooted at a time.
  - id: C
    text: "3"
    explanation: Fault domains affect hardware failures, not the planned maintenance reboot order.
  - id: D
    text: "6"
    explanation: Azure never reboots all update domains at the same time.
  correct: [B]
  explanation: Planned maintenance walks through update domains one at a time. With 6 VMs spread over 5 update domains, one domain has 2 VMs, so at most 2 reboot together.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/virtual-machines/availability-set-overview
- id: 79
  domain: compute
  topic: virtual-machines
  type: single
  text: A VM scale set handles an application whose load is known to peak every weekday from 08:00 to 18:00. You want instances to be ready before the peak begins, in addition to reacting to CPU usage. What should you configure?
  options:
  - id: A
    text: A scheduled autoscale profile with a higher minimum instance count for the weekday hours
    explanation: Scheduled profiles raise capacity at fixed times, and metric rules can still apply inside the profile.
  - id: B
    text: A lower cooldown period on the scale-in rule
    explanation: Cooldown does not provide capacity ahead of time.
  - id: C
    text: Manual upgrade policy
    explanation: Upgrade policy controls how model updates reach instances, not capacity.
  - id: D
    text: A proximity placement group
    explanation: Proximity placement groups control network latency, not scaling.
  correct: [A]
  explanation: Autoscale supports multiple profiles, including recurring schedules. A weekday profile with a higher minimum guarantees capacity before the peak while CPU rules continue to scale.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-monitor/autoscale/autoscale-overview
- id: 80
  domain: compute
  topic: virtual-machines
  type: single
  text: You update the image version in the model of a VM scale set that uses the Manual upgrade policy. Newly added instances run the new image, but existing instances still run the old one. What should you do to update the existing instances?
  options:
  - id: A
    text: Delete the scale set model and recreate it.
    explanation: That is unnecessary and disruptive.
  - id: B
    text: Increase the instance limit of the autoscale profile.
    explanation: Scaling out only adds new instances and does not update existing ones.
  - id: C
    text: Manually upgrade the instances, for example with az vmss update-instances.
    explanation: With Manual policy, existing instances change only when you apply the latest model to them.
  - id: D
    text: Wait until the next maintenance window.
    explanation: Azure platform maintenance does not apply your model changes.
  correct: [C]
  explanation: Under the Manual upgrade policy you decide when each instance receives the latest model. Automatic or Rolling policies would apply it for you.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-upgrade-policy
- id: 81
  domain: compute
  topic: virtual-machines
  type: multiple
  text: |-
    You plan to enable Azure Disk Encryption on a Windows VM. Which two requirements must be met for the Azure Key Vault? Choose 2.
  options:
  - id: A
    text: The key vault must be in the same region and subscription as the VM.
    explanation: ADE requires colocation of the key vault and the VM.
  - id: B
    text: The key vault must be in a different region than the VM for resilience.
    explanation: Cross-region key vaults are not supported for ADE.
  - id: C
    text: The key vault must be enabled for disk encryption.
    explanation: The key vault's advanced access policy for disk encryption must be enabled so that ADE can retrieve secrets and wrap keys.
  - id: D
    text: The key vault must be deployed in the same virtual network as the VM.
    explanation: Key vaults are not deployed into VNets, and this is not a requirement.
  correct: [A, C]
  explanation: ADE needs a key vault in the same region and subscription as the VM, with the disk encryption access enabled.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-machines/windows/disk-encryption-key-vault
- id: 82
  domain: compute
  topic: virtual-machines
  type: single
  text: You cannot connect by RDP to an Azure VM. NSG rules, the guest firewall and credentials have been verified, and Resource Health suggests a problem with the host. Which action is most likely to restore connectivity?
  options:
  - id: A
    text: Resize the VM's OS disk.
    explanation: Disk size is unrelated to a host problem.
  - id: B
    text: Delete the NIC and recreate it.
    explanation: This is not needed if networking configuration is verified, and does not change the host.
  - id: C
    text: Reapply the VM tags.
    explanation: Tags have no operational effect.
  - id: D
    text: Redeploy the VM.
    explanation: Redeploy moves the VM to a new node in the Azure infrastructure and powers it back on, keeping its configuration.
  correct: [D]
  explanation: When host-level issues are suspected, redeploying the VM places it on a different host while keeping the configuration. Data on the temporary disk is lost.
  difficulty: medium
  references:
  - https://learn.microsoft.com/troubleshoot/azure/virtual-machines/windows/redeploy-to-new-node-windows
- id: 83
  domain: compute
  topic: virtual-machines
  type: single
  text: A nightly rendering job can be interrupted and resumed. You want the lowest compute cost and want the VM's disks preserved if Azure needs the capacity back. What should you deploy?
  options:
  - id: A
    text: A Reserved VM Instance for a 3-year term
    explanation: Reservations reduce cost but commit you to uptime and are not for interruptible jobs.
  - id: B
    text: A B-series burstable VM
    explanation: Burstable VMs reduce cost for low baseline usage but are not the deepest discount.
  - id: C
    text: An Azure Spot VM with the Stop/Deallocate eviction policy
    explanation: Spot VMs use spare capacity at deep discounts, and deallocate preserves disks when evicted.
  - id: D
    text: An Azure Spot VM with the Delete eviction policy
    explanation: Delete removes the VM and its disks on eviction.
  correct: [C]
  explanation: Spot VMs are for interruptible workloads. The Stop/Deallocate eviction policy keeps the disks, while Delete removes the VM and disks.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-machines/spot-vms
- id: 84
  domain: compute
  topic: containers
  type: single
  text: Your company requires a container registry with geo-replication so that images are pulled from the nearest region by AKS clusters in West US and West Europe. Which Azure Container Registry service tier is required?
  options:
  - id: A
    text: Premium
    explanation: Geo-replication is a Premium-only feature.
  - id: B
    text: Basic
    explanation: Basic has no geo-replication.
  - id: C
    text: Standard
    explanation: Standard lacks geo-replication, zone redundancy and private link.
  - id: D
    text: Any tier, after enabling the replication feature in the registry settings
    explanation: Geo-replication cannot be enabled on lower tiers.
  correct: [A]
  explanation: Geo-replication, private endpoints and customer-managed keys require the Premium tier of Azure Container Registry.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/container-registry/container-registry-skus
  - https://learn.microsoft.com/azure/container-registry/container-registry-geo-replication
- id: 85
  domain: compute
  topic: containers
  type: single
  text: You run a one-time data processing container in Azure Container Instances. It must be retried if it exits with a non-zero code, but must not be restarted after it completes successfully. Which restart policy should you set?
  options:
  - id: A
    text: Always
    explanation: Always restarts the container even after it succeeds.
  - id: B
    text: OnFailure
    explanation: The container is restarted only if it exits with a failure.
  - id: C
    text: Never
    explanation: Never does not retry on failure.
  - id: D
    text: Manual
    explanation: Manual is not a valid ACI restart policy.
  correct: [B]
  explanation: ACI supports Always, OnFailure and Never. OnFailure retries failed runs and stops after success.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/container-instances/container-instances-restart-policy
- id: 86
  domain: compute
  topic: containers
  type: single
  text: |-
    You host an HTTP API in Azure Container Apps. You want to incur no compute charges for active usage when there are no requests, and to scale out up to 10 replicas under load. What should you configure?
  options:
  - id: A
    text: Minimum replicas of 1 and an HTTP scale rule
    explanation: Keeping one replica running prevents scaling to zero.
  - id: B
    text: A single revision mode with replicas fixed at 10
    explanation: A fixed replica count costs the most and does not scale to zero.
  - id: C
    text: A dedicated workload profile with reserved nodes
    explanation: Reserved dedicated nodes incur ongoing cost.
  - id: D
    text: Minimum replicas of 0, maximum replicas of 10 and an HTTP scale rule
    explanation: Container Apps can scale to zero and scale out using KEDA-based HTTP rules, with usage-based billing on the Consumption plan.
  correct: [D]
  explanation: Setting minReplicas to 0 lets the app scale to zero when idle, and the HTTP concurrency rule scales out to the maximum of 10.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/container-apps/scale-app
- id: 87
  domain: compute
  topic: containers
  type: single
  text: You deploy a new version of a container app and want to send 20% of the traffic to the new revision and 80% to the previous one for validation. What should you do?
  options:
  - id: A
    text: Set the revision mode to Multiple and configure traffic weights for the revisions.
    explanation: Multiple revision mode keeps several revisions active and supports percentage-based traffic splitting.
  - id: B
    text: Keep the Single revision mode and set a replica ratio.
    explanation: Single mode keeps only the latest revision active.
  - id: C
    text: Create a second container app environment and use Azure DNS to weight traffic.
    explanation: This is not needed and is more complex than built-in traffic splitting.
  - id: D
    text: Use a deployment slot swap with preview.
    explanation: Deployment slots are an App Service feature, not Container Apps.
  correct: [A]
  explanation: Container Apps supports blue-green and A/B scenarios through Multiple revision mode with traffic weights per revision.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/container-apps/revisions
  - https://learn.microsoft.com/azure/container-apps/traffic-splitting
- id: 88
  domain: compute
  topic: containers
  type: multiple
  text: |-
    An Azure Container Instances group must pull an image from a private Azure Container Registry, and you must avoid the registry admin account. Which two authentication methods can you use? Choose 2.
  options:
  - id: A
    text: Anonymous access, which is enabled by default on all registries
    explanation: Anonymous pull is disabled by default and not suitable for private images.
  - id: B
    text: A managed identity assigned the AcrPull role on the registry
    explanation: Managed identities are supported for ACI image pulls and give secretless access.
  - id: C
    text: A service principal assigned the AcrPull role on the registry
    explanation: Service principal credentials can be provided to ACI for the pull.
  - id: D
    text: A storage account access key
    explanation: Storage keys have no relationship to registry authentication.
  correct: [B, C]
  explanation: Identity-based access via a managed identity or a service principal with the AcrPull role is recommended over the admin account.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/container-registry/container-registry-authentication
- id: 89
  domain: compute
  topic: containers
  type: single
  text: You need images in Azure Container Registry to be rebuilt automatically when the base image is updated or when code is committed to a GitHub repository, without managing build servers. Which feature should you use?
  options:
  - id: A
    text: Azure Container Instances with a cron job
    explanation: This requires custom build orchestration and a host.
  - id: B
    text: Content trust in the registry
    explanation: Content trust signs images and does not build them.
  - id: C
    text: Registry soft delete
    explanation: Soft delete recovers deleted artifacts.
  - id: D
    text: ACR Tasks
    explanation: ACR Tasks builds images in Azure and can trigger on source commits and base image updates.
  correct: [D]
  explanation: ACR Tasks provides cloud-based image builds with triggers from source code commits, base image updates and timers.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/container-registry/container-registry-tasks-overview
- id: 90
  domain: compute
  topic: containers
  type: single
  text: A container app needs a database connection string that must not be stored in the container image or visible in the revision's plain-text settings. What is the recommended approach in Azure Container Apps?
  options:
  - id: A
    text: Hard-code the value in the Dockerfile as an ENV instruction.
    explanation: The value would be embedded in the image.
  - id: B
    text: Define a secret on the container app and reference it from an environment variable.
    explanation: Secrets are stored securely at the app level and can be exposed as environment variables or volumes, optionally backed by Key Vault.
  - id: C
    text: Store the value in a container app tag.
    explanation: Tags are plain-text metadata visible to readers.
  - id: D
    text: Put the value in a public Azure Files share mounted to the container.
    explanation: A public share exposes the value.
  correct: [B]
  explanation: Container Apps secrets, including Key Vault references, keep sensitive values out of images and are referenced through secretRef in environment variables.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/container-apps/manage-secrets
- id: 91
  domain: compute
  topic: app-service
  type: single
  text: Two web apps run in the same Standard S1 App Service plan with 1 instance. You configure the plan to scale out to 3 instances. What is the result?
  options:
  - id: A
    text: Only the first web app runs on 3 instances.
    explanation: Instances belong to the plan, not to individual apps.
  - id: B
    text: Each web app runs on 3 instances in the same plan, and the apps share the plan's compute.
    explanation: Apps in the same plan run on all of the plan's instances.
  - id: C
    text: A new plan is created for each additional instance.
    explanation: Scaling out adds instances to the same plan.
  - id: D
    text: The plan tier changes to Premium to support multiple instances.
    explanation: Scale out does not change the tier; that would be scale up.
  correct: [B]
  explanation: The App Service plan defines the compute resources, so scaling out adds instances that all apps in the plan run on.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/app-service/overview-hosting-plans
- id: 92
  domain: compute
  topic: app-service
  type: single
  text: A web app has a staging deployment slot. The production and staging slots use different database connection strings, and after a slot swap the production app must keep using the production connection string. What should you do?
  options:
  - id: A
    text: Store the connection strings in the code repository.
    explanation: This would swap with the code and does not fix the issue.
  - id: B
    text: Disable auto swap on the staging slot.
    explanation: This affects triggering, not setting stickiness.
  - id: C
    text: Create a separate App Service plan for the production slot.
    explanation: Slots of an app always share the plan.
  - id: D
    text: Mark the connection string as a deployment slot setting in both slots.
    explanation: Slot (sticky) settings stay with the slot during a swap, while other settings move with the content.
  correct: [D]
  explanation: Settings marked as deployment slot settings do not swap, so each slot keeps its own value.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/app-service/deploy-staging-slots
- id: 93
  domain: compute
  topic: app-service
  type: single
  text: You must map the root (apex) domain contoso.com to an App Service app by using an external DNS provider. Which records should you create?
  options:
  - id: A
    text: A record pointing to the app's inbound IP address and a TXT record named asuid containing the custom domain verification ID
    explanation: Apex domains cannot use CNAME; an A record plus a TXT asuid verification record is required.
  - id: B
    text: A CNAME record for @ pointing to the app's default hostname
    explanation: CNAME records cannot be used at the zone apex.
  - id: C
    text: An MX record pointing to the app's default hostname
    explanation: MX records are for mail routing.
  - id: D
    text: An NS record delegating contoso.com to the app
    explanation: App Service does not host DNS zones for external domains in this manner.
  correct: [A]
  explanation: For apex domains use an A record to the app's IP address, plus a TXT record (asuid) so Azure can verify domain ownership. Subdomains like www use a CNAME.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/app-service/app-service-web-tutorial-custom-domain
- id: 94
  domain: compute
  topic: app-service
  type: single
  text: A web app must serve https for *.contoso.com with a single certificate covering all subdomains. The certificate is stored in Azure Key Vault. What should you do?
  options:
  - id: A
    text: Create a free App Service managed certificate for *.contoso.com.
    explanation: Free managed certificates do not support wildcard domains.
  - id: B
    text: Import the wildcard certificate from Key Vault into the app's TLS/SSL settings.
    explanation: Key Vault certificates, including wildcard ones, can be imported and bound to custom domains.
  - id: C
    text: Enable the default *.azurewebsites.net certificate for the custom domain.
    explanation: The default certificate only covers azurewebsites.net hostnames.
  - id: D
    text: Create a self-signed certificate on the VM and upload it as a public certificate.
    explanation: Public certificates are for outbound trust, and self-signed certificates are not trusted by browsers.
  correct: [B]
  explanation: App Service managed certificates do not support wildcards. Import a private certificate from Key Vault and add TLS bindings.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/app-service/configure-ssl-certificate
- id: 95
  domain: compute
  topic: app-service
  type: single
  text: Your security team requires that clients connecting to your App Service app use only TLS 1.2 or later, and that plain HTTP requests are rejected or redirected. Which settings should you configure?
  options:
  - id: A
    text: Enable Always On and set ARR Affinity to off.
    explanation: These do not affect protocol security.
  - id: B
    text: Add an access restriction rule that denies port 80.
    explanation: Access restrictions filter by IP address or subnet, not port.
  - id: C
    text: Turn on HTTPS Only and set the minimum inbound TLS version to 1.2.
    explanation: HTTPS Only redirects HTTP to HTTPS, and the minimum TLS version rejects older protocols.
  - id: D
    text: Configure a deployment slot with a custom domain.
    explanation: Slots do not set TLS policy.
  correct: [C]
  explanation: In the app's configuration, HTTPS Only forces HTTPS and the minimum inbound TLS version setting enforces TLS 1.2 or higher.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/app-service/configure-ssl-bindings
- id: 96
  domain: compute
  topic: app-service
  type: single
  text: You try to configure scheduled backups for a web app in a Basic-tier App Service plan, but the option is not available. What is required to use the backup feature?
  options:
  - id: A
    text: Enable Azure Site Recovery for the app.
    explanation: Site Recovery protects VMs, not App Service.
  - id: B
    text: Add a deployment slot to the app.
    explanation: Slots are not required for backups.
  - id: C
    text: Install the Backup VM extension.
    explanation: App Service has no VM extension to install.
  - id: D
    text: Scale up the plan to Standard or higher and provide a storage account container for the backup.
    explanation: Backup and restore require Standard or higher tiers, and the backup is stored in a storage account container.
  correct: [D]
  explanation: App Service backup and restore is available in Standard, Premium and Isolated tiers and writes backups to a storage account.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/app-service/manage-backup
- id: 97
  domain: compute
  topic: app-service
  type: single
  text: An App Service web app must connect to an Azure SQL Managed Instance by its private IP address in a virtual network. You do not want to change how inbound traffic reaches the app. What should you enable?
  options:
  - id: A
    text: Regional virtual network integration
    explanation: VNet integration lets the app make outbound calls into the VNet.
  - id: B
    text: A private endpoint for the web app
    explanation: Private endpoints control inbound traffic to the app.
  - id: C
    text: Access restrictions with a service endpoint rule
    explanation: Access restrictions filter inbound traffic only.
  - id: D
    text: An App Service Domain
    explanation: This is a domain registration service.
  correct: [A]
  explanation: Regional VNet integration provides outbound connectivity from the app to resources in or peered with the integrated VNet.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/app-service/overview-vnet-integration
- id: 98
  domain: compute
  topic: app-service
  type: multiple
  text: |-
    You must restrict inbound access to an App Service app so that only the 203.0.113.0/24 corporate range and a subnet in your virtual network can reach it. Which two features can you use? Choose 2.
  options:
  - id: A
    text: Access restriction rule that allows the IP address range
    explanation: Access restrictions support IP-based allow rules, and unmatched traffic is denied.
  - id: B
    text: Regional virtual network integration
    explanation: VNet integration affects outbound traffic only.
  - id: C
    text: Access restriction rule that allows the subnet through a service endpoint
    explanation: Service endpoint-based rules allow traffic from a specific subnet.
  - id: D
    text: Hybrid Connections
    explanation: Hybrid Connections provide outbound access to on-premises TCP endpoints.
  correct: [A, C]
  explanation: Access restrictions control inbound traffic by IP ranges or virtual network subnets with service endpoints, and deny other traffic once a rule exists.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/app-service/app-service-ip-restrictions
- id: 99
  domain: compute
  topic: app-service
  type: single
  text: A low-traffic App Service app takes several seconds to respond to the first request after periods of inactivity because the worker unloads the app. Which setting should you enable to keep the app loaded?
  options:
  - id: A
    text: ARR Affinity
    explanation: ARR Affinity pins sessions to instances and does not keep the app warm.
  - id: B
    text: Always On
    explanation: Always On periodically pings the app so it is not unloaded; it is available in Basic and higher tiers.
  - id: C
    text: Local cache
    explanation: Local cache improves file access performance and does not prevent idle unloading.
  - id: D
    text: Autoheal
    explanation: Autoheal recycles unhealthy processes and does not stop idle unloading.
  correct: [B]
  explanation: Always On keeps the app loaded by sending requests regularly, avoiding cold starts due to idle timeout. It is not available in Free and Shared tiers.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/app-service/configure-common
- id: 100
  domain: compute
  topic: app-service
  type: single
  text: You must host a .NET app that runs on Windows and a Node.js app that runs on Linux. What is the minimum number of App Service plans required?
  options:
  - id: A
    text: One plan, because the plan selects the runtime for each app.
    explanation: A plan is tied to one operating system.
  - id: B
    text: Two plans, because one plan cannot host both Windows and Linux apps.
    explanation: Each App Service plan runs either Windows or Linux workers, so you need one of each.
  - id: C
    text: Three plans, one for each runtime stack plus a shared one.
    explanation: There is no need for an extra plan.
  - id: D
    text: Two plans, but only if they are in different regions.
    explanation: Region is not the factor; operating system is.
  correct: [B]
  explanation: An App Service plan is created for a single OS, so Windows and Linux apps require separate plans. You can place them in the same region and resource group.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/app-service/overview-hosting-plans
- id: 101
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: You plan a virtual network with the address space 10.10.0.0/16. You need a subnet that will host about 100 VMs. Which subnet size is the smallest that meets the requirement, keeping in mind the addresses Azure reserves in every subnet?
  options:
  - id: A
    text: 10.10.1.0/26
    explanation: A /26 has 64 addresses, 59 usable after the 5 reserved by Azure, which is not enough.
  - id: B
    text: 10.10.1.0/25
    explanation: A /25 has 128 addresses; after Azure reserves 5, 123 remain, which covers 100 VMs.
  - id: C
    text: 10.10.1.0/28
    explanation: A /28 has only 16 addresses (11 usable).
  - id: D
    text: 10.10.1.0/24
    explanation: This works but is larger than the smallest size that satisfies the requirement.
  correct: [B]
  explanation: Azure reserves five addresses in each subnet (network, default gateway, two for DNS mapping, broadcast). A /25 gives 123 usable addresses, the smallest size that fits 100 VMs.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/virtual-network/virtual-networks-faq
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-manage-subnet

- id: 102
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: You peered VNet1 (10.1.0.0/16) in East US with VNet2 (10.2.0.0/16) in West Europe. You now need to add the address space 10.3.0.0/16 to VNet2 and have VNet1 resources reach it. What should you do after adding the address space?
  options:
  - id: A
    text: Delete and recreate the peering between VNet1 and VNet2
    explanation: Recreation is not required.
  - id: B
    text: Add a UDR on VNet1 with next hop VirtualNetworkGateway
    explanation: No gateway is involved in peering.
  - id: C
    text: Nothing; the new address space propagates automatically
    explanation: Peering does not sync automatically when the address space changes.
  - id: D
    text: Use the Sync peering action on the peering from VNet1 to VNet2
    explanation: Syncing updates the remote address space seen by the peering.
  correct: [D]
  explanation: When you change the address space of a peered VNet, you must sync the peering on the other side so that it learns the new prefix. Global VNet peering is supported across regions.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-peering-overview
  - https://learn.microsoft.com/azure/virtual-network/update-virtual-network-peering-address-space

- id: 103
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: A VM in subnet Frontend must send all internet-bound traffic through a network virtual appliance (NVA) at 10.0.5.4 in subnet Appliance. Which configuration should you use?
  options:
  - id: A
    text: A route table with route 0.0.0.0/0, next hop type Virtual appliance, next hop address 10.0.5.4, associated with the Frontend subnet
    explanation: A UDR default route to the NVA, associated with the source subnet, overrides the system route to the internet.
  - id: B
    text: A route table with route 0.0.0.0/0, next hop type Internet, associated with the Appliance subnet
    explanation: This sends traffic directly to the internet and is on the wrong subnet.
  - id: C
    text: A route table with route 10.0.5.4/32, next hop type Virtual network, associated with the Frontend subnet
    explanation: That does not redirect internet traffic.
  - id: D
    text: A network security group rule that forwards traffic to 10.0.5.4
    explanation: NSGs filter traffic; they cannot forward or route it.
  correct: [A]
  explanation: User-defined routes override system routes. A 0.0.0.0/0 route with next hop Virtual appliance forces traffic to the NVA (the NVA also needs IP forwarding enabled).
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-network/virtual-networks-udr-overview
  - https://learn.microsoft.com/azure/virtual-network/tutorial-create-route-table-portal

- id: 104
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: You deploy an NVA VM that routes traffic between two subnets. Traffic routed by a UDR reaches the NVA but is dropped and never forwarded. The NVA's guest OS has IP forwarding enabled. What else must you configure?
  options:
  - id: A
    text: Add a public IP address to the NVA
    explanation: A public IP is not needed for internal forwarding.
  - id: B
    text: Associate the NVA's subnet with the route table
    explanation: That would create a routing loop and does not allow forwarding.
  - id: C
    text: Enable IP forwarding on the NVA's network interface in Azure
    explanation: Azure drops packets whose destination is not the NIC's own IP unless IP forwarding is enabled on the NIC.
  - id: D
    text: Convert the NVA's NIC to use a static private IP address
    explanation: Static addressing does not affect forwarding.
  correct: [C]
  explanation: IP forwarding must be enabled both in the guest OS and on the Azure NIC setting so the platform delivers packets not addressed to the NIC.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-network-interface
  - https://learn.microsoft.com/azure/virtual-network/virtual-networks-udr-overview

- id: 105
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: |-
    You need to create a public IP address that will be assigned to a Standard public load balancer frontend and must be zone-redundant. Which statement is correct?
  options:
  - id: A
    text: Use a Basic SKU public IP with dynamic allocation
    explanation: Basic SKU public IPs do not support availability zones, and Basic SKU public IPs are being retired.
  - id: B
    text: Use a Standard SKU public IP with static allocation
    explanation: Standard SKU public IPs are always static and can be zone-redundant.
  - id: C
    text: Use a Standard SKU public IP with dynamic allocation
    explanation: Standard SKU public IPs only support static allocation.
  - id: D
    text: Use a Basic SKU public IP with static allocation
    explanation: Basic SKU cannot be zone-redundant and cannot be used with a Standard load balancer.
  correct: [B]
  explanation: Standard SKU public IPs are static, zone-redundant by default in supported regions, and are required for a Standard load balancer. SKUs of the public IP and the load balancer must match.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/virtual-network/ip-services/public-ip-addresses
  - https://learn.microsoft.com/azure/load-balancer/skus

- id: 106
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: |-
    VNet-A (10.0.0.0/16) and VNet-B (10.0.0.0/16) are in the same subscription. You try to peer them and the operation fails. What is the cause and the resolution?
  options:
  - id: A
    text: Peering requires both VNets to be in different subscriptions; move VNet-B
    explanation: Peering works within a single subscription.
  - id: B
    text: Peering requires a VPN gateway in each VNet; deploy gateways
    explanation: Gateways are not required for peering.
  - id: C
    text: Peering requires both VNets to be in the same region; redeploy VNet-B
    explanation: Global VNet peering supports different regions.
  - id: D
    text: The address spaces overlap; change the address space of one VNet
    explanation: Peered VNets cannot have overlapping address spaces.
  correct: [D]
  explanation: VNet peering needs non-overlapping address spaces. You must re-address one VNet (which requires removing and recreating resources or the subnet configuration) before peering.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-peering-overview
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-manage-peering

- id: 107
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: |-
    Hub VNet has a VPN gateway connected to on-premises. Spoke VNet is peered with Hub. VMs in Spoke must reach on-premises through the hub gateway. Which peering settings are required?
  options:
  - id: A
    text: On the Hub-to-Spoke peering enable Allow gateway transit; on the Spoke-to-Hub peering enable Use remote gateways
    explanation: This is the supported gateway transit configuration.
  - id: B
    text: On the Hub-to-Spoke peering enable Use remote gateways; on the Spoke-to-Hub peering enable Allow gateway transit
    explanation: This is reversed; the spoke has no gateway to transit.
  - id: C
    text: Enable Allow forwarded traffic on the Spoke-to-Hub peering only
    explanation: Forwarded traffic does not provide gateway access.
  - id: D
    text: Enable Allow virtual network access on both peerings only
    explanation: This allows VM-to-VM traffic but does not share the gateway.
  correct: [A]
  explanation: The VNet that owns the gateway sets Allow gateway transit, and the remote VNet sets Use remote gateways. The spoke must not have its own gateway.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-peering-overview
  - https://learn.microsoft.com/azure/vpn-gateway/vpn-gateway-peering-gateway-transit

- id: 108
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: |-
    A VM can no longer connect to a database VM in another subnet of the same VNet over TCP 1433. You want to determine whether a rule or route is blocking traffic between the two VMs without logging in to either. Which tool should you use?
  options:
  - id: A
    text: Azure Advisor
    explanation: Advisor gives recommendations, not packet-level diagnostics.
  - id: B
    text: Connection monitor with Log Analytics only
    explanation: This measures reachability over time but is not the quickest per-flow rule check.
  - id: C
    text: Network Watcher Connection troubleshoot
    explanation: It tests connectivity between source and destination and reports the blocking NSG rule or route.
  - id: D
    text: Azure Service Health
    explanation: Service Health reports Azure platform incidents.
  correct: [C]
  explanation: Network Watcher Connection troubleshoot (or IP flow verify) identifies whether traffic is allowed and which NSG rule or route affects it.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/network-watcher/network-watcher-overview
  - https://learn.microsoft.com/azure/network-watcher/connection-troubleshoot-portal

- id: 109
  domain: virtual-networking
  topic: vnets-and-subnets
  type: multiple
  text: |-
    You are designing a VNet that will use a VPN gateway and Azure Firewall. Which two subnet names are required exactly as written? Choose 2.
  options:
  - id: A
    text: FirewallGateway
    explanation: Not a valid reserved name.
  - id: B
    text: GatewaySubnet
    explanation: A VPN gateway must be deployed in a subnet named GatewaySubnet.
  - id: C
    text: FirewallManagement
    explanation: Only needed for forced tunneling configuration, and the name is AzureFirewallManagementSubnet.
  - id: D
    text: AzureFirewallSubnet
    explanation: Azure Firewall must be deployed in a subnet named AzureFirewallSubnet.
  correct: [B, D]
  explanation: VPN gateways require GatewaySubnet and Azure Firewall requires AzureFirewallSubnet (minimum /26).
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings
  - https://learn.microsoft.com/azure/firewall/firewall-faq

- id: 110
  domain: virtual-networking
  topic: vnets-and-subnets
  type: single
  text: |-
    You run the following commands:

        az network vnet subnet update -g rg1 --vnet-name vnet1 -n app --address-prefixes 10.0.1.0/25

    The command fails with an error. The subnet currently has the prefix 10.0.1.0/24 and contains NICs for 20 running VMs. What is the most likely cause?
  options:
  - id: A
    text: Subnet prefixes can never be changed after creation
    explanation: They can be changed when the subnet is empty.
  - id: B
    text: A subnet that has connected resources cannot have its address range changed
    explanation: The address range can only be modified when no resources are deployed in the subnet.
  - id: C
    text: The new prefix is not inside the VNet address space
    explanation: Nothing indicates 10.0.1.0/25 is outside the VNet; it is a subset of the current subnet.
  - id: D
    text: The Azure CLI cannot update subnets; you must use PowerShell
    explanation: The CLI supports the update command.
  correct: [B]
  explanation: You can only change a subnet's address range when no resources are in it; otherwise remove or move the resources first.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-manage-subnet
  - https://learn.microsoft.com/azure/virtual-network/virtual-networks-faq

- id: 111
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    You have three web VMs and two app VMs in the same subnet. You want a single NSG rule that allows TCP 8080 from the web VMs to the app VMs and that does not need to be edited when VMs are added. What should you use?
  options:
  - id: A
    text: Application security groups for the source and destination
    explanation: ASGs group NICs logically so that rules can reference them.
  - id: B
    text: Service tags for the source and destination
    explanation: Service tags represent Azure service IP prefixes, not your own VMs.
  - id: C
    text: Separate subnets and rules based on subnet CIDR
    explanation: This requires re-architecting and does not fit the requirement.
  - id: D
    text: A user-defined route per VM
    explanation: UDRs do not filter traffic.
  correct: [A]
  explanation: Assign NICs to ASGs (for example WebServers and AppServers) and reference them as source and destination in the NSG rule.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/virtual-network/application-security-groups
  - https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview

- id: 112
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    A VM is in a subnet associated with NSG-Subnet and its NIC is associated with NSG-Nic. Inbound rules:

        NSG-Subnet: priority 100, Allow, TCP 443, source Internet
        NSG-Nic:    priority 100, Deny,  TCP 443, source Internet

    An internet client connects to the VM on TCP 443. What happens?
  options:
  - id: A
    text: Allowed, because the subnet NSG is evaluated last and allow wins
    explanation: Both NSGs must allow the traffic.
  - id: B
    text: Allowed, because priority numbers are equal
    explanation: Equal numbers do not matter across different NSGs.
  - id: C
    text: Denied, because inbound traffic is evaluated by the subnet NSG first and then the NIC NSG, and the NIC NSG denies it
    explanation: Inbound traffic must be allowed by both the subnet NSG and the NIC NSG.
  - id: D
    text: Denied, because NSG rules on a NIC are ignored when a subnet NSG exists
    explanation: Both are applied.
  correct: [C]
  explanation: For inbound traffic the subnet NSG is evaluated first, then the NIC NSG. A deny at either level drops the traffic.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-network/network-security-group-how-it-works
  - https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview

- id: 113
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    You must allow outbound HTTPS from VMs only to Azure Storage in the same region, and block all other internet access, using an NSG with the fewest rules and without maintaining IP lists. Which rule set meets this?
  options:
  - id: A
    text: Allow destination Storage service tag, TCP 443 (priority 100); the default rules handle everything else
    explanation: The default AllowInternetOutBound rule would still permit other internet traffic.
  - id: B
    text: Allow destination IP ranges of the storage account, TCP 443; deny nothing else
    explanation: Requires IP maintenance and does not block other traffic.
  - id: C
    text: Deny destination VirtualNetwork, any port; allow Internet, TCP 443
    explanation: That does not meet the requirement.
  - id: D
    text: Allow destination Storage.<region> service tag, TCP 443 (priority 100); deny destination Internet, any port (priority 200)
    explanation: The regional service tag avoids IP lists and the explicit deny overrides AllowInternetOutBound (65001).
  correct: [D]
  explanation: Service tags remove the need to maintain IP ranges. The default AllowInternetOutBound rule has priority 65001, so an explicit deny with a lower number is needed.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/virtual-network/service-tags-overview
  - https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview

- id: 114
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    You must RDP to VMs that have no public IP addresses, directly from the Azure portal over TLS, without exposing ports 3389/22 to the internet. Which service should you deploy?
  options:
  - id: A
    text: Azure Firewall DNAT rules
    explanation: DNAT exposes the ports through a public IP.
  - id: B
    text: Azure Bastion
    explanation: Bastion provides RDP/SSH to VMs over TLS from the portal using private IPs; it needs the subnet AzureBastionSubnet.
  - id: C
    text: A Basic public IP on each VM with a JIT rule
    explanation: VMs would then have public IPs.
  - id: D
    text: Azure Front Door
    explanation: Front Door is a layer 7 web delivery service.
  correct: [B]
  explanation: Azure Bastion is deployed into a subnet named AzureBastionSubnet (/26 or larger) and connects to VMs over their private IPs.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/bastion/bastion-overview
  - https://learn.microsoft.com/azure/bastion/tutorial-create-host-portal

- id: 115
  domain: virtual-networking
  topic: secure-network-access
  type: multiple
  text: |-
    You enable a service endpoint for Microsoft.Storage on subnet App. Which two statements about service endpoints are true? Choose 2.
  options:
  - id: A
    text: Traffic to Azure Storage from the subnet uses the Microsoft backbone and the storage account can restrict access to the subnet
    explanation: This is the purpose of service endpoints with VNet rules.
  - id: B
    text: The storage account gets a private IP address in the subnet
    explanation: That describes a private endpoint.
  - id: C
    text: The source IP seen by the service changes from public IP to the VM's private IP identity for the VNet rule
    explanation: Traffic uses the subnet's VNet identity; the storage firewall can allow the subnet.
  - id: D
    text: On-premises clients automatically get access through the service endpoint
    explanation: Service endpoints do not extend to on-premises without additional configuration.
  correct: [A, C]
  explanation: Service endpoints optimize routing to the PaaS service public endpoint over the backbone and provide the subnet identity for firewall rules. They do not assign a private IP (private endpoints do).
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/virtual-network/virtual-network-service-endpoints-overview
  - https://learn.microsoft.com/azure/storage/common/storage-network-security

- id: 116
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    A company needs to access an Azure SQL logical server from its VNet and from on-premises over ExpressRoute using a private IP address, and disable public access to the server. What should you configure?
  options:
  - id: A
    text: A private endpoint for the SQL server with a privatelink.database.windows.net private DNS zone
    explanation: A private endpoint gives the service a private IP in your VNet reachable from on-premises.
  - id: B
    text: A service endpoint for Microsoft.Sql on the subnet
    explanation: It still uses the public endpoint and is not reachable via a private IP.
  - id: C
    text: A public IP address on the SQL server
    explanation: This is the opposite of the requirement.
  - id: D
    text: A VNet peering with the SQL service
    explanation: PaaS services cannot be peered.
  correct: [A]
  explanation: Private Endpoint plus Private DNS zone integration resolves the server FQDN to the private IP, including for on-premises clients using DNS forwarding.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/private-link/private-endpoint-overview
  - https://learn.microsoft.com/azure/private-link/private-endpoint-dns

- id: 117
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    You created a private endpoint for a storage account blob service. From a VM in the VNet, nslookup mystorage.blob.core.windows.net returns the public IP address. What should you do to make the name resolve to the private IP?
  options:
  - id: A
    text: Recreate the storage account with a new name
    explanation: The name is not the problem.
  - id: B
    text: Add an A record for mystorage.blob.core.windows.net in a public DNS zone
    explanation: A public zone would not resolve to a private IP for VNet clients.
  - id: C
    text: Enable a service endpoint on the subnet
    explanation: A service endpoint does not alter DNS.
  - id: D
    text: Create a private DNS zone privatelink.blob.core.windows.net, add the record for the endpoint, and link it to the VNet
    explanation: Linked private DNS zone resolves the privatelink CNAME to the private IP.
  correct: [D]
  explanation: The public name CNAMEs to mystorage.privatelink.blob.core.windows.net. A private DNS zone with that name, linked to the VNet, returns the private IP.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/private-link/private-endpoint-dns
  - https://learn.microsoft.com/azure/dns/private-dns-privatednszone

- id: 118
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    Review the effective security rules of a VM NIC (inbound, excerpt):

        Priority  Name                  Port  Protocol  Source          Action
        100       AllowWeb              80    TCP       Internet        Allow
        200       DenyAll80             80    TCP       Any             Deny
        300       AllowRdpCorp          3389  TCP       10.20.0.0/16    Allow
        65000     AllowVnetInBound      Any   Any       VirtualNetwork  Allow
        65500     DenyAllInBound        Any   Any       Any             Deny

    A VM at 10.20.4.5 in a peered VNet tries TCP 3389 to this VM. A client on the internet tries TCP 80. What is the result?
  options:
  - id: A
    text: Both are denied
    explanation: Rules 100 and 300 allow them.
  - id: B
    text: RDP is denied and HTTP is allowed
    explanation: RDP matches rule 300 and is allowed.
  - id: C
    text: Both are allowed
    explanation: Rule 300 allows the RDP source range and rule 100, evaluated before 200, allows HTTP.
  - id: D
    text: RDP is allowed and HTTP is denied
    explanation: Rule 100 has lower priority number and matches first.
  correct: [C]
  explanation: Rules are processed in ascending priority; the first match wins.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/virtual-network/diagnose-network-traffic-filter-problem
  - https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview

- id: 119
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    You must give admins time-limited RDP access to production VMs and have the NSG rule created automatically on request, then removed. Which feature should you use?
  options:
  - id: A
    text: Azure Policy deny effect
    explanation: Policy governs configuration, not access windows.
  - id: B
    text: Just-in-time VM access in Microsoft Defender for Cloud
    explanation: JIT opens management ports for a requested time and source via NSG rules.
  - id: C
    text: Network Watcher packet capture
    explanation: This captures traffic.
  - id: D
    text: Resource locks
    explanation: Locks prevent deletion/modification of resources.
  correct: [B]
  explanation: JIT VM access in Defender for Cloud adds temporary allow rules to the NSG (or Azure Firewall) for the approved duration.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/defender-for-cloud/just-in-time-access-overview
  - https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview

- id: 120
  domain: virtual-networking
  topic: secure-network-access
  type: single
  text: |-
    A web VM cannot be reached on TCP 443 from the internet. NSG rules look correct. You want to see all rules that apply to the NIC, merged from the subnet and NIC NSGs. Which command should you use?
  options:
  - id: A
    text: az network nsg rule list
    explanation: Lists rules of a single NSG only.
  - id: B
    text: az network vnet list-endpoint-services
    explanation: Lists service endpoint services.
  - id: C
    text: az network nic show
    explanation: Shows NIC properties, not merged rules.
  - id: D
    text: az network nic list-effective-nsg
    explanation: Returns the effective security rules for the NIC.
  correct: [D]
  explanation: Effective security rules (portal Effective security rules, az network nic list-effective-nsg, Get-AzEffectiveNetworkSecurityGroup) display all applied rules.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/virtual-network/diagnose-network-traffic-filter-problem
  - https://learn.microsoft.com/cli/azure/network/nic

- id: 121
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: |-
    You host contoso.com in an Azure DNS public zone. You must point the apex (contoso.com) to an Azure Front Door endpoint without using a CNAME. What should you create?
  options:
  - id: A
    text: A CNAME record at the apex
    explanation: CNAME records are not allowed at the zone apex.
  - id: B
    text: A TXT record at the apex
    explanation: TXT records do not resolve names.
  - id: C
    text: An alias record set (A or AAAA) referencing the Front Door resource
    explanation: Alias records can be created at the apex and target supported Azure resources.
  - id: D
    text: An NS record at the apex
    explanation: NS records delegate zones.
  correct: [C]
  explanation: Alias records let the apex point to Azure resources (public IP, Traffic Manager, Front Door, CDN) and follow IP changes.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/dns/dns-alias
  - https://learn.microsoft.com/azure/dns/dns-zones-records

- id: 122
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: |-
    You create a private DNS zone contoso.internal and link VNet1 and VNet2 with auto registration enabled on VNet1 only. A new VM is created in VNet1 and another in VNet2. What happens?
  options:
  - id: A
    text: Only the VM in VNet1 gets a record automatically; VNet2 VMs resolve it through the link
    explanation: Auto registration is per link; VNet2 can resolve but its VMs are not registered.
  - id: B
    text: Both VMs are registered automatically
    explanation: Auto registration is not enabled for VNet2.
  - id: C
    text: Neither is registered; auto registration works only with public zones
    explanation: It is a private zone feature.
  - id: D
    text: Only the VM in VNet2 is registered, since it is a resolution link
    explanation: This is reversed.
  correct: [A]
  explanation: A VNet link with registration enabled creates A records for VMs in that VNet; a resolution-only link just resolves names. A VNet can be linked to only one zone with registration.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/dns/private-dns-autoregistration
  - https://learn.microsoft.com/azure/dns/private-dns-virtual-network-links

- id: 123
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: |-
    You registered contoso.com with a third-party registrar and created an Azure DNS public zone for it. Names still resolve through the registrar's servers. What must you do?
  options:
  - id: A
    text: Create an alias record for contoso.com
    explanation: Alias records do not change delegation.
  - id: B
    text: At the registrar, set the domain's name servers to the four NS records assigned to the Azure DNS zone
    explanation: Delegation is done by updating NS at the registrar.
  - id: C
    text: Create a private DNS zone with the same name
    explanation: A private zone only resolves in linked VNets.
  - id: D
    text: Purchase the domain from Azure App Service Domains
    explanation: Not required to use Azure DNS.
  correct: [B]
  explanation: Azure DNS does not register domains; delegate by updating the registrar's name servers to those of the Azure zone.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/dns/dns-delegate-domain-azure-dns
  - https://learn.microsoft.com/azure/dns/dns-overview

- id: 124
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: multiple
  text: |-
    Backend VMs behind a Standard public load balancer are all marked unhealthy by an HTTP health probe on port 80, although the application works when you test it directly from inside the VNet. Which two checks are most likely to reveal the cause? Choose 2.
  options:
  - id: A
    text: Confirm the VMs have a public IP address
    explanation: Backends of a Standard load balancer do not need public IPs.
  - id: B
    text: Confirm the NSG allows inbound traffic from the AzureLoadBalancer service tag on port 80
    explanation: Probes originate from 168.63.129.16 (AzureLoadBalancer); a deny blocks them.
  - id: C
    text: Confirm the probe path returns HTTP 200 and the app listens on the probe port
    explanation: An HTTP probe needs a 200 OK; any other result marks the instance down.
  - id: D
    text: Confirm the load balancer SKU is Basic
    explanation: The SKU does not explain failed probes.
  correct: [B, C]
  explanation: Health probes come from 168.63.129.16 and must be allowed; the HTTP probe expects 200 from the path on the configured port.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/load-balancer/load-balancer-custom-probe-overview
  - https://learn.microsoft.com/azure/load-balancer/load-balancer-troubleshoot-health-probe-status

- id: 125
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: |-
    A three-tier app needs a load balancer for the database tier that is reachable only from the app tier VMs inside the VNet. Which choice is correct?
  options:
  - id: A
    text: A Standard public load balancer with an NSG
    explanation: It would expose a public frontend.
  - id: B
    text: Azure Front Door Premium
    explanation: Front Door is a public global service for web traffic.
  - id: C
    text: Azure Traffic Manager
    explanation: Traffic Manager is DNS-based and global.
  - id: D
    text: A Standard internal load balancer with a private frontend IP in the database subnet
    explanation: An internal load balancer has a private frontend only reachable from the VNet or connected networks.
  correct: [D]
  explanation: Internal load balancers use a private frontend IP address and distribute traffic within a VNet or connected networks.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/load-balancer/components
  - https://learn.microsoft.com/azure/load-balancer/load-balancer-overview

- id: 126
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: |-
    A load balancer distributes traffic to two VMs, but each client session must keep going to the same VM during its session, based on client IP. Which setting should you configure on the load balancing rule?
  options:
  - id: A
    text: Floating IP
    explanation: Floating IP is for scenarios such as SQL Always On listeners.
  - id: B
    text: Idle timeout of 30 minutes
    explanation: This affects connection keep-alive, not distribution.
  - id: C
    text: Session persistence set to Client IP
    explanation: Client IP (source IP affinity) sends traffic from the same client to the same backend.
  - id: D
    text: Outbound rules
    explanation: Outbound rules control SNAT.
  correct: [C]
  explanation: Session persistence (Client IP, or Client IP and protocol) overrides the default 5-tuple hash.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/load-balancer/distribution-mode-concepts
  - https://learn.microsoft.com/azure/load-balancer/load-balancer-distribution-mode

- id: 127
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: |-
    Backend VMs of a Standard internal load balancer cannot reach the internet because the load balancer has no outbound path and the VMs have no public IPs. VMs must reach the internet with a static outbound public IP for the whole subnet and minimal management. What should you use?
  options:
  - id: A
    text: NAT gateway associated with the subnet
    explanation: NAT gateway provides scalable outbound SNAT using static public IPs for the subnet.
  - id: B
    text: Default outbound access, relying on the platform
    explanation: Default outbound IPs are not controlled by you, and default outbound access is being retired for new VNets.
  - id: C
    text: Azure Bastion
    explanation: Bastion is for admin access, not outbound traffic.
  - id: D
    text: Another internal load balancer
    explanation: Internal load balancers do not provide internet egress.
  correct: [A]
  explanation: A NAT gateway on the subnet gives predictable public outbound IPs for all VMs and takes precedence over other outbound methods.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/nat-gateway/nat-overview
  - https://learn.microsoft.com/azure/load-balancer/load-balancer-outbound-connections

- id: 128
  domain: virtual-networking
  topic: dns-and-load-balancing
  type: single
  text: |-
    You must load balance Azure VMs and check health with HTTP status codes. You run this command:

        az network lb probe create -g rg1 --lb-name lb1 -n p1 --protocol tcp --port 80

    The web service on a VM hangs but its port 80 is still open and accepts connections. What will the load balancer do?
  options:
  - id: A
    text: Mark the VM unhealthy because the HTTP response is slow
    explanation: A TCP probe does not check HTTP.
  - id: B
    text: Keep the VM healthy because a TCP probe only checks that the handshake succeeds
    explanation: The probe succeeds as the port accepts connections; use an HTTP/HTTPS probe for application health.
  - id: C
    text: Remove the VM from the backend pool permanently
    explanation: Probe failures only temporarily stop new flows to an instance.
  - id: D
    text: Restart the VM
    explanation: Load balancers do not restart VMs.
  correct: [B]
  explanation: TCP probes only validate the TCP handshake. Use an HTTP or HTTPS probe with a path to detect application-level failures.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/load-balancer/load-balancer-custom-probe-overview
  - https://learn.microsoft.com/azure/load-balancer/load-balancer-faqs
- id: 129
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: >-
    Your company must retain Azure subscription Activity log entries for 2 years and query them with KQL together with
    other operational data. What should you configure?
  options:
  - id: A
    text: A diagnostic setting on the subscription that sends the Activity log to a Log Analytics workspace with 2-year retention
    explanation: Correct. Subscription diagnostic settings can route the Activity log to a workspace, where KQL queries and configurable retention are available.
  - id: B
    text: An alert rule on the Activity log with an action group
    explanation: Alert rules notify on events; they do not retain data for querying.
  - id: C
    text: Azure Monitor metrics with the default retention period
    explanation: Metrics are numeric platform data retained for 93 days; the Activity log is not a metric.
  - id: D
    text: Connection Monitor in Network Watcher
    explanation: Connection Monitor tests network connectivity and has nothing to do with Activity log retention.
  correct: [A]
  explanation: Activity log entries are kept for 90 days by default. To keep them longer and query with KQL, create a diagnostic setting that sends them to a Log Analytics workspace (or a storage account for archive).
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/azure-monitor/essentials/activity-log
  - https://learn.microsoft.com/azure/azure-monitor/essentials/diagnostic-settings

- id: 130
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: >-
    You need to be emailed and receive an SMS when the average CPU percentage of a virtual machine exceeds 85 percent
    for 10 minutes. Which two resources should you create?
  options:
  - id: A
    text: A log search alert rule and a diagnostic setting
    explanation: CPU percentage is a platform metric; a diagnostic setting is not needed for this notification.
  - id: B
    text: A metric alert rule and an action group
    explanation: Correct. The metric alert evaluates Percentage CPU, and the action group delivers email and SMS notifications.
  - id: C
    text: An activity log alert and a Logic App
    explanation: Activity log alerts fire on control-plane events, not on CPU utilization.
  - id: D
    text: A service health alert and an alert processing rule
    explanation: Service health alerts cover Azure platform incidents; processing rules modify alerts rather than define the condition.
  correct: [B]
  explanation: A metric alert rule defines the signal, aggregation, threshold and window. The action group defines the notification channels (email, SMS, voice, webhook, and so on).
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-types
  - https://learn.microsoft.com/azure/azure-monitor/alerts/action-groups

- id: 131
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: |-
    Virtual machines send heartbeat data to a Log Analytics workspace. You want a query that lists computers that have
    not sent a heartbeat in the last 15 minutes. Which query should you use?
  options:
  - id: A
    text: |-
      Heartbeat
      | where TimeGenerated > ago(15m)
      | distinct Computer
    explanation: This lists computers that DID send a heartbeat recently, the opposite of the requirement.
  - id: B
    text: |-
      Heartbeat
      | summarize count() by Computer
      | where count_ < 15
    explanation: This counts records over the whole query time range and does not test for recency.
  - id: C
    text: |-
      Heartbeat
      | summarize LastBeat = max(TimeGenerated) by Computer
      | where LastBeat < ago(15m)
    explanation: Correct. It finds the latest heartbeat per computer and keeps those older than 15 minutes.
  - id: D
    text: |-
      Heartbeat
      | project Computer, TimeGenerated
      | where TimeGenerated == ago(15m)
    explanation: An exact-timestamp equality match will almost never return rows and does not aggregate per computer.
  correct: [C]
  explanation: Summarize the maximum TimeGenerated per computer, then filter for values older than 15 minutes. This pattern is commonly used in log search alert rules for missing heartbeats.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-monitor/logs/get-started-queries
  - https://learn.microsoft.com/azure/azure-monitor/reference/tables/heartbeat

- id: 132
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: >-
    Users report that VM1 cannot reach a database on VM2 on TCP port 1433 in the same virtual network. You suspect a
    network security group (NSG) rule. Which Network Watcher feature identifies the specific rule that is blocking the
    traffic?
  options:
  - id: A
    text: Next hop
    explanation: Next hop shows the routing target, not NSG rule evaluation.
  - id: B
    text: Packet capture
    explanation: Packet capture records traffic on a VM but does not name the NSG rule that denies it.
  - id: C
    text: Topology
    explanation: Topology only visualizes resources and their relationships.
  - id: D
    text: IP flow verify
    explanation: Correct. It checks whether a packet is allowed or denied for a VM NIC and returns the name of the NSG rule responsible.
  correct: [D]
  explanation: IP flow verify takes the 5-tuple (direction, protocol, local/remote IP and port) and reports allow/deny plus the matching security rule.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/network-watcher/ip-flow-verify-overview

- id: 133
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: >-
    You need continuous monitoring of latency and packet loss between an Azure VM and an on-premises server reachable
    over ExpressRoute, with an alert when round-trip time exceeds a threshold. Which solution should you use?
  options:
  - id: A
    text: Connection Monitor in Azure Network Watcher
    explanation: Correct. Connection Monitor provides continuous end-to-end connectivity checks with latency and checks-failed metrics that can drive alerts. The on-premises endpoint requires the Azure Monitor Agent.
  - id: B
    text: NSG flow logs
    explanation: Flow logs record traffic flows through an NSG; they do not measure latency probes.
  - id: C
    text: Connection troubleshoot
    explanation: Connection troubleshoot is a one-time diagnostic, not continuous monitoring.
  - id: D
    text: VPN diagnostics
    explanation: VPN diagnostics troubleshoots VPN gateways, not ExpressRoute paths between a VM and a server.
  correct: [A]
  explanation: Connection Monitor runs ongoing tests (TCP, ICMP, HTTP) between sources and destinations, including hybrid endpoints, and exposes metrics such as RoundTripTimeMs and ChecksFailedPercent for alerting.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/network-watcher/connection-monitor-overview

- id: 134
  domain: monitor-maintain
  topic: azure-monitor
  type: multiple
  text: >-
    You enable VM insights on several Windows VMs and want to see process-level dependencies and connections between
    the VMs on the Map view. Choose 2. Which two components must be deployed to the VMs?
  options:
  - id: A
    text: Log Analytics gateway
    explanation: The gateway is a proxy for disconnected agents and is not a VM insights requirement.
  - id: B
    text: Azure Monitor Agent
    explanation: Correct. VM insights uses AMA with a data collection rule to collect performance data.
  - id: C
    text: Network Watcher agent extension
    explanation: This extension supports Network Watcher features such as packet capture, not VM insights Map.
  - id: D
    text: Dependency agent
    explanation: Correct. The Dependency agent collects process and connection data used by the Map feature.
  correct: [B, D]
  explanation: VM insights performance charts need Azure Monitor Agent; the Map feature additionally requires the Dependency agent (enabled through the "Processes and dependencies (Map)" option).
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/azure-monitor/vm/vminsights-overview
  - https://learn.microsoft.com/azure/azure-monitor/vm/vminsights-enable-overview

- id: 135
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: >-
    A blob in storage account st1 was deleted unexpectedly. You must determine which caller deleted it. Which
    configuration lets you investigate this afterwards?
  options:
  - id: A
    text: Enable storage account capacity metrics only
    explanation: Metrics show aggregate numbers, not the identity of the caller.
  - id: B
    text: Create a diagnostic setting on the blob service that sends StorageDelete logs to a Log Analytics workspace
    explanation: Correct. Resource logs record each request, including operation, caller identity or IP, and can be queried with KQL in StorageBlobLogs.
  - id: C
    text: Enable Storage insights without any diagnostic setting
    explanation: Storage insights relies on metrics (and logs only if configured); it does not by itself record per-request callers.
  - id: D
    text: Configure an Activity log alert for Microsoft.Storage/storageAccounts/write
    explanation: This captures account configuration changes, not data-plane blob deletions.
  correct: [B]
  explanation: Blob deletions are data-plane operations. Only resource logs (StorageDelete category) sent through a diagnostic setting record who performed them. This must be enabled before the event occurs.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/storage/blobs/monitor-blob-storage

- id: 136
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: |-
    Azure Firewall logs are stored in a Log Analytics workspace in resource-specific tables. You run this query:

        AzureDiagnostics
        | where Category == "AzureFirewallNetworkRule"
        | summarize Hits = count() by bin(TimeGenerated, 1h)

    The query returns no rows, although the firewall is processing traffic. What is the most likely cause?
  options:
  - id: A
    text: The workspace retention period is too short
    explanation: Shorter retention would still leave recent data visible.
  - id: B
    text: Azure Firewall cannot send logs to Log Analytics
    explanation: It can, through a diagnostic setting.
  - id: C
    text: The diagnostic setting uses resource-specific destination tables, so the data is in AZFWNetworkRule instead of AzureDiagnostics
    explanation: Correct. With resource-specific mode, logs go to dedicated tables such as AZFWNetworkRule.
  - id: D
    text: The bin() function is not supported in summarize
    explanation: bin() is a standard KQL function for time bucketing.
  correct: [C]
  explanation: A diagnostic setting can send data to the legacy AzureDiagnostics table or to resource-specific tables. The query must target the table that actually contains the data.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/azure-monitor/essentials/resource-logs
  - https://learn.microsoft.com/azure/firewall/monitor-firewall

- id: 137
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: >-
    Every Saturday from 22:00 to 02:00 your team performs maintenance on production VMs in resource group RG-Prod.
    During this window you do not want any notifications from existing alert rules, but alerts must still be recorded.
    What should you create?
  options:
  - id: A
    text: Disable all alert rules in RG-Prod each week
    explanation: Disabling rules means alerts are not fired or recorded and requires manual effort.
  - id: B
    text: Delete the action groups and recreate them after maintenance
    explanation: Error-prone and not recurring; also affects other rules sharing the action groups.
  - id: C
    text: A new alert rule with a dynamic threshold
    explanation: Dynamic thresholds adapt to patterns but do not suppress notifications on a schedule.
  - id: D
    text: An alert processing rule scoped to RG-Prod with a recurring schedule that suppresses notifications
    explanation: Correct. Alert processing rules can suppress action groups on a one-time or recurring schedule while alerts still fire and are stored.
  correct: [D]
  explanation: Alert processing rules (formerly action rules) modify fired alerts, for example suppressing notifications during planned maintenance, without changing the alert rules themselves.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-processing-rules

- id: 138
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: |-
    You must alert when more than 5 failed sign-in events (Event ID 4625) occur on any Windows server within 10
    minutes. The events are collected in a Log Analytics workspace by using a data collection rule. Which alert type
    should you use?
  options:
  - id: A
    text: A log search alert rule that runs a KQL query against the Event table
    explanation: Correct. Log search alerts run a scheduled KQL query (for example, Event | where EventID == 4625), with evaluation frequency and lookback, and fire based on a result count threshold.
  - id: B
    text: A metric alert rule on the Percentage CPU metric
    explanation: CPU is unrelated to event log entries.
  - id: C
    text: A service health alert
    explanation: Service health alerts relate to Azure platform incidents.
  - id: D
    text: An Activity log alert on Microsoft.Compute/virtualMachines/write
    explanation: This fires on VM configuration changes, not guest OS events.
  correct: [A]
  explanation: Guest OS events stored in Log Analytics are alerted on with log search alert rules, which evaluate a KQL query on a schedule and compare the result to a threshold.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-create-log-alert-rule

- id: 139
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: >-
    You deploy a data collection rule (DCR) to collect Syslog and performance counters from 200 Linux VMs. The VMs
    run in several subscriptions. What is the recommended way to apply the DCR at scale and ensure new VMs are covered
    automatically?
  options:
  - id: A
    text: Install the legacy Log Analytics agent on each VM and edit the workspace Agents configuration
    explanation: The legacy agent is deprecated and not DCR-based.
  - id: B
    text: Use Azure Policy to deploy Azure Monitor Agent and associate the DCR with VMs
    explanation: Correct. Built-in policy initiatives install AMA and create DCR associations for existing and new VMs.
  - id: C
    text: Enable boot diagnostics on each VM
    explanation: Boot diagnostics captures console output and screenshots, not Syslog or counters.
  - id: D
    text: Create a diagnostic setting for every VM that targets the workspace
    explanation: Diagnostic settings do not collect guest OS data.
  correct: [B]
  explanation: Azure Monitor Agent is configured through data collection rules associated with VMs. Azure Policy can deploy the agent and associations automatically across scopes.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/azure-monitor/agents/azure-monitor-agent-overview
  - https://learn.microsoft.com/azure/azure-monitor/essentials/data-collection-rule-overview

- id: 140
  domain: monitor-maintain
  topic: azure-monitor
  type: single
  text: >-
    A metric alert for a web app should adapt automatically to normal weekly traffic patterns rather than use a fixed
    value. Which setting should you choose when configuring the condition?
  options:
  - id: A
    text: Static threshold with a Greater than operator
    explanation: A static threshold uses a fixed value you specify.
  - id: B
    text: Aggregation granularity of 1 day
    explanation: Granularity defines the time bucket, not adaptive learning.
  - id: C
    text: Dynamic thresholds
    explanation: Correct. Dynamic thresholds use machine learning on historical metric data to calculate thresholds that account for seasonality.
  - id: D
    text: Number of violations set to 1
    explanation: This controls how many evaluation periods must breach the threshold, not how the threshold is computed.
  correct: [C]
  explanation: Dynamic thresholds learn the metric's historical behavior, including hourly, daily and weekly seasonality, and set thresholds automatically.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-dynamic-thresholds

- id: 141
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    You back up Azure VMs to a Recovery Services vault. A user's restore request must be completed using the
    snapshot taken earlier today without waiting for data transfer from the vault. Which feature makes this possible?
  options:
  - id: A
    text: Cross Region Restore
    explanation: Cross Region Restore restores into the paired region from the vault's secondary copy, which is slower.
  - id: B
    text: Soft delete
    explanation: Soft delete protects deleted backup data; it does not speed up restores.
  - id: C
    text: Backup reports
    explanation: Reports provide analytics only.
  - id: D
    text: Instant Restore using snapshot retention
    explanation: Correct. Azure VM backup keeps snapshots locally (1-5 days) so restores come from the snapshot, not the vault.
  correct: [D]
  explanation: Instant Restore retains recovery snapshots in the VM's resource group for the configured instant restore retention (1-5 days), allowing fast restores.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/backup/backup-instant-restore-capability

- id: 142
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    You must back up Azure Managed Disks and Azure Blobs. Which vault type should you create?
  options:
  - id: A
    text: Backup vault
    explanation: Correct. Backup vaults support newer workloads such as Azure Disks, Azure Blobs, Azure Database for PostgreSQL and Kubernetes.
  - id: B
    text: Recovery Services vault
    explanation: Recovery Services vaults support Azure VMs, SQL/SAP HANA in VMs, Azure Files, MARS and MABS, and also host Site Recovery, but not disk or blob backup.
  - id: C
    text: Azure Site Recovery vault only
    explanation: Site Recovery is a feature of Recovery Services vaults and does not perform backup.
  - id: D
    text: Log Analytics workspace
    explanation: A workspace stores logs and cannot hold backups.
  correct: [A]
  explanation: Azure Disk and Azure Blob backup use Backup vaults. Recovery Services vaults cover the other workloads, including VMs, Azure Files and on-premises via MARS/MABS.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/backup/backup-vault-overview
  - https://learn.microsoft.com/azure/backup/backup-azure-recovery-services-vault-overview

- id: 143
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    You must recover from a regional outage by restoring backed-up VMs in the paired region. The Recovery Services
    vault is currently configured with locally-redundant storage and already protects 10 VMs. What should you do?
  options:
  - id: A
    text: Enable Cross Region Restore on the existing vault
    explanation: Cross Region Restore requires GRS storage redundancy.
  - id: B
    text: Create a new GRS vault with Cross Region Restore enabled and protect the VMs there
    explanation: Correct. Redundancy cannot be changed once items are protected, so use a new GRS vault and enable Cross Region Restore.
  - id: C
    text: Change the vault redundancy to GRS in the vault properties
    explanation: Redundancy can only be changed when no items are protected in the vault.
  - id: D
    text: Run a test failover in Azure Site Recovery
    explanation: Site Recovery needs replication configured and is a different service from backup restore.
  correct: [B]
  explanation: Storage replication type (LRS, ZRS, GRS) is locked once backup items exist. GRS with Cross Region Restore enables restores in the secondary region.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/backup/backup-create-recovery-services-vault
  - https://learn.microsoft.com/azure/backup/backup-azure-arm-restore-vms

- id: 144
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    An administrator accidentally deleted backup data for a production VM from a Recovery Services vault with default
    settings. The backup data must be recoverable. What default protection helps?
  options:
  - id: A
    text: The data is permanently deleted immediately
    explanation: Not with soft delete enabled, which is the default.
  - id: B
    text: Data can be recovered only from a different subscription
    explanation: No such requirement exists.
  - id: C
    text: Soft delete retains the deleted backup data for 14 days, so you can undelete it
    explanation: Correct. Soft delete is enabled by default and retains deleted data for 14 days at no cost.
  - id: D
    text: The vault Activity log contains a copy of the backup
    explanation: Activity log records operations, not backup data.
  correct: [C]
  explanation: Soft delete lets you recover backup data for 14 days after deletion by undeleting the item and resuming protection.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/backup/backup-azure-security-feature-cloud

- id: 145
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    You must back up files and folders from an on-premises Windows Server directly to Azure without deploying System
    Center DPM or Azure Backup Server. What should you install?
  options:
  - id: A
    text: Azure Site Recovery Mobility service
    explanation: The Mobility service replicates machines for disaster recovery, not file backup.
  - id: B
    text: Azure File Sync agent
    explanation: File Sync syncs shares to Azure Files; it is not a backup agent.
  - id: C
    text: Azure Monitor Agent
    explanation: AMA collects monitoring data, not backups.
  - id: D
    text: Microsoft Azure Recovery Services (MARS) agent
    explanation: Correct. The MARS agent backs up files, folders and system state to a Recovery Services vault.
  correct: [D]
  explanation: The MARS agent is installed on the server and registered with a Recovery Services vault using vault credentials to back up files, folders and system state.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/backup/backup-azure-about-mars

- id: 146
  domain: monitor-maintain
  topic: backup-and-recovery
  type: multiple
  text: >-
    You plan to use Azure Site Recovery to protect Azure VMs in East US by replicating them to West US. Choose 2.
    Which two actions are required or supported as part of this configuration?
  options:
  - id: A
    text: Create a Recovery Services vault in the target region
    explanation: Correct. For Azure-to-Azure replication, the vault resides in the target (recovery) region.
  - id: B
    text: Install the MARS agent on each VM
    explanation: MARS is for Azure Backup of files and folders, not Site Recovery.
  - id: C
    text: Create a recovery plan to orchestrate failover order and run a test failover in an isolated network
    explanation: Correct. Recovery plans group and sequence VMs, and test failover validates DR without affecting production.
  - id: D
    text: Stop the source VMs during initial replication
    explanation: Replication runs while VMs stay online.
  correct: [A, C]
  explanation: Azure-to-Azure Site Recovery needs a Recovery Services vault in the target region, and the Site Recovery extension is installed automatically. Recovery plans and test failovers validate DR readiness.
  difficulty: hard
  references:
  - https://learn.microsoft.com/azure/site-recovery/azure-to-azure-tutorial-enable-replication
  - https://learn.microsoft.com/azure/site-recovery/recovery-plan-overview

- id: 147
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    You must validate your disaster recovery plan for Azure VMs protected by Site Recovery without impacting
    production workloads or ongoing replication. What should you perform?
  options:
  - id: A
    text: A test failover to an isolated virtual network
    explanation: Correct. A test failover creates VMs in the target region from a recovery point without affecting source VMs or replication.
  - id: B
    text: An unplanned failover
    explanation: Unplanned failover is a real DR event and impacts production.
  - id: C
    text: A reprotect operation
    explanation: Reprotect reverses replication after a failover and is not a validation step.
  - id: D
    text: Disable replication and re-enable it
    explanation: This removes the replication state and is disruptive.
  correct: [A]
  explanation: Test failover is a non-disruptive DR drill. After the test, you clean up the test failover to delete the test VMs.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/site-recovery/site-recovery-test-failover-to-azure

- id: 148
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    A restored VM must replace a corrupted production VM while keeping the same name and network configuration,
    and the OS and data disks should be swapped in place. Which restore option should you choose in the Recovery
    Services vault?
  options:
  - id: A
    text: Create new virtual machine
    explanation: This makes a separate VM, requiring manual re-pointing and cleanup.
  - id: B
    text: Replace existing
    explanation: Correct. Replace existing replaces the disks of the current VM with those from the recovery point, keeping the VM configuration.
  - id: C
    text: Restore disks and attach manually through a template
    explanation: This is a more manual option, not an in-place disk replacement.
  - id: D
    text: Cross Region Restore
    explanation: This restores into the secondary region, not in place.
  correct: [B]
  explanation: Replace existing swaps the VM's disks with disks from the selected recovery point, which preserves the VM's identity and configuration.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/backup/backup-azure-arm-restore-vms

- id: 149
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    You want a consolidated view of backup job success rates, storage consumption and policy adherence across
    multiple vaults and subscriptions. What should you configure?
  options:
  - id: A
    text: Network Watcher topology
    explanation: Topology shows network resources.
  - id: B
    text: Azure Advisor recommendations only
    explanation: Advisor provides general recommendations, not detailed backup reporting.
  - id: C
    text: Backup reports by sending vault diagnostic data to a Log Analytics workspace
    explanation: Correct. Backup reports use Azure Monitor Logs data from vaults' diagnostic settings and show cross-vault, cross-subscription analytics.
  - id: D
    text: A storage account lifecycle management policy
    explanation: Lifecycle policies move blobs between tiers and are unrelated.
  correct: [C]
  explanation: Backup reports require diagnostic settings on the vaults to send data (resource-specific tables) to a Log Analytics workspace; the reports workbook then aggregates across vaults and subscriptions.
  difficulty: medium
  references:
  - https://learn.microsoft.com/azure/backup/configure-reports

- id: 150
  domain: monitor-maintain
  topic: backup-and-recovery
  type: single
  text: >-
    You need to be notified when an Azure VM backup job fails in a Recovery Services vault. Which approach is
    recommended?
  options:
  - id: A
    text: Create a scheduled runbook that queries VMs each night
    explanation: This is unnecessary custom work.
  - id: B
    text: Check the vault's Backup items blade daily
    explanation: Manual and not a notification.
  - id: C
    text: Enable boot diagnostics on the VMs
    explanation: Boot diagnostics is unrelated to backup jobs.
  - id: D
    text: Use built-in Azure Monitor alerts for Azure Backup and attach an action group
    explanation: Correct. Backup job failures raise Azure Monitor alerts by default, and you can route them to an action group using alert processing rules.
  correct: [D]
  explanation: Azure Backup integrates with Azure Monitor alerts; critical alerts such as backup failures are generated by default, and notifications are configured via action groups.
  difficulty: easy
  references:
  - https://learn.microsoft.com/azure/backup/backup-azure-monitoring-built-in-monitor
