schema_version: 1
id: az-900
title: 'AZ-900 Mock Exam: Microsoft Azure Fundamentals'
description: 100 original questions across the three AZ-900 skill domains, generated from textbooks/az_900
  (edition 2).
source_note: Based on the AZ-900 skills measured as of July 20, 2026. Questions are original, drafted
  from the book and official Microsoft Learn docs; not yet human-reviewed.
language: en
pass_score_percent: 70
time_limit_minutes: 45
domains:
- id: cloud-concepts
  title: Cloud concepts
  weight: 25-30%
  topics:
  - id: what-is-cloud
    title: What cloud computing is
  - id: cloud-benefits
    title: Why organizations use the cloud
  - id: service-types
    title: 'Cloud service types: IaaS, PaaS, SaaS'
- id: azure-architecture-services
  title: Azure architecture and services
  weight: 35-40%
  topics:
  - id: core-architecture
    title: Azure's physical and organizational structure
  - id: compute-networking
    title: Compute and networking
  - id: storage
    title: Storage and data movement
  - id: identity-security
    title: Identity, access, and security
- id: management-governance
  title: Azure management and governance
  weight: 30-35%
  topics:
  - id: cost-management
    title: Costs in Azure
  - id: governance-compliance
    title: Governance and compliance
  - id: manage-deploy
    title: Managing and deploying resources
  - id: monitoring
    title: Monitoring and advice
questions:
- id: 1
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: A company wants to obtain compute capacity without first purchasing and installing physical servers.
    Which statement best describes cloud computing?
  options:
  - id: A
    text: It provides computing services such as compute, storage, and networking over the internet.
    explanation: Cloud computing makes computing capabilities available as services over the internet.
  - id: B
    text: It converts every desktop application into a browser-based application.
    explanation: A web interface is not a defining requirement of cloud computing.
  - id: C
    text: It requires an organization to own the datacenter that hosts its workloads.
    explanation: A cloud provider can operate the underlying datacenter and infrastructure.
  - id: D
    text: It is a method for eliminating all responsibility for an organization's data.
    explanation: Customers retain responsibilities for their data and applicable controls.
  correct:
  - A
  explanation: Cloud computing delivers technology capabilities as internet-accessible services instead
    of requiring customers to own all physical infrastructure.
  difficulty: easy
  tags:
  - objective:cc-define-cloud
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/3-what-cloud-compute
- id: 2
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: A team runs an application on an Azure virtual machine. Which responsibility is typically retained
    by the customer?
  options:
  - id: A
    text: Maintaining the physical server chassis in the Azure datacenter.
    explanation: The cloud provider operates the physical hosts and datacenter facilities.
  - id: B
    text: Patching the guest operating system running in the virtual machine.
    explanation: With IaaS virtual machines, the customer manages the guest operating system.
  - id: C
    text: Replacing failed physical network hardware in the provider's datacenter.
    explanation: Physical network hardware is operated by the cloud provider.
  - id: D
    text: Securing the building that contains the provider's servers.
    explanation: Physical datacenter security is a provider responsibility.
  correct:
  - B
  explanation: The shared responsibility boundary for an IaaS virtual machine leaves the guest operating
    system with the customer.
  difficulty: medium
  tags:
  - objective:cc-shared-responsibility
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/4-describe-shared-responsibility-model
- id: 3
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: Which cloud deployment model connects an organization's private environment with public-cloud
    resources so workloads can use both?
  options:
  - id: A
    text: Public cloud
    explanation: Public cloud provides provider-operated resources but does not itself mean a private
      environment is connected.
  - id: B
    text: Private cloud
    explanation: A private cloud is dedicated to one organization, without necessarily using public-cloud
      resources.
  - id: C
    text: Hybrid cloud
    explanation: Hybrid cloud combines connected private and public cloud environments.
  - id: D
    text: Serverless cloud
    explanation: Serverless is an execution approach, not a deployment model.
  correct:
  - C
  explanation: A hybrid cloud design uses public and private environments together, allowing workloads
    and data to be placed according to requirements.
  difficulty: easy
  tags:
  - objective:cc-cloud-models
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models
- id: 4
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: A manufacturer must keep a legacy workload in a dedicated private environment but wants to use
    public-cloud capacity for short seasonal demand peaks. Which deployment model is the best fit?
  options:
  - id: A
    text: Private cloud only
    explanation: A private-only design does not use public-cloud capacity for the peaks.
  - id: B
    text: Public cloud only
    explanation: A public-only design does not retain the workload in the required private environment.
  - id: C
    text: Software as a Service
    explanation: SaaS is a service model, not a deployment model for connecting private and public environments.
  - id: D
    text: Hybrid cloud
    explanation: Hybrid cloud supports using private resources alongside public-cloud capacity.
  correct:
  - D
  explanation: The scenario requires both a private environment and public-cloud resources, which is a
    hybrid-cloud use case.
  difficulty: medium
  tags:
  - objective:cc-cloud-model-use-cases
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models
- id: 5
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: What is a key characteristic of the consumption-based model for cloud services?
  options:
  - id: A
    text: Charges are based on measured service use rather than buying all capacity in advance.
    explanation: Consumption-based billing relates charges to the services and capacity consumed.
  - id: B
    text: Costs are fixed permanently when an Azure subscription is created.
    explanation: Consumption charges can vary with use and configuration.
  - id: C
    text: Capacity cannot be removed after it is provisioned.
    explanation: Cloud resources can commonly be reduced or removed when they are no longer needed.
  - id: D
    text: Every workload is free when it is idle.
    explanation: Billing behavior is service-specific; consumption billing does not make every idle resource
      free.
  correct:
  - A
  explanation: Consumption-based cloud services allow customers to provision capacity as needed and pay
    according to measured usage.
  difficulty: easy
  tags:
  - objective:cc-consumption-model
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model
- id: 6
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: An organization purchases and maintains its own datacenter servers. How is that spending commonly
    classified when compared with metered cloud-service charges?
  options:
  - id: A
    text: The server purchase is operational expenditure, while metered cloud use is capital expenditure.
    explanation: This reverses the common CapEx and OpEx distinction.
  - id: B
    text: The server purchase is capital expenditure, while metered cloud use is operational expenditure.
    explanation: Buying physical infrastructure is commonly CapEx; metered service consumption is commonly
      OpEx.
  - id: C
    text: Both are always classified as capital expenditure.
    explanation: Metered cloud charges are commonly treated as operating expenses.
  - id: D
    text: Both are always classified as operational expenditure.
    explanation: Purchasing long-lived physical infrastructure is commonly capital expenditure.
  correct:
  - B
  explanation: CapEx generally refers to upfront infrastructure investment, whereas pay-as-you-go cloud
    consumption is commonly treated as OpEx.
  difficulty: medium
  tags:
  - objective:cc-pricing-models
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
- id: 7
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: A developer wants code to run in response to a new file being uploaded, without managing the servers
    that host the code. Which approach best fits?
  options:
  - id: A
    text: A private-cloud deployment model
    explanation: Private cloud describes an environment, not event-driven execution with provider-managed
      servers.
  - id: B
    text: A reservation pricing commitment
    explanation: A reservation is a pricing option, not an execution approach.
  - id: C
    text: Serverless computing
    explanation: Serverless can run event-driven code while the provider manages much of the server infrastructure.
  - id: D
    text: Horizontal scaling of a customer-managed virtual machine
    explanation: Scaling VMs still leaves the customer managing those virtual machines and does not specifically
      describe event-driven code.
  correct:
  - C
  explanation: Serverless computing is suited to event-driven execution, such as responding to a file
    upload, while abstracting much of the server operation.
  difficulty: medium
  tags:
  - objective:cc-serverless
  references:
  - https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
- id: 8
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: Which statement correctly distinguishes a public cloud from a private cloud?
  options:
  - id: A
    text: Public cloud can only host SaaS, whereas private cloud can only host IaaS.
    explanation: Deployment models do not restrict environments to those service types.
  - id: B
    text: Private cloud cannot be hosted by a third party.
    explanation: A private cloud can be hosted on-site or by a third party.
  - id: C
    text: Public cloud requires customers to operate the provider's physical hosts.
    explanation: The provider operates its physical infrastructure in a public cloud.
  - id: D
    text: Private cloud is dedicated to one organization, whereas public cloud resources are offered by
      a third-party provider to customers.
    explanation: This describes the key organizational distinction between the models.
  correct:
  - D
  explanation: A private cloud is dedicated to a single organization; a public cloud provider makes resources
    available to customers.
  difficulty: medium
  tags:
  - objective:cc-cloud-models
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/5-define-cloud-models
- id: 9
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: Why might an organization choose a reservation for qualifying, stable cloud usage?
  options:
  - id: A
    text: It can provide a discount for matching committed usage over a defined term.
    explanation: Reservations can discount qualifying matching usage when the commitment suits the workload.
  - id: B
    text: It guarantees that every Azure service has no charge.
    explanation: Reservations apply only to eligible services and qualifying usage; they do not eliminate
      all charges.
  - id: C
    text: It transfers responsibility for application configuration to the provider.
    explanation: A pricing choice does not change operational responsibilities.
  - id: D
    text: It automatically converts a private cloud into a hybrid cloud.
    explanation: Reservations do not determine the deployment model.
  correct:
  - A
  explanation: Reservations can suit predictable eligible demand because they commit to usage for a term
    in exchange for a discount on matching usage.
  difficulty: hard
  tags:
  - objective:cc-pricing-models
  references:
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
- id: 10
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: A workload is moved from an on-premises datacenter to cloud virtual machines. Which task remains
    the customer's responsibility?
  options:
  - id: A
    text: Operating the provider's physical cooling systems.
    explanation: Physical facilities are operated by the cloud provider.
  - id: B
    text: Protecting the workload's data and configuring the controls the customer manages.
    explanation: Customers remain responsible for their data and applicable workload configuration.
  - id: C
    text: Replacing failed provider-owned server racks.
    explanation: Provider-owned physical hardware is operated by the provider.
  - id: D
    text: Maintaining the security of the provider's datacenter perimeter.
    explanation: Datacenter perimeter security is a provider responsibility.
  correct:
  - B
  explanation: Cloud adoption changes the responsibility boundary, but customers still protect data and
    configure the parts of the workload they control.
  difficulty: medium
  tags:
  - objective:cc-shared-responsibility
  references:
  - https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility
- id: 11
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: Which statement about cloud costs is most accurate?
  options:
  - id: A
    text: Consumption-based billing guarantees that every cloud deployment costs less than on-premises
      infrastructure.
    explanation: Actual cost depends on use, configuration, demand, and other factors.
  - id: B
    text: Consumption-based billing makes capacity planning unnecessary.
    explanation: Monitoring and deliberate capacity choices are still important.
  - id: C
    text: Unused resources or unexpectedly high demand can still create cloud costs.
    explanation: Measured-use pricing does not prevent waste or demand-driven charges.
  - id: D
    text: Cloud customers must buy enough capacity for their maximum future demand before deployment.
    explanation: Cloud capacity can often be added or removed as needs change.
  correct:
  - C
  explanation: The consumption model can reduce upfront investment, but costs still require monitoring
    because use and configuration affect charges.
  difficulty: medium
  tags:
  - objective:cc-consumption-model
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model
- id: 12
  domain: cloud-concepts
  topic: what-is-cloud
  type: single
  text: Which label describes how charges are calculated rather than where resources run or how much of
    the stack the provider manages?
  options:
  - id: A
    text: Hybrid cloud
    explanation: Hybrid is a deployment model.
  - id: B
    text: Platform as a Service
    explanation: PaaS is a service model.
  - id: C
    text: Private cloud
    explanation: Private is a deployment model.
  - id: D
    text: Pay-as-you-go
    explanation: Pay-as-you-go is a billing approach tied to consumption.
  correct:
  - D
  explanation: Deployment, service, and billing models answer different questions; pay-as-you-go concerns
    how usage is charged.
  difficulty: hard
  tags:
  - objective:cc-consumption-model
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-compute/6-describe-consumption-based-model
- id: 13
  domain: cloud-concepts
  topic: cloud-benefits
  type: single
  text: An application automatically adds identical instances during a traffic surge and removes them
    after demand falls. Which cloud capability is this?
  options:
  - id: A
    text: Elasticity
    explanation: Elasticity is the ability to adjust capacity as demand rises and falls.
  - id: B
    text: Vertical scaling
    explanation: Vertical scaling changes the capacity of one resource rather than the number of instances.
  - id: C
    text: Data governance
    explanation: Governance concerns policies and practices for aligned resource use.
  - id: D
    text: A service-level agreement
    explanation: An SLA is a commitment, not the mechanism for changing capacity.
  correct:
  - A
  explanation: Automatically scaling out and in as demand changes is elasticity.
  difficulty: easy
  tags:
  - objective:cc-ha-scalability
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
- id: 14
  domain: cloud-concepts
  topic: cloud-benefits
  type: single
  text: A team increases the size of one virtual machine to obtain more compute capacity. What type of
    scaling is this?
  options:
  - id: A
    text: Horizontal scaling
    explanation: Horizontal scaling changes the number of resource instances.
  - id: B
    text: Vertical scaling
    explanation: Vertical scaling changes the capacity of an individual resource.
  - id: C
    text: Elasticity
    explanation: Elasticity describes responding to demand by adjusting capacity, often automatically;
      the specific action here is vertical scaling.
  - id: D
    text: High availability
    explanation: High availability focuses on keeping a service usable through disruptions.
  correct:
  - B
  explanation: Selecting a more capable individual VM changes one resource's capacity, which is vertical
    scaling.
  difficulty: easy
  tags:
  - objective:cc-ha-scalability
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
- id: 15
  domain: cloud-concepts
  topic: cloud-benefits
  type: single
  text: A workload is designed to recover from component failures and continue its intended function.
    Which benefit is the design primarily addressing?
  options:
  - id: A
    text: Cost predictability
    explanation: Cost predictability concerns estimating and managing expenses.
  - id: B
    text: Horizontal scalability
    explanation: Horizontal scalability concerns changing the number of instances for demand.
  - id: C
    text: Reliability
    explanation: Reliability concerns recovery from failure and continued intended operation.
  - id: D
    text: Management in the cloud
    explanation: Management in the cloud refers to tools and interfaces used to administer resources.
  correct:
  - C
  explanation: Reliability is about a workload recovering from failures and continuing to provide its
    intended function.
  difficulty: medium
  tags:
  - objective:cc-reliability-predictability
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
- id: 16
  domain: cloud-concepts
  topic: cloud-benefits
  type: single
  text: Which practice most directly supports cost predictability for a planned cloud deployment?
  options:
  - id: A
    text: Assuming actual usage will always equal an initial estimate.
    explanation: Estimates are based on assumptions and actual demand can differ.
  - id: B
    text: Disabling usage monitoring after deployment.
    explanation: Monitoring helps compare usage and cost trends with expectations.
  - id: C
    text: Choosing a public-cloud deployment model for every workload.
    explanation: A deployment model alone does not make costs predictable.
  - id: D
    text: Estimating planned deployments, monitoring usage, and analyzing trends.
    explanation: Estimates, monitoring, and trend analysis support informed cost planning.
  correct:
  - D
  explanation: Cost predictability improves when teams estimate planned deployments and use actual usage
    information to manage and refine expectations.
  difficulty: medium
  tags:
  - objective:cc-reliability-predictability
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/overview-cost-management
- id: 17
  domain: cloud-concepts
  topic: cloud-benefits
  type: single
  text: An organization uses templates to deploy a standard configuration and audits deployments that
    differ from its baseline. Which cloud benefit is illustrated?
  options:
  - id: A
    text: Security and governance
    explanation: Standardized deployments and auditing support consistent controls and governance.
  - id: B
    text: Serverless execution
    explanation: Serverless concerns running code while the provider manages much of the infrastructure.
  - id: C
    text: Vertical scaling
    explanation: Vertical scaling changes the size of an individual resource.
  - id: D
    text: A private-cloud deployment
    explanation: The scenario describes control practices, not a specific deployment model.
  correct:
  - A
  explanation: Templates and auditing can help organizations apply and assess security and governance
    requirements consistently.
  difficulty: medium
  tags:
  - objective:cc-security-governance
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/4-security-governance-cloud
- id: 18
  domain: cloud-concepts
  topic: cloud-benefits
  type: single
  text: Which activity is an example of management of the cloud rather than management in the cloud?
  options:
  - id: A
    text: Using a command-line interface to create a resource.
    explanation: Using an administration interface is management in the cloud.
  - id: B
    text: Automatically scaling application instances based on demand.
    explanation: Operating or automating resources themselves is management of the cloud.
  - id: C
    text: Signing in to a web portal to view a subscription.
    explanation: The web portal is a tool used for management in the cloud.
  - id: D
    text: Calling an API to list resource groups.
    explanation: Using an API is management in the cloud.
  correct:
  - B
  explanation: Management of the cloud includes operating and automating resources, such as scaling them
    in response to demand.
  difficulty: medium
  tags:
  - objective:cc-manageability
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/5-manageability-cloud
- id: 19
  domain: cloud-concepts
  topic: cloud-benefits
  type: single
  text: A service has been configured with redundant components, but its application cannot recover from
    a failed dependency. What does this show?
  options:
  - id: A
    text: Scalability automatically guarantees reliability.
    explanation: Capacity adjustment does not automatically provide failure recovery.
  - id: B
    text: An SLA eliminates the need for resilient design.
    explanation: An SLA is not a substitute for appropriate architecture and recovery planning.
  - id: C
    text: Cloud infrastructure alone does not ensure workload reliability.
    explanation: Application architecture, configuration, and recovery planning remain necessary.
  - id: D
    text: Redundancy can only be used in a private cloud.
    explanation: Redundancy is not restricted to private-cloud environments.
  correct:
  - C
  explanation: Reliability requires a workload design that can recover and continue functioning; cloud
    infrastructure by itself does not guarantee it.
  difficulty: hard
  tags:
  - objective:cc-reliability-predictability
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/3-reliability-predictability-cloud
- id: 20
  domain: cloud-concepts
  topic: cloud-benefits
  type: single
  text: Which statement about high availability is correct?
  options:
  - id: A
    text: It means a service can always process any amount of demand without scaling.
    explanation: Handling demand is a scalability concern and depends on service design and limits.
  - id: B
    text: It means every cloud workload is automatically protected from all failures.
    explanation: Availability requires suitable service selection, configuration, and recovery planning.
  - id: C
    text: It is the same as changing the size of a virtual machine.
    explanation: Changing a VM size is vertical scaling, not high availability.
  - id: D
    text: It is a design goal of keeping a service usable when failures or disruptions occur.
    explanation: High availability focuses on continued service access despite disruptions.
  correct:
  - D
  explanation: High availability is achieved through deliberate resilient design and appropriate configuration,
    not automatically by using cloud services.
  difficulty: medium
  tags:
  - objective:cc-ha-scalability
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-benefits-use-cloud-services/2-high-availability-scalability-cloud
- id: 21
  domain: cloud-concepts
  topic: service-types
  type: single
  text: A company needs to install a custom operating-system component for a legacy application but does
    not want to own physical servers. Which cloud service type best fits?
  options:
  - id: A
    text: Infrastructure as a Service (IaaS)
    explanation: IaaS provides infrastructure while leaving the customer substantial control over the
      guest OS.
  - id: B
    text: Platform as a Service (PaaS)
    explanation: PaaS is designed for provider-managed platform components rather than customer OS control.
  - id: C
    text: Software as a Service (SaaS)
    explanation: SaaS is a ready-to-use application, not a customizable guest operating system.
  - id: D
    text: Serverless computing
    explanation: Serverless is an execution approach and does not provide customer control of a guest
      OS.
  correct:
  - A
  explanation: IaaS is appropriate when the customer needs guest operating-system control while the provider
    operates the physical infrastructure.
  difficulty: medium
  tags:
  - objective:cc-iaas
  - objective:cc-service-type-use-cases
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
- id: 22
  domain: cloud-concepts
  topic: service-types
  type: single
  text: A development team wants to deploy its own web application code but does not want to patch or
    maintain the web server operating system. Which service type best fits?
  options:
  - id: A
    text: Infrastructure as a Service (IaaS)
    explanation: IaaS would leave the team with guest operating-system management.
  - id: B
    text: Platform as a Service (PaaS)
    explanation: PaaS provides a managed platform so the team can focus on code, data, and configuration.
  - id: C
    text: Software as a Service (SaaS)
    explanation: SaaS provides a finished application rather than a platform for the team's own application
      code.
  - id: D
    text: Private cloud
    explanation: Private cloud is a deployment model, not the service type that describes a managed application
      platform.
  correct:
  - B
  explanation: PaaS is suited to building and deploying applications while the provider manages the underlying
    platform components.
  difficulty: medium
  tags:
  - objective:cc-paas
  - objective:cc-service-type-use-cases
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
- id: 23
  domain: cloud-concepts
  topic: service-types
  type: single
  text: A business adopts a provider-operated email and collaboration application instead of building
    or operating its own mail system. Which service type is it using?
  options:
  - id: A
    text: Infrastructure as a Service (IaaS)
    explanation: IaaS supplies infrastructure for customer-managed workloads.
  - id: B
    text: Platform as a Service (PaaS)
    explanation: PaaS supplies a platform for customer-developed applications.
  - id: C
    text: Software as a Service (SaaS)
    explanation: SaaS provides a ready-to-use application operated by the provider.
  - id: D
    text: Hybrid cloud
    explanation: Hybrid cloud is a deployment model that combines public and private environments.
  correct:
  - C
  explanation: SaaS delivers a complete provider-operated application, such as email or productivity software.
  difficulty: easy
  tags:
  - objective:cc-saas
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
- id: 24
  domain: cloud-concepts
  topic: service-types
  type: single
  text: Which statement correctly compares IaaS, PaaS, and SaaS?
  options:
  - id: A
    text: IaaS always includes a provider-operated business application for users.
    explanation: A provider-operated ready-made application is characteristic of SaaS.
  - id: B
    text: PaaS requires customers to operate the physical datacenter.
    explanation: The provider operates the physical datacenter in PaaS.
  - id: C
    text: SaaS gives customers the most control over the guest operating system.
    explanation: IaaS provides more guest-OS control than SaaS.
  - id: D
    text: Moving from IaaS to PaaS to SaaS generally shifts more operation of the stack to the provider.
    explanation: Provider management increases across these service models, reducing customer infrastructure
      work.
  correct:
  - D
  explanation: The service models differ chiefly in how much of the technology stack the provider operates
    for the customer.
  difficulty: medium
  tags:
  - objective:cc-iaas
  - objective:cc-paas
  - objective:cc-saas
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/
- id: 25
  domain: cloud-concepts
  topic: service-types
  type: single
  text: In an IaaS virtual machine scenario, which component is primarily operated by the cloud provider?
  options:
  - id: A
    text: The physical hosts and datacenter infrastructure
    explanation: The provider operates the underlying physical infrastructure for IaaS.
  - id: B
    text: The customer's guest operating system
    explanation: The customer typically manages the guest operating system in IaaS.
  - id: C
    text: The customer's application configuration
    explanation: Application configuration remains part of the customer-managed workload.
  - id: D
    text: The customer's application code
    explanation: The customer manages its own application code in an IaaS workload.
  correct:
  - A
  explanation: IaaS shifts physical facilities, hosts, and underlying infrastructure to the provider while
    customers manage the guest workload.
  difficulty: medium
  tags:
  - objective:cc-iaas
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/2-describe-infrastructure-service
- id: 26
  domain: cloud-concepts
  topic: service-types
  type: single
  text: Which requirement most strongly indicates PaaS instead of IaaS?
  options:
  - id: A
    text: The team must install and patch a custom guest operating system.
    explanation: Guest OS control and patching point toward IaaS.
  - id: B
    text: The team wants the provider to manage the operating system and runtime while it deploys application
      code.
    explanation: Provider-managed platform components with customer application deployment characterize
      PaaS.
  - id: C
    text: The organization needs a finished application and will not deploy its own code.
    explanation: A complete provider-operated application points toward SaaS.
  - id: D
    text: The organization must combine a private environment with public-cloud resources.
    explanation: That requirement concerns the hybrid deployment model.
  correct:
  - B
  explanation: PaaS lets a team focus on its application while the provider operates the platform, including
    the OS and runtime.
  difficulty: medium
  tags:
  - objective:cc-paas
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/3-describe-platform-service
- id: 27
  domain: cloud-concepts
  topic: service-types
  type: single
  text: Which choice is the best example of SaaS?
  options:
  - id: A
    text: Leasing virtual machines and administering their guest operating systems.
    explanation: This is characteristic of IaaS.
  - id: B
    text: Deploying custom application code to a provider-managed runtime.
    explanation: This is characteristic of PaaS.
  - id: C
    text: Using a complete provider-operated application for business collaboration.
    explanation: A ready-to-use provider-operated application is SaaS.
  - id: D
    text: Connecting private infrastructure to public-cloud resources.
    explanation: This describes hybrid cloud, a deployment model.
  correct:
  - C
  explanation: SaaS provides a complete application for customers to use without operating the underlying
    application stack.
  difficulty: easy
  tags:
  - objective:cc-saas
  - objective:cc-service-type-use-cases
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/4-describe-software-service
- id: 28
  domain: cloud-concepts
  topic: service-types
  type: single
  text: A company uses SaaS for staff collaboration, PaaS for a new customer application, and IaaS for
    a legacy workload requiring OS-level configuration. What does this demonstrate?
  options:
  - id: A
    text: An organization must use exactly one cloud service type for every workload.
    explanation: Different workloads can appropriately use different service types.
  - id: B
    text: SaaS can be used only when an organization also uses a private cloud.
    explanation: SaaS does not require a private-cloud deployment.
  - id: C
    text: PaaS is a billing model that replaces IaaS and SaaS.
    explanation: PaaS is a service type, not a billing model or replacement requirement.
  - id: D
    text: Service types can be selected per workload according to the needed level of control and management.
    explanation: Organizations can combine IaaS, PaaS, and SaaS to suit different workload requirements.
  correct:
  - D
  explanation: Cloud service types are chosen based on each workload's requirements; one organization
    can use all three.
  difficulty: hard
  tags:
  - objective:cc-service-type-use-cases
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cloud-service-types/
- id: 29
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: A company must deploy an application close to users in a particular country and meet its data-residency
    requirements. Which Azure concept should it evaluate first when choosing the deployment location?
  options:
  - id: A
    text: An Azure region
    explanation: An Azure region is the geographic deployment location whose service availability, latency,
      residency options, and cost should be evaluated.
  - id: B
    text: A resource group
    explanation: A resource group is a management container, not a geographic deployment location.
  - id: C
    text: A management group
    explanation: A management group organizes subscriptions for governance rather than locating resources.
  - id: D
    text: An availability set
    explanation: An availability set distributes VMs for availability; it does not select a geographic
      location.
  correct:
  - A
  explanation: Regions are geographic areas containing Azure datacenters and are the starting point for
    location, latency, service-availability, and residency decisions.
  difficulty: medium
  tags:
  - objective:as-regions
  references:
  - https://learn.microsoft.com/en-us/azure/reliability/regions-paired
- id: 30
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: A web workload must remain available if one availability zone in its Azure region fails. Which
    design best addresses this requirement?
  options:
  - id: A
    text: Place one zonal VM in the selected zone
    explanation: A single zonal VM is isolated to one zone but is not resilient if that zone fails.
  - id: B
    text: Use a zone-redundant service or deploy zonal instances in multiple zones
    explanation: Zone-redundant services distribute work across zones, and multiple zonal instances can
      be designed to fail over.
  - id: C
    text: Put all resources in one resource group
    explanation: Resource-group membership does not provide physical fault isolation.
  - id: D
    text: Create a subscription in the paired region
    explanation: A subscription alone neither deploys resources nor provides zone-level resiliency.
  correct:
  - B
  explanation: Availability zones are physically separate groupings within a region. Zone redundancy or
    an architecture using multiple zones is required to survive a zone failure.
  difficulty: medium
  tags:
  - objective:as-availability-zones
  references:
  - https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
- id: 31
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: What is an Azure datacenter?
  options:
  - id: A
    text: A logical container that holds related Azure resources
    explanation: This describes a resource group.
  - id: B
    text: A billing and quota boundary for Azure resources
    explanation: This describes an Azure subscription.
  - id: C
    text: A physical facility that houses computing, networking, and storage hardware
    explanation: Datacenters are the physical facilities underpinning Azure cloud services.
  - id: D
    text: A private IP address assigned to a PaaS service
    explanation: This describes a private endpoint, not a datacenter.
  correct:
  - C
  explanation: Azure datacenters are physical facilities containing cloud infrastructure. Customers normally
    choose regions or service configurations rather than a specific building.
  difficulty: easy
  tags:
  - objective:as-datacenters
  references:
  - https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
- id: 32
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: A team wants one scope for applying tags, policies, access control, and lifecycle operations to
    the resources for a single application environment. What should it use?
  options:
  - id: A
    text: An availability zone
    explanation: An availability zone is a physical-fault-isolation concept, not a management scope.
  - id: B
    text: A virtual network
    explanation: A virtual network organizes network connectivity, but is not the general lifecycle container
      for all application resources.
  - id: C
    text: A management group
    explanation: A management group is intended to govern multiple subscriptions.
  - id: D
    text: A resource group
    explanation: A resource group is a logical container for resources managed together.
  correct:
  - D
  explanation: Resource groups provide a common management scope for related resources, including access
    control, policy, tags, monitoring, and lifecycle operations.
  difficulty: easy
  tags:
  - objective:as-resources-rgs
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-portal
- id: 33
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: Which Azure construct provides a boundary for billing arrangements, quotas, and governance policies
    for deployed resources?
  options:
  - id: A
    text: A subscription
    explanation: A subscription is associated with billing and provides scopes for quotas, access control,
      and governance.
  - id: B
    text: A tenant
    explanation: A Microsoft Entra tenant is an identity directory context, not the resource billing boundary.
  - id: C
    text: A region pair
    explanation: A region pair relates to geography and resilience behavior, not billing or quotas.
  - id: D
    text: A subnet
    explanation: A subnet segments an IP address space inside a virtual network.
  correct:
  - A
  explanation: Azure subscriptions organize deployments and provide billing-related, quota, access-control,
    and policy scopes.
  difficulty: easy
  tags:
  - objective:as-subscriptions
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
- id: 34
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: An enterprise needs to apply the same governance policy to production and development subscriptions
    without configuring each subscription separately. Which Azure scope should it use?
  options:
  - id: A
    text: A resource group
    explanation: A resource group can contain resources in one subscription only and cannot govern multiple
      subscriptions.
  - id: B
    text: A management group
    explanation: Policies and role assignments at a management group can be inherited by descendant subscriptions
      and resources.
  - id: C
    text: An availability zone
    explanation: Availability zones provide physical fault isolation, not governance inheritance.
  - id: D
    text: A private endpoint
    explanation: A private endpoint provides private connectivity to a supported service, not subscription
      governance.
  correct:
  - B
  explanation: Management groups sit above subscriptions and enable central governance across a portfolio
    of subscriptions.
  difficulty: medium
  tags:
  - objective:as-management-groups
  references:
  - https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
- id: 35
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: Which order correctly lists the Azure governance hierarchy from the broadest optional governance
    scope to an individual deployed item?
  options:
  - id: A
    text: Subscription, management group, resource group, resource
    explanation: Management groups are above subscriptions, not below them.
  - id: B
    text: Management group, resource group, subscription, resource
    explanation: Resource groups belong within subscriptions, so this order is incorrect.
  - id: C
    text: Management group, subscription, resource group, resource
    explanation: This is the correct parent-to-child organization hierarchy for these Azure scopes.
  - id: D
    text: Region, subscription, availability zone, resource group
    explanation: Regions and zones are placement concepts, not the governance hierarchy.
  correct:
  - C
  explanation: Management groups can contain subscriptions; subscriptions contain resource groups; and
    resource groups contain resources.
  difficulty: medium
  tags:
  - objective:as-resource-hierarchy
  references:
  - https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
- id: 36
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: A resource group is created with its metadata location set to West Europe. Which statement is
    true?
  options:
  - id: A
    text: Every resource in the group must be deployed in West Europe
    explanation: Resources in a resource group can be deployed in different regions.
  - id: B
    text: The group automatically replicates all resources to the paired region
    explanation: A resource group does not configure replication or failover.
  - id: C
    text: The group can contain only one Azure resource type
    explanation: A resource group can contain many related resource types.
  - id: D
    text: The group location stores resource-group metadata and does not force resource locations
    explanation: Resource-group metadata location is separate from the deployment region of its resources.
  correct:
  - D
  explanation: A resource group is a logical management container. Its location applies to its metadata,
    while contained resources can be in other Azure regions.
  difficulty: medium
  tags:
  - objective:as-resources-rgs
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-portal
- id: 37
  domain: azure-architecture-services
  topic: core-architecture
  type: single
  text: What should an architect assume after deploying a virtual machine in one member of an Azure region
    pair?
  options:
  - id: A
    text: The VM is not automatically copied or failed over to the paired region
    explanation: Region pairing can support service-level recovery strategies, but application replication
      and failover require explicit design.
  - id: B
    text: The VM is automatically replicated synchronously to the paired region
    explanation: Azure does not automatically replicate a deployed VM solely because its region is paired.
  - id: C
    text: The VM is automatically distributed across availability zones
    explanation: Region pairs and availability zones are distinct resilience concepts.
  - id: D
    text: The paired region becomes the billing scope for the VM
    explanation: Billing is associated with the subscription, not the paired region.
  correct:
  - A
  explanation: Region pairs can influence some Azure service recovery and update behavior, but they do
    not automatically deploy, replicate, or fail over an application.
  difficulty: hard
  tags:
  - objective:as-regions
  references:
  - https://learn.microsoft.com/en-us/azure/reliability/regions-paired
- id: 38
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: A developer needs code to run when a queue message arrives and does not want to manage guest operating
    systems. Which compute type is the best fit?
  options:
  - id: A
    text: An Azure virtual machine
    explanation: A VM provides guest-OS control but requires the customer to manage that operating system
      and software.
  - id: B
    text: Azure Functions
    explanation: Functions are designed for trigger- and event-driven code while Azure manages much of
      the execution infrastructure.
  - id: C
    text: An availability set
    explanation: An availability set is a VM availability configuration, not an execution service for
      event-driven code.
  - id: D
    text: Azure DNS
    explanation: Azure DNS resolves names and does not execute application code.
  correct:
  - B
  explanation: Azure Functions is a serverless, event-driven compute option appropriate for work initiated
    by triggers such as queue messages or timers.
  difficulty: easy
  tags:
  - objective:as-compute-types
  references:
  - https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
- id: 39
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: An application runs identically on multiple VMs and must add or remove instances as demand changes.
    Which Azure VM option is designed for this scenario?
  options:
  - id: A
    text: A single Azure virtual machine
    explanation: A standalone VM does not manage a group of instances or scale their count.
  - id: B
    text: An availability set
    explanation: An availability set distributes VMs across fault and update domains but is not a VM-count
      scaling service.
  - id: C
    text: A Virtual Machine Scale Set
    explanation: A scale set manages a group of VMs and can adjust instance count based on demand or schedules.
  - id: D
    text: Azure Virtual Desktop
    explanation: Azure Virtual Desktop provides desktop and app virtualization rather than general application-instance
      autoscaling.
  correct:
  - C
  explanation: Virtual Machine Scale Sets manage a collection of VMs and support scaling for workloads
    distributed across instances.
  difficulty: medium
  tags:
  - objective:as-vm-options
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview
- id: 40
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: A team has created a VM from an OS image. Which additional combination is fundamental for the
    VM to run and connect on an Azure network?
  options:
  - id: A
    text: A management group and Azure DNS zone
    explanation: These may assist governance or name resolution but do not provide the VM's basic network
      attachment and OS storage.
  - id: B
    text: A resource lock and an Azure Files share
    explanation: A lock protects a resource from management operations, and Azure Files is optional shared
      storage.
  - id: C
    text: A public endpoint and an ExpressRoute circuit
    explanation: Neither is required for a VM to run; a public endpoint also is not the VM's basic network
      interface.
  - id: D
    text: A virtual network, network interface, and OS disk
    explanation: A VM normally uses a VNet and NIC for network connectivity and an OS disk for its operating
      system.
  correct:
  - D
  explanation: VM deployments normally include an OS disk and network resources such as a virtual network
    and network interface; data disks and public IPs depend on the workload.
  difficulty: medium
  tags:
  - objective:as-vm-resources
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/overview
- id: 41
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: An organization wants to provide centrally managed Windows desktops and individual published applications
    to remote users. Which service is designed for this use case?
  options:
  - id: A
    text: Azure Virtual Desktop
    explanation: Azure Virtual Desktop delivers Windows desktops or RemoteApps to users from configured
      host pools.
  - id: B
    text: Azure App Service
    explanation: App Service is a managed platform for web applications and APIs, not a desktop virtualization
      service.
  - id: C
    text: Azure Container Apps
    explanation: Container Apps runs containerized applications rather than providing user desktops.
  - id: D
    text: Azure VPN Gateway
    explanation: VPN Gateway provides encrypted network connectivity and does not host desktops.
  correct:
  - A
  explanation: Azure Virtual Desktop is a desktop and application virtualization service for delivering
    Windows desktops or RemoteApps.
  difficulty: medium
  tags:
  - objective:as-vm-options
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-desktop/overview
- id: 42
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: A team is deploying a REST API using a supported runtime and wants Azure to handle most web-server
    administration. Which hosting option is most appropriate?
  options:
  - id: A
    text: An Azure virtual machine
    explanation: A VM can host the API but requires more guest-OS and server administration.
  - id: B
    text: Azure App Service
    explanation: App Service is a managed platform for web apps and REST APIs that abstracts much server
      administration.
  - id: C
    text: Azure Virtual Desktop
    explanation: Azure Virtual Desktop is for desktop and RemoteApp delivery.
  - id: D
    text: Azure Storage Queue
    explanation: Queue Storage holds asynchronous messages and does not host a REST API.
  correct:
  - B
  explanation: Azure App Service is a managed web-application platform suitable for supported web applications,
    mobile back ends, and REST APIs.
  difficulty: easy
  tags:
  - objective:as-app-hosting
  references:
  - https://learn.microsoft.com/en-us/azure/app-service/overview
- id: 43
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: What is the primary purpose of an Azure virtual network (VNet)?
  options:
  - id: A
    text: To apply a billing arrangement to related resources
    explanation: A subscription, not a VNet, provides the billing-related boundary.
  - id: B
    text: To store operating-system disks for VMs
    explanation: Managed disks provide VM block storage.
  - id: C
    text: To provide a logically isolated network boundary for Azure resources
    explanation: A VNet defines an address space and network boundary for resources and can be divided
      into subnets.
  - id: D
    text: To replicate blob data to another region
    explanation: Storage redundancy options, not VNets, replicate blob data.
  correct:
  - C
  explanation: A VNet is Azure's logical network boundary, with an IP address space that can be segmented
    into subnets and connected to other networks.
  difficulty: easy
  tags:
  - objective:as-vnet-subnets-peering
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
- id: 44
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: VNet A is peered with VNet B, and VNet B is peered with VNet C. What should the network team assume
    about connectivity from VNet A to VNet C?
  options:
  - id: A
    text: It is automatically available because peering merges all three VNets
    explanation: Peering does not merge VNets or automatically grant transit.
  - id: B
    text: It is available only if all three VNets are in the same resource group
    explanation: Resource-group membership does not make peering transitive.
  - id: C
    text: It is available only through Azure DNS
    explanation: DNS resolves names but does not create a transit route.
  - id: D
    text: It is not transitive by default and needs an appropriate routing design
    explanation: Peering A-to-B and B-to-C alone does not establish A-to-C connectivity.
  correct:
  - D
  explanation: VNet peering enables private-IP communication between the two peered VNets, but it is not
    transitive by default.
  difficulty: medium
  tags:
  - objective:as-vnet-subnets-peering
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
- id: 45
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: A private application must resolve an internal service name to an address reachable only from
    linked virtual networks. Which Azure capability is most relevant?
  options:
  - id: A
    text: Azure Private DNS
    explanation: Private DNS zones provide private name resolution for linked virtual networks.
  - id: B
    text: Azure VPN Gateway
    explanation: VPN Gateway provides encrypted connectivity but does not by itself host DNS records.
  - id: C
    text: Azure Virtual Machine Scale Sets
    explanation: Scale sets manage VM instances and do not resolve names.
  - id: D
    text: An availability set
    explanation: Availability sets improve VM fault/update-domain distribution, not name resolution.
  correct:
  - A
  explanation: DNS translates names to IP addresses. Azure Private DNS is used for private name resolution
    in virtual-network scenarios.
  difficulty: medium
  tags:
  - objective:as-dns-vpn-expressroute
  references:
  - https://learn.microsoft.com/en-us/azure/dns/dns-overview
- id: 46
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: An organization needs encrypted site-to-site connectivity between its on-premises network and
    an Azure VNet using tunnels over the public internet. Which service should it select?
  options:
  - id: A
    text: Azure ExpressRoute
    explanation: ExpressRoute uses a provider-backed private connection rather than a public-internet
      VPN tunnel.
  - id: B
    text: Azure VPN Gateway
    explanation: VPN Gateway supports encrypted site-to-site VPN connectivity between an on-premises network
      and an Azure VNet.
  - id: C
    text: Azure DNS
    explanation: DNS resolves names and does not create encrypted network tunnels.
  - id: D
    text: Azure Private Link
    explanation: Private Link provides private access to supported services, not general site-to-site
      connectivity.
  correct:
  - B
  explanation: Azure VPN Gateway establishes encrypted VPN tunnels for scenarios such as site-to-site,
    point-to-site, and VNet-to-VNet connectivity.
  difficulty: medium
  tags:
  - objective:as-dns-vpn-expressroute
  references:
  - https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpngateways
- id: 47
  domain: azure-architecture-services
  topic: compute-networking
  type: single
  text: A storage service must be reached from an application by a private IP address in the application's
    VNet. Which feature provides that private network interface to a supported Azure service?
  options:
  - id: A
    text: A public endpoint
    explanation: A public endpoint uses a public network path and public IP addressing.
  - id: B
    text: A service endpoint
    explanation: A service endpoint extends VNet identity to a service but does not place a private NIC
      for the service in the VNet.
  - id: C
    text: A private endpoint
    explanation: A private endpoint is a network interface with a private IP address in a VNet subnet
      connected through Private Link.
  - id: D
    text: A management group
    explanation: Management groups organize subscriptions for governance and have no network interface.
  correct:
  - C
  explanation: A private endpoint uses Azure Private Link to give a supported service a private-IP connection
    in a VNet; correct DNS configuration is also required.
  difficulty: medium
  tags:
  - objective:as-endpoints
  references:
  - https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
- id: 48
  domain: azure-architecture-services
  topic: storage
  type: single
  text: A background worker must process work items independently from the web application that creates
    them. Which Azure Storage service is designed to hold those asynchronous messages?
  options:
  - id: A
    text: Azure Blob Storage
    explanation: Blob Storage is object storage for unstructured data, not a message queue.
  - id: B
    text: Azure Files
    explanation: Azure Files provides managed file shares.
  - id: C
    text: Azure Table Storage
    explanation: Table Storage is a schemaless NoSQL key/attribute store.
  - id: D
    text: Azure Queue Storage
    explanation: Queue Storage stores messages that decouple application components and support asynchronous
      work.
  correct:
  - D
  explanation: Azure Queue Storage is appropriate for holding messages while independent workers process
    a backlog.
  difficulty: easy
  tags:
  - objective:as-storage-services
  references:
  - https://learn.microsoft.com/en-us/azure/storage/queues/storage-queues-introduction
- id: 49
  domain: azure-architecture-services
  topic: storage
  type: single
  text: A compliance archive contains blobs that are rarely retrieved and can tolerate retrieval latency
    measured in hours. Which Blob Storage access tier is the best fit?
  options:
  - id: A
    text: Archive
    explanation: Archive is an offline tier for rarely accessed blob data with flexible retrieval latency;
      blobs must be rehydrated for normal reads.
  - id: B
    text: Hot
    explanation: Hot is optimized for data accessed or modified frequently.
  - id: C
    text: Cool
    explanation: Cool is online and intended for infrequently accessed data that remains immediately available.
  - id: D
    text: Cold
    explanation: Cold is online for rarely accessed data that still requires fast retrieval.
  correct:
  - A
  explanation: Archive is the offline Blob Storage tier for very infrequently accessed data when hours
    of retrieval latency are acceptable.
  difficulty: medium
  tags:
  - objective:as-storage-tiers
  references:
  - https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
- id: 50
  domain: azure-architecture-services
  topic: storage
  type: single
  text: A storage account must keep synchronous copies of data across availability zones in its primary
    region, but does not require a secondary-region copy. Which redundancy option meets the requirement?
  options:
  - id: A
    text: Locally redundant storage (LRS)
    explanation: LRS keeps copies in one physical datacenter and does not span zones.
  - id: B
    text: Zone-redundant storage (ZRS)
    explanation: ZRS synchronously replicates data across availability zones in the primary region.
  - id: C
    text: Geo-redundant storage (GRS)
    explanation: GRS adds asynchronous replication to a secondary region but is not the stated primary-region
      zone-redundancy choice.
  - id: D
    text: Read-access geo-zone-redundant storage (RA-GZRS)
    explanation: RA-GZRS includes geo-replication and secondary read access beyond the stated requirement.
  correct:
  - B
  explanation: ZRS provides zone-level redundancy in the primary region without adding a secondary-region
    replica.
  difficulty: medium
  tags:
  - objective:as-storage-redundancy
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
- id: 51
  domain: azure-architecture-services
  topic: storage
  type: single
  text: Which storage account type is generally recommended for common workloads that need Blob, Files,
    Queue, and Table services?
  options:
  - id: A
    text: A premium page blob account
    explanation: Premium page blob accounts are specialized and do not provide the full common-service
      set described.
  - id: B
    text: A premium file shares account
    explanation: Premium file shares accounts are specialized for Azure Files performance.
  - id: C
    text: A standard general-purpose v2 account
    explanation: General-purpose v2 is the recommended account type for many common scenarios and supports
      these core storage services.
  - id: D
    text: A managed disk
    explanation: A managed disk is VM block storage, not a storage account type for all listed services.
  correct:
  - C
  explanation: Standard general-purpose v2 storage accounts support the core Azure Storage services used
    in many general workloads.
  difficulty: medium
  tags:
  - objective:as-storage-account-types
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
- id: 52
  domain: azure-architecture-services
  topic: storage
  type: single
  text: An administrator needs a scriptable command-line tool to copy and synchronize data to, from, and
    between supported Azure Storage locations. Which tool should the administrator use?
  options:
  - id: A
    text: Azure Migrate
    explanation: Azure Migrate helps assess and coordinate workload migration rather than performing general
      storage copy commands.
  - id: B
    text: Azure Storage Explorer
    explanation: Storage Explorer is an interactive graphical tool for browsing and managing storage resources.
  - id: C
    text: Azure File Sync
    explanation: Azure File Sync maintains synchronization between Windows Servers and Azure file shares.
  - id: D
    text: AzCopy
    explanation: AzCopy is a command-line utility for scripted copy and synchronization involving supported
      Azure Storage locations.
  correct:
  - D
  explanation: AzCopy is suited to controlled, scriptable network transfers and synchronization for supported
    Azure Storage locations.
  difficulty: easy
  tags:
  - objective:as-file-movement
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10
- id: 53
  domain: azure-architecture-services
  topic: storage
  type: single
  text: A company wants its Windows Server file servers to keep local caches synchronized with a central
    Azure file share. Which service is designed for this hybrid file-server scenario?
  options:
  - id: A
    text: Azure File Sync
    explanation: Azure File Sync synchronizes Windows Server file caches with a central Azure file share
      and can tier infrequently used data.
  - id: B
    text: Azure Data Box
    explanation: Data Box is for offline bulk data transfer using a shipped device.
  - id: C
    text: Azure Queue Storage
    explanation: Queue Storage holds messages, not synchronized file shares.
  - id: D
    text: Azure Virtual Network peering
    explanation: VNet peering connects networks and does not synchronize files.
  correct:
  - A
  explanation: Azure File Sync is a hybrid file-server solution for synchronizing Windows Server file
    data with Azure Files.
  difficulty: medium
  tags:
  - objective:as-file-movement
  references:
  - https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
- id: 54
  domain: azure-architecture-services
  topic: storage
  type: single
  text: A company must transfer a very large dataset to Azure, but its available network bandwidth makes
    an online transfer impractical. Which option is most appropriate?
  options:
  - id: A
    text: Azure Storage Explorer
    explanation: Storage Explorer is a graphical client tool and still requires a practical network transfer
      path.
  - id: B
    text: Azure Data Box
    explanation: Data Box supports offline bulk transfer by shipping a secure device for local copy and
      return processing.
  - id: C
    text: Azure DNS
    explanation: Azure DNS resolves domain names and does not move data.
  - id: D
    text: Azure RBAC
    explanation: Azure RBAC authorizes Azure resource actions and does not transfer data.
  correct:
  - B
  explanation: Azure Data Box is intended for large offline data transfers when online network transfer
    is not practical.
  difficulty: medium
  tags:
  - objective:as-migration-options
  references:
  - https://learn.microsoft.com/en-us/azure/databox/data-box-overview
- id: 55
  domain: azure-architecture-services
  topic: storage
  type: single
  text: Which redundancy option provides zone redundancy in the primary region, asynchronous replication
    to a secondary region, and read access to that secondary region before failover?
  options:
  - id: A
    text: ZRS
    explanation: ZRS spans zones in the primary region but has no secondary-region replica.
  - id: B
    text: GRS
    explanation: GRS replicates to a secondary region but does not provide secondary read access before
      failover.
  - id: C
    text: RA-GZRS
    explanation: Read-access geo-zone-redundant storage combines primary-region zone redundancy, geo-replication,
      and secondary read access.
  - id: D
    text: LRS
    explanation: LRS keeps copies in one primary-region datacenter.
  correct:
  - C
  explanation: RA-GZRS provides both zone resilience in the primary region and read access to the asynchronously
    replicated secondary region.
  difficulty: hard
  tags:
  - objective:as-storage-redundancy
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
- id: 56
  domain: azure-architecture-services
  topic: storage
  type: single
  text: Why should a team not treat Azure Storage redundancy as a replacement for backup?
  options:
  - id: A
    text: Redundancy works only for managed disks
    explanation: Azure Storage redundancy applies to supported storage data; it is not limited to managed
      disks.
  - id: B
    text: Redundancy disables all data replication
    explanation: Redundancy creates copies; it does not disable replication.
  - id: C
    text: Backups cannot be stored in Azure
    explanation: Azure can be used in backup and recovery designs.
  - id: D
    text: Deletions or overwrites can be replicated to redundant copies
    explanation: Replication protects against certain infrastructure failures but can propagate logical
      changes, so recovery controls remain necessary.
  correct:
  - D
  explanation: Storage redundancy addresses durability and availability failures, whereas backup and recovery
    features are needed to protect against accidental deletion and logical corruption.
  difficulty: hard
  tags:
  - objective:as-storage-redundancy
  references:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
- id: 57
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: Which Microsoft cloud service provides the identity and access-management foundation for users,
    groups, applications, devices, and resources?
  options:
  - id: A
    text: Microsoft Entra ID
    explanation: Microsoft Entra ID is Microsoft's cloud identity and access-management service.
  - id: B
    text: Microsoft Defender for Cloud
    explanation: Defender for Cloud helps improve security posture and protect workloads; it is not the
      directory service.
  - id: C
    text: Azure Resource Manager
    explanation: Azure Resource Manager is Azure's management layer, not an identity directory.
  - id: D
    text: Azure VPN Gateway
    explanation: VPN Gateway provides encrypted network connectivity, not identity management.
  correct:
  - A
  explanation: Microsoft Entra ID manages cloud identities and supports sign-in, access policies, and
    access to integrated services.
  difficulty: easy
  tags:
  - objective:as-directory-services
  references:
  - https://learn.microsoft.com/en-us/entra/fundamentals/what-is-entra
- id: 58
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: Which statement correctly distinguishes authentication from authorization in Azure?
  options:
  - id: A
    text: Authentication determines the Azure region where a resource runs, while authorization selects
      its SKU
    explanation: Region and SKU selection are deployment decisions, not identity decisions.
  - id: B
    text: Authentication verifies who a principal is, while authorization determines what it may do
    explanation: Authentication proves identity; authorization evaluates permissions for actions and scopes.
  - id: C
    text: Authentication assigns RBAC roles, while authorization supplies an MFA factor
    explanation: RBAC roles are authorization constructs, and MFA is an authentication control.
  - id: D
    text: Authentication creates a resource group, while authorization deploys a VM
    explanation: Resource deployment is a management operation rather than the definition of either term.
  correct:
  - B
  explanation: Authentication answers who a user or principal is. Authorization answers which actions
    it is allowed to perform.
  difficulty: easy
  tags:
  - objective:as-authentication-methods
  references:
  - https://learn.microsoft.com/en-us/entra/identity/authentication/overview-authentication
- id: 59
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: A supplier needs limited collaboration access to a project in an organization's workforce tenant.
    Which external-identity scenario fits this requirement?
  options:
  - id: A
    text: Create an Azure subscription for the supplier
    explanation: A subscription is a resource-management and billing boundary, not an external collaboration
      identity model.
  - id: B
    text: Add the supplier to an availability set
    explanation: Availability sets distribute VMs and have no identity-collaboration role.
  - id: C
    text: Use Microsoft Entra External ID B2B collaboration with a guest identity
    explanation: B2B collaboration enables invited external users to collaborate in a workforce tenant
      with granted access.
  - id: D
    text: Assign the supplier the Owner role at the management group
    explanation: This grants excessive Azure permissions and is not required to establish external identity
      collaboration.
  correct:
  - C
  explanation: Microsoft Entra External ID B2B collaboration supports guest access for partners; the guest
    should receive only the permissions needed.
  difficulty: medium
  tags:
  - objective:as-external-identities
  references:
  - https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
- id: 60
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: A policy must require MFA when users access a sensitive application from an unfamiliar sign-in
    context. Which Microsoft Entra feature is intended for this if-then access decision?
  options:
  - id: A
    text: Azure RBAC
    explanation: Azure RBAC authorizes Azure resource actions but does not evaluate sign-in context to
      require MFA.
  - id: B
    text: Azure DNS
    explanation: Azure DNS performs name resolution and does not apply access policies.
  - id: C
    text: Microsoft Entra Domain Services
    explanation: Domain Services provides managed domain protocols for compatible legacy workloads.
  - id: D
    text: Microsoft Entra Conditional Access
    explanation: Conditional Access evaluates signals such as user, app, device, location, and risk, then
      applies controls like MFA or blocking access.
  correct:
  - D
  explanation: Conditional Access is Microsoft Entra's context-aware policy engine for applying controls
    such as requiring MFA or a compliant device.
  difficulty: medium
  tags:
  - objective:as-conditional-access
  references:
  - https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
- id: 61
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: A role assignment grants a managed identity permission to read one storage account. Which three
    elements make up that Azure RBAC role assignment?
  options:
  - id: A
    text: Security principal, role definition, and scope
    explanation: RBAC combines the identity receiving access, the allowed permissions, and the scope at
      which they apply.
  - id: B
    text: Subscription, virtual network, and availability zone
    explanation: These are resource organization or placement constructs, not the components of a role
      assignment.
  - id: C
    text: Password, authenticator app, and device compliance
    explanation: These can relate to authentication or Conditional Access, not RBAC assignment structure.
  - id: D
    text: Resource group, region, and storage tier
    explanation: These identify management, placement, and storage characteristics rather than RBAC components.
  correct:
  - A
  explanation: Every Azure RBAC role assignment associates a security principal with a role definition
    at a specific scope.
  difficulty: medium
  tags:
  - objective:as-rbac
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
- id: 62
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: Which principle is part of the Zero Trust security model?
  options:
  - id: A
    text: Trust all requests that originate inside the corporate network
    explanation: Zero Trust does not treat network location as sufficient trust.
  - id: B
    text: Verify explicitly, use least privilege, and assume breach
    explanation: These are the core Zero Trust principles.
  - id: C
    text: Replace every security control with a single firewall
    explanation: Zero Trust uses layered controls and is not a single product or appliance.
  - id: D
    text: Grant permanent broad access to reduce sign-in prompts
    explanation: Least privilege seeks the minimum access needed, not broad permanent permissions.
  correct:
  - B
  explanation: Zero Trust assumes no implicit trust based on location and emphasizes explicit verification,
    least privilege, and breach containment.
  difficulty: medium
  tags:
  - objective:as-zero-trust
  references:
  - https://learn.microsoft.com/en-us/security/zero-trust/zero-trust-overview
- id: 63
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: A design uses MFA for sign-in, RBAC to limit actions, network controls to restrict exposure, encryption
    to protect data, and monitoring to detect threats. Which security concept does this illustrate?
  options:
  - id: A
    text: A single point of failure
    explanation: The design deliberately uses multiple controls rather than relying on one component.
  - id: B
    text: Region pairing
    explanation: Region pairing concerns geographic resilience, not layered security controls.
  - id: C
    text: Defense in depth
    explanation: Defense in depth combines complementary layers so failure of one control does not expose
      the whole system.
  - id: D
    text: Consumption-based billing
    explanation: Consumption-based billing concerns charging for cloud use, not security architecture.
  correct:
  - C
  explanation: Defense in depth applies complementary controls at multiple layers, including identity,
    network, application, data, and detection/response.
  difficulty: medium
  tags:
  - objective:as-defense-in-depth
  references:
  - https://learn.microsoft.com/en-us/azure/security/fundamentals/overview
- id: 64
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: What is the primary purpose of Microsoft Defender for Cloud?
  options:
  - id: A
    text: To act as the Microsoft Entra identity directory
    explanation: Microsoft Entra ID is the cloud directory service.
  - id: B
    text: To replace every backup and disaster-recovery solution
    explanation: Defender for Cloud is not a replacement for backup or recovery planning.
  - id: C
    text: To create private IP addresses for PaaS services
    explanation: Private endpoints provide private IP network interfaces to supported services.
  - id: D
    text: To help improve cloud security posture and protect supported workloads
    explanation: Defender for Cloud provides posture-management, workload-protection, recommendations,
      and findings capabilities depending on configuration.
  correct:
  - D
  explanation: Microsoft Defender for Cloud helps teams assess and improve security posture and protect
    workloads across Azure and supported hybrid or multicloud environments.
  difficulty: medium
  tags:
  - objective:as-defender-for-cloud
  references:
  - https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
- id: 65
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: A user must be able to view, but not modify, resources in only one application resource group.
    What is the least-privileged Azure RBAC approach?
  options:
  - id: A
    text: Assign the Reader role at that resource-group scope
    explanation: Reader provides view access, and assigning it at the resource group limits its reach
      to that application scope.
  - id: B
    text: Assign the Owner role at the subscription scope
    explanation: Owner grants broad management permissions across the subscription and exceeds the requirement.
  - id: C
    text: Assign a Microsoft Entra directory role to the user
    explanation: Directory roles administer identity functions and do not replace Azure resource authorization.
  - id: D
    text: Require MFA without assigning an Azure role
    explanation: MFA authenticates the user but does not grant Azure resource permissions.
  correct:
  - A
  explanation: Azure RBAC follows least privilege by selecting the narrowest practical role and scope;
    Reader at the resource group meets this read-only requirement.
  difficulty: hard
  tags:
  - objective:as-rbac
  references:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
- id: 66
  domain: azure-architecture-services
  topic: identity-security
  type: single
  text: A legacy application requires LDAP, Kerberos or NTLM, domain join, and Group Policy, but the company
    does not want to deploy domain controllers. Which Azure service may meet this need?
  options:
  - id: A
    text: Microsoft Entra Conditional Access
    explanation: Conditional Access applies context-based sign-in policies; it does not provide managed
      domain protocols.
  - id: B
    text: Microsoft Entra Domain Services
    explanation: Entra Domain Services provides managed domain capabilities for compatible workloads needing
      traditional AD DS protocols and features.
  - id: C
    text: Microsoft Defender for Cloud
    explanation: Defender for Cloud provides security posture and workload protection capabilities, not
      domain services.
  - id: D
    text: Azure Resource Manager
    explanation: Azure Resource Manager is the resource-management layer, not a domain service.
  correct:
  - B
  explanation: Microsoft Entra Domain Services supplies managed domain features for compatible legacy
    applications while integrating with Microsoft Entra ID.
  difficulty: medium
  tags:
  - objective:as-directory-services
  references:
  - https://learn.microsoft.com/en-us/entra/identity/domain-services/overview
- id: 67
  domain: management-governance
  topic: cost-management
  type: single
  text: A team runs a virtual machine workload in Azure. Which change is most likely to increase the compute
    portion of its monthly bill?
  options:
  - id: A
    text: Running the VM for more hours each month in a larger size
    explanation: Correct. Compute cost depends on configuration (size) multiplied by measured runtime.
  - id: B
    text: Adding a CostCenter tag to the VM
    explanation: Tags are metadata and do not change meters or rates.
  - id: C
    text: Renaming the resource group that contains the VM
    explanation: A name has no effect on usage or pricing.
  - id: D
    text: Opening the VM in the Azure portal more often
    explanation: Viewing a resource in the portal does not generate compute usage.
  correct:
  - A
  explanation: Bills reflect configuration, measured consumption, and applicable rates. A larger size
    and longer runtime increase compute usage, while tags, names, and portal views do not.
  difficulty: easy
  tags:
  - objective:mg-cost-factors
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/
- id: 68
  domain: management-governance
  topic: cost-management
  type: single
  text: Before deploying anything, a project manager wants to compare the estimated monthly cost of two
    proposed architectures using assumed instance counts, region, and runtime. Which tool should the manager
    use?
  options:
  - id: A
    text: Cost Analysis in Microsoft Cost Management
    explanation: Cost Analysis examines cost data for existing usage, not proposed designs.
  - id: B
    text: Azure pricing calculator
    explanation: Correct. It estimates cost for a planned configuration from the assumptions you enter.
  - id: C
    text: Azure Policy
    explanation: Policy enforces and assesses resource rules; it does not estimate cost.
  - id: D
    text: Azure Service Health
    explanation: Service Health reports service issues and maintenance, not pricing.
  correct:
  - B
  explanation: The pricing calculator is a planning tool for estimating future cost; it does not deploy
    resources or guarantee an invoice amount.
  difficulty: easy
  tags:
  - objective:mg-pricing-calculator
  references:
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
- id: 69
  domain: management-governance
  topic: cost-management
  type: single
  text: Finance notices that last month's Azure spending in a subscription rose sharply and wants to see
    which services drove the increase and how spending is distributed across resource groups. What should
    they use?
  options:
  - id: A
    text: Azure pricing calculator
    explanation: The calculator models proposed configurations; it does not show actual incurred cost.
  - id: B
    text: Azure Status
    explanation: Azure Status shows global service health, not cost data.
  - id: C
    text: Cost analysis in Microsoft Cost Management
    explanation: Correct. It lets you group, filter, and trend cost data by service, resource group, tag,
      and more.
  - id: D
    text: Resource locks
    explanation: Locks protect against accidental changes; they provide no cost reporting.
  correct:
  - C
  explanation: Cost analysis in Microsoft Cost Management is used to inspect actual cost data for an accessible
    scope and period.
  difficulty: medium
  tags:
  - objective:mg-cost-management
  references:
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/quick-acm-cost-analysis
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/overview-cost-management
- id: 70
  domain: management-governance
  topic: cost-management
  type: single
  text: An organization wants to report Azure spending by department and project. Resources are spread
    across several resource groups. Which approach best supports this?
  options:
  - id: A
    text: Assign Azure RBAC roles to each department
    explanation: RBAC controls who can act on resources; it does not label cost for grouping.
  - id: B
    text: Place each department's resources in a separate Azure region
    explanation: Region affects pricing and availability but is not a reporting dimension for departments.
  - id: C
    text: Apply a CanNotDelete lock to every resource
    explanation: Locks protect resources and do not classify cost.
  - id: D
    text: Apply consistent Department and Project tags and group cost by tag
    explanation: Correct. Tags are key-value metadata that supported cost reports can group and filter
      by.
  correct:
  - D
  explanation: Tags classify resources and, where billing data supports them, let teams attribute cost
    to departments or projects.
  difficulty: medium
  tags:
  - objective:mg-tags
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
- id: 71
  domain: management-governance
  topic: cost-management
  type: single
  text: A subscription owner creates a budget in Microsoft Cost Management with an alert at 90 percent
    of the target. When actual cost reaches that threshold, what happens by default?
  options:
  - id: A
    text: The configured recipients are notified and the resources keep running
    explanation: Correct. A budget alert is a notification, not an enforcement mechanism.
  - id: B
    text: All virtual machines in the subscription are stopped
    explanation: Budgets do not stop resources unless you build separate automation.
  - id: C
    text: The subscription is disabled until the next billing period
    explanation: Reaching a budget threshold does not disable a subscription.
  - id: D
    text: New deployments are denied
    explanation: Denying deployments is a policy behavior, not a budget behavior.
  correct:
  - A
  explanation: A budget alerts people or systems when actual or forecast cost reaches a threshold. It
    is not a spending cap.
  difficulty: medium
  tags:
  - objective:mg-cost-management
  references:
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
- id: 72
  domain: management-governance
  topic: cost-management
  type: single
  text: A resource group is tagged Environment = Test. After a new virtual machine is created in that
    group, an administrator sees that the VM has no Environment tag. What explains this?
  options:
  - id: A
    text: Tags can only be applied to subscriptions, not resource groups
    explanation: Tags can be applied to resources, resource groups, and subscriptions.
  - id: B
    text: Resources do not automatically inherit tags from their resource group
    explanation: Correct. Inheritance requires a separate mechanism such as a policy or a Cost Management
      tag inheritance setting.
  - id: C
    text: The VM must be in a different region from the group
    explanation: Region has no bearing on tag presence.
  - id: D
    text: A resource lock removed the tag
    explanation: Locks do not remove tags.
  correct:
  - B
  explanation: Tags are not inherited by default. Organizations can use Azure Policy or supported Cost
    Management settings to apply or require them.
  difficulty: medium
  tags:
  - objective:mg-tags
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
- id: 73
  domain: management-governance
  topic: cost-management
  type: multiple
  text: Two identical configurations of the same Azure service are deployed by different teams, yet their
    charges differ. Which two factors could explain the difference? (Choose 2)
  options:
  - id: A
    text: The display names given to the resource groups
    explanation: Names are labels and do not affect rates.
  - id: B
    text: The regions in which the services were deployed
    explanation: Correct. Region can change available products and their rates.
  - id: C
    text: The tag values applied to the resources
    explanation: Tags classify resources but do not change prices.
  - id: D
    text: Applicable discounts or purchase terms such as reserved capacity
    explanation: Correct. Commercial terms change the effective price for the same usage.
  correct:
  - B
  - D
  explanation: Location and commercial arrangements such as reservations or negotiated prices change the
    effective rate, while names and tags do not.
  difficulty: hard
  tags:
  - objective:mg-cost-factors
  references:
  - https://learn.microsoft.com/en-us/training/modules/describe-cost-management-azure/
- id: 74
  domain: management-governance
  topic: cost-management
  type: single
  text: A colleague makes statements about an estimate created in the Azure pricing calculator. Which
    statement is accurate?
  options:
  - id: A
    text: The calculator deploys the estimated resources into your subscription
    explanation: It only models costs; it never deploys anything.
  - id: B
    text: The estimate locks in the price for the next 12 months
    explanation: An estimate is not a quote or price guarantee.
  - id: C
    text: It is an estimate based on the assumptions you enter, so actual cost depends on real usage and
      account terms
    explanation: Correct. Estimates are planning aids and not invoices.
  - id: D
    text: It automatically stops resources when spending reaches the estimated amount
    explanation: The calculator is not a spending cap.
  correct:
  - C
  explanation: The calculator produces planning estimates from stated assumptions. It does not deploy,
    reserve prices, or limit spending.
  difficulty: hard
  tags:
  - objective:mg-pricing-calculator
  references:
  - https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/pricing-calculator
- id: 75
  domain: management-governance
  topic: governance-compliance
  type: single
  text: A company requires that resources in a subscription can be created only in two approved regions.
    Which Azure feature should it use to enforce this standard?
  options:
  - id: A
    text: Reader role assignments
    explanation: RBAC governs who can do what, not which configurations are allowed.
  - id: B
    text: A ReadOnly resource lock
    explanation: Locks block changes to specific scopes; they do not define allowed regions.
  - id: C
    text: Microsoft Purview
    explanation: Purview governs data, not resource deployment rules.
  - id: D
    text: Azure Policy with an allowed locations definition
    explanation: Correct. A policy assignment can deny deployments outside approved locations.
  correct:
  - D
  explanation: Azure Policy evaluates and enforces organizational standards such as allowed locations
    across a scope.
  difficulty: easy
  tags:
  - objective:mg-policy
  references:
  - https://learn.microsoft.com/en-us/azure/governance/policy/overview
- id: 76
  domain: management-governance
  topic: governance-compliance
  type: single
  text: An administrator wants to stop anyone, including users with the Contributor role, from accidentally
    deleting a production virtual network, while still allowing authorized users to change its configuration.
    What should the administrator apply?
  options:
  - id: A
    text: A CanNotDelete lock
    explanation: Correct. It permits reads and modifications but blocks deletion.
  - id: B
    text: A ReadOnly lock
    explanation: ReadOnly also blocks updates, which would prevent configuration changes.
  - id: C
    text: An Azure Policy with the audit effect
    explanation: Audit only reports noncompliance; it does not block deletion.
  - id: D
    text: A tag named DoNotDelete
    explanation: Tags are metadata and enforce nothing.
  correct:
  - A
  explanation: A CanNotDelete lock prevents deletion regardless of RBAC role while still allowing authorized
    modifications.
  difficulty: medium
  tags:
  - objective:mg-locks
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
- id: 77
  domain: management-governance
  topic: governance-compliance
  type: single
  text: A data governance team needs visibility into where sensitive data lives across its data estate
    and wants to manage its classification and protection to support compliance. Which service is designed
    for this?
  options:
  - id: A
    text: Azure Policy
    explanation: Policy governs Azure resource configuration, not data classification.
  - id: B
    text: Microsoft Purview
    explanation: Correct. Purview provides solutions for governing, protecting, and managing data.
  - id: C
    text: Azure resource locks
    explanation: Locks protect resources from accidental control-plane changes only.
  - id: D
    text: Azure Advisor
    explanation: Advisor provides optimization recommendations, not data governance.
  correct:
  - B
  explanation: Microsoft Purview is a suite of solutions for data governance, data security, and data
    compliance.
  difficulty: easy
  tags:
  - objective:mg-purview
  references:
  - https://learn.microsoft.com/en-us/purview/purview
- id: 78
  domain: management-governance
  topic: governance-compliance
  type: single
  text: A developer holds the Contributor role on a resource group. Creating a storage account in a non-approved
    region fails with a policy violation message. What is the most likely cause?
  options:
  - id: A
    text: The Contributor role cannot create any resources
    explanation: Contributor can create resources, so the role alone is not the cause.
  - id: B
    text: A CanNotDelete lock exists on the resource group
    explanation: A lock on deletion would not produce a policy violation message.
  - id: C
    text: An Azure Policy assignment denies deployments outside approved regions, regardless of the user's
      RBAC permissions
    explanation: Correct. Policy is evaluated in addition to RBAC.
  - id: D
    text: The storage account has no tags
    explanation: Missing tags would only matter if a policy required them, and the question points to
      a region violation.
  correct:
  - C
  explanation: RBAC decides who may make a request; Azure Policy decides whether the request conforms
    to assigned standards. Policy can deny a request that RBAC permits.
  difficulty: medium
  tags:
  - objective:mg-policy
  references:
  - https://learn.microsoft.com/en-us/azure/governance/policy/overview
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
- id: 79
  domain: management-governance
  topic: governance-compliance
  type: single
  text: A CanNotDelete lock is applied to a storage account. A user who has data-plane permission to the
    blob service deletes a blob stored in it. What is the expected outcome?
  options:
  - id: A
    text: The deletion is blocked because the account is locked
    explanation: Locks apply to control-plane operations, not operations on stored data.
  - id: B
    text: The deletion is allowed only if the lock is changed to ReadOnly
    explanation: Changing the lock type does not change the scope of data-plane operations.
  - id: C
    text: The lock restores the blob automatically
    explanation: Locks never restore deleted data.
  - id: D
    text: The deletion succeeds, because the lock protects management operations rather than data inside
      the service
    explanation: Correct. Use data-plane access controls and data protection features for blob content.
  correct:
  - D
  explanation: Resource locks guard against control-plane deletion or modification and are not backups
    or data-plane access controls.
  difficulty: hard
  tags:
  - objective:mg-locks
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
- id: 80
  domain: management-governance
  topic: governance-compliance
  type: single
  text: An administrator wants to assign several related policy definitions, such as allowed locations
    and required tags, to a subscription as one unit. What is a group of policy definitions assigned together
    called?
  options:
  - id: A
    text: An initiative
    explanation: Correct. An initiative bundles policy definitions for assignment as a single unit.
  - id: B
    text: A role definition
    explanation: A role definition is a collection of RBAC permissions.
  - id: C
    text: A management lock
    explanation: A lock restricts deletion or modification of a scope.
  - id: D
    text: A resource tag
    explanation: A tag is a key-value metadata pair.
  correct:
  - A
  explanation: A policy definition describes a single rule; an initiative groups definitions so they can
    be assigned to a scope together.
  difficulty: medium
  tags:
  - objective:mg-policy
  references:
  - https://learn.microsoft.com/en-us/azure/governance/policy/overview
- id: 81
  domain: management-governance
  topic: governance-compliance
  type: single
  text: An administrator applies a CanNotDelete lock to a resource group. Later, a team creates a new
    virtual network in that group. What is true of the new virtual network?
  options:
  - id: A
    text: It is unprotected until its own lock is applied
    explanation: Locks applied at a parent scope cover resources created later.
  - id: B
    text: It inherits the lock and cannot be deleted until the lock is removed
    explanation: Correct. Locks are inherited by child resources, including ones added afterward.
  - id: C
    text: The lock applies only to tags on the group
    explanation: A lock covers the resources in scope, not just tags.
  - id: D
    text: The lock is automatically removed when new resources are deployed
    explanation: Locks stay until an authorized user removes them.
  correct:
  - B
  explanation: Locks set at a parent scope are inherited by existing and later-added resources beneath
    it.
  difficulty: hard
  tags:
  - objective:mg-locks
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
- id: 82
  domain: management-governance
  topic: manage-deploy
  type: single
  text: A new administrator wants a browser-based graphical interface to browse, create, and manage Azure
    resources visually. Which tool fits?
  options:
  - id: A
    text: Azure CLI
    explanation: The CLI is a command-line tool, not a graphical interface.
  - id: B
    text: Bicep
    explanation: Bicep is a language for declaring resources, not a GUI.
  - id: C
    text: Azure portal
    explanation: Correct. The portal is the web-based graphical management interface.
  - id: D
    text: Azure PowerShell
    explanation: Azure PowerShell is a command-line module.
  correct:
  - C
  explanation: The Azure portal offers dashboards, search, and resource views in the browser for visual
    management.
  difficulty: easy
  tags:
  - objective:mg-portal
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
- id: 83
  domain: management-governance
  topic: manage-deploy
  type: single
  text: An administrator is on a shared computer where nothing can be installed. They need to run az commands
    for Azure CLI from a browser session. What should they use?
  options:
  - id: A
    text: Azure Arc
    explanation: Arc extends management to non-Azure resources; it is not a shell.
  - id: B
    text: Azure Advisor
    explanation: Advisor gives recommendations and does not run commands.
  - id: C
    text: Bicep
    explanation: Bicep is an authoring language for deployments, not a terminal.
  - id: D
    text: Azure Cloud Shell
    explanation: Correct. It is a browser-accessible Bash or PowerShell environment with Azure tools preinstalled.
  correct:
  - D
  explanation: Cloud Shell is a hosted environment, available in the portal, that already includes Azure
    CLI and Azure PowerShell.
  difficulty: medium
  tags:
  - objective:mg-shell-cli-powershell
  references:
  - https://learn.microsoft.com/en-us/azure/cloud-shell/overview
- id: 84
  domain: management-governance
  topic: manage-deploy
  type: single
  text: A company runs Linux servers in its own datacenter and Kubernetes clusters in another cloud. It
    wants to manage and govern them from Azure, including applying Azure Policy, without moving the workloads.
    Which service enables this?
  options:
  - id: A
    text: Azure Arc
    explanation: Correct. Arc projects supported non-Azure resources into Azure Resource Manager.
  - id: B
    text: Azure Cloud Shell
    explanation: Cloud Shell is a command environment, not a hybrid management service.
  - id: C
    text: Azure pricing calculator
    explanation: The calculator estimates cost and manages nothing.
  - id: D
    text: Azure Advisor
    explanation: Advisor offers recommendations and does not onboard external resources.
  correct:
  - A
  explanation: Azure Arc extends Azure management and governance to supported resources running on-premises,
    at the edge, or in other clouds.
  difficulty: medium
  tags:
  - objective:mg-arc
  references:
  - https://learn.microsoft.com/en-us/azure/azure-arc/overview
- id: 85
  domain: management-governance
  topic: manage-deploy
  type: single
  text: A team stores files describing its intended Azure resources in source control, reviews changes,
    and deploys them automatically instead of clicking through the portal. Which practice is this?
  options:
  - id: A
    text: Platform as a service
    explanation: PaaS is a cloud service model, not a deployment practice.
  - id: B
    text: Infrastructure as code
    explanation: Correct. Infrastructure is defined in machine-readable files and managed like code.
  - id: C
    text: Resource tagging
    explanation: Tagging labels resources and does not define them.
  - id: D
    text: Cost analysis
    explanation: Cost analysis reviews spending and does not deploy resources.
  correct:
  - B
  explanation: Infrastructure as code defines infrastructure in versionable files, enabling consistency,
    review, and repeatable deployment.
  difficulty: medium
  tags:
  - objective:mg-iac
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
- id: 86
  domain: management-governance
  topic: manage-deploy
  type: multiple
  text: Which two are benefits of using infrastructure as code for Azure deployments? (Choose 2)
  options:
  - id: A
    text: Environments can be recreated consistently from the same definition
    explanation: Correct. A reusable definition supports repeatable deployments.
  - id: B
    text: Users no longer need any permissions to deploy
    explanation: Deployments are still authorized through Azure RBAC.
  - id: C
    text: Definitions can be version controlled and reviewed before deployment
    explanation: Correct. Files can use source control and review processes.
  - id: D
    text: Every deployment is guaranteed to succeed
    explanation: Provider behavior, permissions, and current state can still cause failures.
  correct:
  - A
  - C
  explanation: IaC improves consistency, reuse, review, and change history. It does not remove permission
    needs or guarantee success.
  difficulty: medium
  tags:
  - objective:mg-iac
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview
- id: 87
  domain: management-governance
  topic: manage-deploy
  type: single
  text: Requests from the Azure portal, Azure CLI, Azure PowerShell, and SDKs are all authenticated and
    authorized by the same Azure layer before reaching resource providers. What is that layer?
  options:
  - id: A
    text: A JSON template file
    explanation: A template is a file declaring resources, not the management service.
  - id: B
    text: Azure Cloud Shell
    explanation: Cloud Shell is one environment that sends requests; it is not the shared layer.
  - id: C
    text: Azure Resource Manager
    explanation: Correct. ARM is the deployment and management service that processes management requests.
  - id: D
    text: Azure Advisor
    explanation: Advisor produces recommendations and does not process management requests.
  correct:
  - C
  explanation: Azure Resource Manager provides consistent management capabilities such as deployment,
    access control, tags, and locks across every client tool.
  difficulty: hard
  tags:
  - objective:mg-arm
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
- id: 88
  domain: management-governance
  topic: manage-deploy
  type: single
  text: A developer prefers a more concise syntax than raw JSON for declaring Azure resources but still
    wants deployments to go through Azure Resource Manager. Which option fits?
  options:
  - id: A
    text: A separate imperative tool that bypasses Resource Manager
    explanation: Azure deployments of this kind go through Resource Manager.
  - id: B
    text: The Azure portal dashboard
    explanation: A dashboard is a visual interface, not a declarative language.
  - id: C
    text: A replacement service that supersedes Azure Resource Manager
    explanation: Nothing replaces the Resource Manager service.
  - id: D
    text: Bicep, a declarative language that is converted to an ARM template when deployed
    explanation: Correct. Bicep is an alternative authoring format for ARM deployments.
  correct:
  - D
  explanation: Bicep offers simpler declarative authoring and compiles to an ARM template, so deployments
    still use Azure Resource Manager.
  difficulty: medium
  tags:
  - objective:mg-arm
  - objective:mg-iac
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
- id: 89
  domain: management-governance
  topic: manage-deploy
  type: single
  text: An operations team scripts Azure tasks in PowerShell and wants cmdlets, such as Get-AzResourceGroup,
    that return objects they can pipe into other commands. Which tool should they use?
  options:
  - id: A
    text: Azure PowerShell
    explanation: Correct. The Az module provides cmdlets that return structured objects.
  - id: B
    text: Azure CLI
    explanation: The CLI uses az commands, not PowerShell cmdlets.
  - id: C
    text: The Azure portal
    explanation: The portal is a graphical interface, not a scripting tool.
  - id: D
    text: Azure Monitor
    explanation: Azure Monitor is for telemetry and alerts.
  correct:
  - A
  explanation: Azure PowerShell is the set of Az PowerShell modules for managing Azure with cmdlets and
    object pipelines.
  difficulty: medium
  tags:
  - objective:mg-shell-cli-powershell
  references:
  - https://learn.microsoft.com/en-us/powershell/azure/what-is-azure-powershell
  - https://learn.microsoft.com/en-us/cli/azure/what-is-azure-cli
- id: 90
  domain: management-governance
  topic: manage-deploy
  type: single
  text: An on-premises server is connected to Azure Arc. Which statement correctly describes the result?
  options:
  - id: A
    text: The server is migrated into an Azure datacenter
    explanation: Arc does not move the workload.
  - id: B
    text: The server keeps running where it is and is represented in Azure Resource Manager for management
    explanation: Correct. Arc extends management without changing where the compute runs.
  - id: C
    text: The server becomes a virtual machine scale set
    explanation: Arc does not convert servers into Azure compute resources.
  - id: D
    text: The server's workload runs on the Cloud Shell host
    explanation: Cloud Shell is unrelated to where the server runs.
  correct:
  - B
  explanation: Arc projects supported non-Azure resources into Azure for management, while the workload
    stays in its original location.
  difficulty: hard
  tags:
  - objective:mg-arc
  references:
  - https://learn.microsoft.com/en-us/azure/azure-arc/overview
- id: 91
  domain: management-governance
  topic: manage-deploy
  type: single
  text: A team will deploy the same ARM template to a production subscription and wants to preview which
    resources would be created, modified, or deleted before running the deployment. Which capability helps?
  options:
  - id: A
    text: Cost analysis
    explanation: Cost analysis reviews spending, not planned deployment changes.
  - id: B
    text: Azure Service Health
    explanation: Service Health reports platform events, not template changes.
  - id: C
    text: The ARM template what-if operation
    explanation: Correct. What-if previews the changes a deployment would make.
  - id: D
    text: Resource Health
    explanation: Resource Health shows the availability of an existing resource.
  correct:
  - C
  explanation: The what-if operation shows the expected effect of a template deployment so changes can
    be reviewed before applying.
  difficulty: medium
  tags:
  - objective:mg-arm
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/deploy-what-if
- id: 92
  domain: management-governance
  topic: monitoring
  type: single
  text: Which Azure service analyzes resource configuration and usage and offers personalized recommendations
    for cost, reliability, performance, security, and operational excellence?
  options:
  - id: A
    text: Azure Service Health
    explanation: Service Health covers service issues and planned maintenance.
  - id: B
    text: Azure Status
    explanation: Azure Status is a global status page.
  - id: C
    text: Log Analytics
    explanation: Log Analytics queries collected log data.
  - id: D
    text: Azure Advisor
    explanation: Correct. Advisor provides optimization recommendations across these categories.
  correct:
  - D
  explanation: Azure Advisor reviews deployments and recommends improvements in cost, reliability, performance,
    security, and operational excellence.
  difficulty: easy
  tags:
  - objective:mg-advisor
  references:
  - https://learn.microsoft.com/en-us/azure/advisor/advisor-overview
- id: 93
  domain: management-governance
  topic: monitoring
  type: single
  text: A company wants to be notified when planned maintenance or a service issue could affect the Azure
    regions and services its subscription uses. Which should it configure?
  options:
  - id: A
    text: Azure Service Health alerts
    explanation: Correct. Service Health gives personalized notices and supports alerts for issues and
      maintenance.
  - id: B
    text: Azure Advisor cost recommendations
    explanation: Advisor offers optimization guidance, not incident or maintenance notices.
  - id: C
    text: Application Insights availability tests
    explanation: These test an application endpoint rather than report platform events.
  - id: D
    text: The Azure pricing calculator
    explanation: The calculator estimates costs and sends no notifications.
  correct:
  - A
  explanation: Azure Service Health provides personalized information about service issues, planned maintenance,
    and advisories relevant to the customer.
  difficulty: medium
  tags:
  - objective:mg-service-health
  references:
  - https://learn.microsoft.com/en-us/azure/service-health/overview
- id: 94
  domain: management-governance
  topic: monitoring
  type: single
  text: A single virtual machine became unavailable, and an engineer wants to see the availability status
    of that specific resource and what may have caused it. Which view is most appropriate?
  options:
  - id: A
    text: Azure Status
    explanation: Azure Status is a broad public view that may not show customer-specific impact.
  - id: B
    text: Resource Health
    explanation: Correct. Resource Health focuses on the health of an individual Azure resource.
  - id: C
    text: Azure Advisor
    explanation: Advisor provides recommendations, not resource availability history.
  - id: D
    text: Cost analysis
    explanation: Cost analysis shows spending, not availability.
  correct:
  - B
  explanation: Resource Health is part of the Azure health experiences and reports the health of a specific
    resource, while Service Health and Azure Status are broader.
  difficulty: hard
  tags:
  - objective:mg-service-health
  references:
  - https://learn.microsoft.com/en-us/azure/service-health/resource-health-overview
  - https://learn.microsoft.com/en-us/azure/service-health/azure-status-overview
- id: 95
  domain: management-governance
  topic: monitoring
  type: single
  text: An operations team wants to be emailed whenever a virtual machine's CPU metric stays above a threshold
    for ten minutes. Which feature should they configure?
  options:
  - id: A
    text: An Azure Advisor recommendation
    explanation: Advisor recommendations are not threshold-based alert notifications.
  - id: B
    text: An Azure Service Health maintenance notice
    explanation: Service Health covers platform events, not VM CPU metrics.
  - id: C
    text: An Azure Monitor alert rule with an action group
    explanation: Correct. Alert rules evaluate signals and the action group sends the notification.
  - id: D
    text: An Azure Policy audit definition
    explanation: Policy audits resource configuration compliance, not runtime metrics.
  correct:
  - C
  explanation: Azure Monitor alert rules evaluate metrics or queries and can notify people or trigger
    actions through action groups.
  difficulty: medium
  tags:
  - objective:mg-azure-monitor
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview
- id: 96
  domain: management-governance
  topic: monitoring
  type: single
  text: An analyst needs to write queries in Kusto Query Language (KQL) against log data collected from
    many Azure resources. Which Azure Monitor experience supports this?
  options:
  - id: A
    text: Azure Advisor
    explanation: Advisor does not provide a log query environment.
  - id: B
    text: Resource Health
    explanation: Resource Health shows resource availability, not KQL queries.
  - id: C
    text: Azure Status
    explanation: Azure Status is a public status page.
  - id: D
    text: Log Analytics
    explanation: Correct. Log Analytics queries log data in a Log Analytics workspace with KQL.
  correct:
  - D
  explanation: Log Analytics is the Azure Monitor experience for querying log and trace data in workspaces
    using KQL.
  difficulty: hard
  tags:
  - objective:mg-azure-monitor
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-overview
- id: 97
  domain: management-governance
  topic: monitoring
  type: multiple
  text: A development team has instrumented a web application with Application Insights. Which two questions
    can it help answer? (Choose 2)
  options:
  - id: A
    text: Which requests are failing and which dependency calls are slow?
    explanation: Correct. Application Insights provides failure and performance views for application
      telemetry.
  - id: B
    text: Which Azure regions have planned platform maintenance?
    explanation: That is a Service Health question.
  - id: C
    text: What would a new architecture cost each month?
    explanation: That is a pricing calculator question.
  - id: D
    text: Is the application endpoint available when tested on a schedule?
    explanation: Correct. Application Insights supports availability monitoring.
  correct:
  - A
  - D
  explanation: Application Insights is an application performance monitoring feature covering availability,
    failures, and performance.
  difficulty: medium
  tags:
  - objective:mg-app-insights
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview
- id: 98
  domain: management-governance
  topic: monitoring
  type: single
  text: Developers need an application map and request, failure, and performance data to find where a
    web application is slow. Which service should they use?
  options:
  - id: A
    text: Application Insights
    explanation: Correct. It collects and analyzes application telemetry for performance diagnosis.
  - id: B
    text: Azure Service Health
    explanation: Service Health describes Azure platform events, not code-level latency.
  - id: C
    text: Azure Advisor
    explanation: Advisor offers general recommendations rather than request-level telemetry.
  - id: D
    text: Azure Status
    explanation: Azure Status does not reveal application behavior.
  correct:
  - A
  explanation: Application Insights provides views such as application map, failures, and performance
    for diagnosing application behavior.
  difficulty: easy
